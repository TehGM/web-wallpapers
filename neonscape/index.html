     leading edge stands over the whole fascia as one hard transverse
     line. Both are the front's signature; without them the face is
     just four rectangles on a blank.

   Which is why this one is lofted on a 14-point ring rather than the
   Countach's 10: the two extra creases per side are the flank groove
   and the bonnet/roof shoulder, and they are the folds the car is
   made of. The extra 340 triangles are two thousandths of a frame.

        z,     yb,     ws,    wLo,    ysl,    wGr,    ygr,    wHi,     yf,     wt,     yt,    wIn,    yIn,    ytc    */
const DELOREAN_ST = [
  [-2.050, 0.300, 0.560, 0.780, 0.380, 0.836, 0.545, 0.832, 0.700, 0.790, 0.845, 0.600, 0.822, 0.815], //  0 tail face
  [-1.985, 0.200, 0.650, 0.820, 0.375, 0.844, 0.560, 0.840, 0.720, 0.802, 0.872, 0.610, 0.836, 0.828], //  1 deck trailing edge
  [-1.610, 0.160, 0.800, 0.878, 0.290, 0.889, 0.578, 0.882, 0.762, 0.762, 0.978, 0.585, 0.932, 0.924], //  2 arch back / quarter glass rear
  [-1.380, 0.160, 0.560, 0.904, 0.735, 0.904, 0.755, 0.892, 0.775, 0.722, 1.020, 0.570, 0.972, 0.964], //  3
  [-1.169, 0.155, 0.530, 0.915, 0.741, 0.915, 0.760, 0.898, 0.780, 0.682, 1.055, 0.560, 1.006, 0.998], //  4 rear axle
  [-0.960, 0.155, 0.560, 0.922, 0.735, 0.922, 0.755, 0.902, 0.782, 0.632, 1.088, 0.552, 1.040, 1.032], //  5
  [-0.843, 0.155, 0.720, 0.912, 0.470, 0.924, 0.596, 0.902, 0.782, 0.570, 1.100, 0.330, 1.100, 1.100], //  6 roof rear
  [-0.780, 0.155, 0.800, 0.911, 0.290, 0.923, 0.594, 0.900, 0.782, 0.575, 1.118, 0.325, 1.118, 1.118], //  7 arch front / quarter-vent
  [-0.585, 0.155, 0.792, 0.914, 0.366, 0.925, 0.592, 0.897, 0.781, 0.578, 1.132, 0.320, 1.132, 1.132], //  8 door glass, rear edge
  [ 0.084, 0.155, 0.770, 0.910, 0.370, 0.922, 0.588, 0.888, 0.780, 0.560, 1.108, 0.320, 1.108, 1.108], //  9 screen head
  [ 0.675, 0.155, 0.780, 0.905, 0.370, 0.917, 0.585, 0.880, 0.775, 0.830, 0.804, 0.505, 0.808, 0.808], // 10 cowl
  [ 0.790, 0.155, 0.790, 0.906, 0.370, 0.918, 0.583, 0.878, 0.773, 0.828, 0.798, 0.505, 0.802, 0.802], // 11 cowl vent, front edge
  [ 0.900, 0.155, 0.800, 0.899, 0.290, 0.911, 0.580, 0.874, 0.770, 0.822, 0.792, 0.502, 0.796, 0.796], // 12 arch back
  [ 1.100, 0.155, 0.560, 0.905, 0.655, 0.905, 0.672, 0.868, 0.762, 0.815, 0.778, 0.500, 0.782, 0.782], // 13
  [ 1.244, 0.155, 0.530, 0.899, 0.661, 0.899, 0.678, 0.862, 0.756, 0.808, 0.766, 0.498, 0.770, 0.770], // 14 front axle
  [ 1.400, 0.155, 0.560, 0.892, 0.655, 0.892, 0.672, 0.856, 0.748, 0.800, 0.752, 0.495, 0.756, 0.756], // 15
  [ 1.560, 0.160, 0.800, 0.860, 0.290, 0.872, 0.566, 0.848, 0.732, 0.792, 0.740, 0.490, 0.744, 0.744], // 16 arch front
  [ 1.900, 0.180, 0.745, 0.828, 0.340, 0.840, 0.530, 0.830, 0.682, 0.776, 0.700, 0.480, 0.703, 0.703], // 17
  [ 2.000, 0.215, 0.655, 0.792, 0.330, 0.822, 0.478, 0.818, 0.598, 0.760, 0.676, 0.474, 0.678, 0.678], // 18 bonnet leading edge
  [ 2.030, 0.240, 0.585, 0.748, 0.320, 0.802, 0.448, 0.800, 0.552, 0.742, 0.642, 0.464, 0.644, 0.644], // 19 fascia face
];
/** One DeLorean station → 14 ring points, counter-clockwise in xy. The
    Countach's five half-points plus one: (wIn, yIn) sits between the
    top edge and the centreline, and it is doing two jobs. Along the
    bonnet it is the shoulder crease at ±500 mm that separates the flat
    centre panel from the wing tops — the fold that makes the nose read
    as folded paper instead of a blister. Over the engine it is the lip
    of the louvre bay, so the sail panels can stand proud of a FLAT bay
    floor; run the deck straight from the sail edge to the centreline,
    as a 10-point ring must, and the recess the louvres sit in does not
    exist at all.                                                      */
function dmcRing(st){
  const [z, yb, ws, wLo, ysl, wGr, ygr, wHi, yf, wt, yt, wIn, yIn, ytc] = st;
  const half = [[ws, yb + 0.02], [wLo, ysl], [wGr, ygr],
                [wHi, yf], [wt, yt], [wIn, yIn]];
  const out = [[0, yb, z], ...half.map(([x, y]) => [x, y, z]), [0, ytc, z]];
  for (let i = half.length - 1; i >= 0; i--)
    out.push([-half[i][0], half[i][1], z]);
  return out;
}
/* Skin material for span i (station i → i+1), ring edge k.
   k: 0 underbody R · 1 rocker + wheel well R · 2 lower flank R
      3 upper flank R · 4 glasshouse / sail flank R · 5 shoulder R
      6 centre panel R · 7 centre panel L · 8 shoulder L · 9 glasshouse L
      10 upper flank L · 11 lower flank L · 12 rocker L · 13 underbody L

   k1/k12 dark on EVERY span is the single highest-value line in this
   function: one band paints the black rocker stripe that runs the
   whole car, the wheel-well faces, and the undercut below the sills,
   and it comes free out of geometry the arch trick already needs.
   k4/k9 is the other one, and it is where the "cabin beams" live. Read
   along the flank it alternates: black A-pillar (the post itself is
   stainless, but the door seal bonded over it reads black), long door
   glass, then 260 mm of BRIGHT stainless B-pillar — that one is worth
   getting right, since the instinct is to paint it black and the real
   car's is body-coloured with one black louvre insert plugged into it —
   then the long quarter window in the sail. Bright/dark/bright/dark in
   that order is most of what stops the glasshouse reading as one smooth
   dark blob.                                                          */
function deloreanSkin(i, k){
  if (k === 0 || k === 13 || k === 1 || k === 12) return CAR_TRIM;
  const beam = k === 4 || k === 9;         // glasshouse band / sail flank
  const top  = k >= 5 && k <= 8;           // shoulder + centre panels
  const mid  = k === 6 || k === 7;         // centre panel only
  if (i === 18) return CAR_FASCIA;         // the whole nose below the shutline
  if (i >= 1 && i <= 5){                   // engine deck
    if (top) return CAR_TRIM;              //   louvre bay, sunk between the sails
    if (beam && i >= 2) return CAR_GLASS;  //   rear quarter windows
    return CAR_BODY;                       //   sail flank behind them
  }
  if (i === 8 && beam) return CAR_GLASS;   // door glass
  if (i === 9) return beam ? CAR_TRIM      // A-pillar
                           : top ? CAR_GLASS : CAR_BODY;   // windscreen
  if (i === 10 && mid) return CAR_TRIM;    // cowl vent at the screen base
  return CAR_BODY;
}
/** build the DeLorean; returns { solid, wire, split, wireSplit } */
function buildDeLorean(){
  const B = carBuilder();

  /* ── shell ── */
  const rings = DELOREAN_ST.map(dmcRing);
  const n = rings[0].length;
  for (let i = 0; i < rings.length - 1; i++){
    const a = rings[i], b = rings[i + 1];
    for (let k = 0; k < n; k++){
      const k1 = (k + 1) % n;
      B.poly([a[k], a[k1], b[k1], b[k]], deloreanSkin(i, k));
    }
  }
  /* The nose cap is FASCIA and the tail cap is not. That asymmetry is
     the car: the entire front below the bonnet shutline is one dark
     grey moulding, while at the back the panel the lamps and plate sit
     in is body-coloured and only the bumper below it is dark.        */
  const capC = st => [0, (st[1] + st[13]) * 0.5, st[0]];
  const first = rings[0], last = rings[rings.length - 1];
  const c0 = capC(DELOREAN_ST[0]), c1 = capC(DELOREAN_ST[DELOREAN_ST.length - 1]);
  for (let k = 0; k < n; k++){
    const k1 = (k + 1) % n;
    B.poly([c0, first[k1], first[k]], CAR_BODY);
    B.poly([c1, last[k], last[k1]], CAR_FASCIA);
  }

  /* ── wheels — the stagger is the stance. Both tyres come within a
        few millimetres of the flank above them, so each fills its arch
        instead of sitting in a hole; 16 segments with every second
        wedge dark is as much of the turbine alloys as any wallpaper
        pixel budget will resolve.                                   */
  carWheels(B, 0.795,  1.244, 0.295,  0.0975, 0.183, SPIN_WF, 16, 2);
  carWheels(B, 0.795, -1.169, 0.3315, 0.1175, 0.196, SPIN_WR, 16, 2);

  /* ── front ──
     ONE continuous lit slot, 1430 mm wide, is the whole face: four
     165 x 100 sealed beams in two pairs at ±366–531 and ±549–714, and
     between them a slatted grille filling the gap at ±360. Top and
     bottom edges shared by all three. Splitting the lamps and the
     grille into separate features at different heights — or leaving the
     grille out, as the last pass did — is the single biggest reason a
     DeLorean model comes out looking like a generic wedge.

     The vertical stack is tight, and that tightness is the point: the
     bonnet's leading edge oversails the whole slot only 30 mm above it,
     then the grey bumper band with the ambers at ±440–565 tucked under
     the INBOARD lamp of each pair — NOT out at the corners — the plate
     between them, and the lower mesh intake, which is where all the
     radiator air actually goes. The DMC grille is decorative.        */
  {
    const GY0 = 0.527, GY1 = 0.653;                       // grille band
    const LY0 = 0.540, LY1 = 0.640;                       // sealed-beam band
    B.box(-0.360, 0.360, GY0, GY1, 2.018, 2.038, CAR_TRIM, NO_SPIN);
    for (let j = 0; j < 8; j++){          // ten fins on the car; eight is
      const y = GY0 + 0.006 + j * 0.0148; //   all a wallpaper can resolve
      B.box(-0.356, 0.356, y, y + 0.0072, 2.034, 2.050, CAR_FASCIA, NO_SPIN);
    }
    B.boxM(0.351, 0.546, LY0 - 0.008, LY1 + 0.008, 2.018, 2.040,
           CAR_TRIM, NO_SPIN);                            // black lamp pocket
    B.boxM(0.534, 0.729, LY0 - 0.008, LY1 + 0.008, 2.018, 2.040,
           CAR_TRIM, NO_SPIN);
    B.boxM(0.366, 0.531, LY0, LY1, 2.026, 2.052,
           CAR_TRIM, NO_SPIN, { pz: CAR_HEAD });          // inner beam
    B.boxM(0.549, 0.714, LY0, LY1, 2.026, 2.052,
           CAR_TRIM, NO_SPIN, { pz: CAR_HEAD });          // outer beam
  }
  /* The bonnet's leading edge, as a lip standing over the fascia rather
     than a crease drawn on it. It is the hardest line on the front of
     the real car — the stainless ends, oversails the dark moulding, and
     puts a shadow straight across the top of the lamps. Modelled flush
     it disappears; this way it survives at eighty pixels wide.        */
  B.hex([[-0.765,0.662,1.940], [0.765,0.662,1.940], [0.765,0.700,1.940], [-0.765,0.700,1.940],
         [-0.735,0.658,2.074], [0.735,0.658,2.074], [0.735,0.682,2.074], [-0.735,0.682,2.074]],
        CAR_BODY, NO_SPIN);
  /* Bumper band. Not a bar — a moulded band in the same grey fascia,
     standing ~25 mm proud and wrapping unbroken to the arches. Only the
     grille, the lamp pockets and the bottom lip are black on this car;
     painting the whole nose black loses the grey/stainless two-tone. */
  B.hex([[-0.862,0.395,1.990], [0.862,0.395,1.990], [0.862,0.515,1.990], [-0.862,0.515,1.990],
         [-0.790,0.395,2.108], [0.790,0.395,2.108], [0.790,0.515,2.108], [-0.790,0.515,2.108]],
        CAR_FASCIA, NO_SPIN);
  B.boxM(0.440, 0.565, 0.430, 0.487, 2.096, 2.116, CAR_TRIM, NO_SPIN, { pz: CAR_AMBER });
  /* the plate fills the band's full height between the ambers. A pale
     rectangle low in a dark mass is one of the strongest "that shape is
     a car" cues there is, and it is the only light thing down here. */
  B.box(-0.152, 0.152, 0.408, 0.505, 2.104, 2.118, CAR_TRIM, NO_SPIN,
        { pz: CAR_PLATE });
  // the real radiator opening, a fine mesh slot under the bumper
  B.box(-0.475, 0.475, 0.332, 0.394, 2.020, 2.062, CAR_TRIM, NO_SPIN);
  // air dam, splayed down and forward, bare black urethane
  B.hex([[-0.742,0.150,1.960], [0.742,0.150,1.960], [0.742,0.300,1.960], [-0.742,0.300,1.960],
         [-0.712,0.150,2.074], [0.712,0.150,2.074], [0.712,0.290,2.074], [-0.712,0.290,2.074]],
        CAR_TRIM, NO_SPIN);

  /* ── flanks ── */
  // black door mirrors, on the beltline just aft of the A-pillar
  B.hexM([[0.890,0.795,0.100], [0.996,0.795,0.100], [0.996,0.875,0.100], [0.890,0.875,0.100],
          [0.890,0.805,0.230], [0.996,0.805,0.230], [0.996,0.875,0.230], [0.890,0.875,0.230]],
         CAR_TRIM, NO_SPIN);
  /* The quarter louvre vent — the engine's side intake — set into the
     B-pillar. It is the ONLY black thing on that pillar, and it has to
     lie along the flank's tumblehome rather than stand upright, or it
     floats off the side of the car. */
  B.hexM([[0.884,0.790,-0.792], [0.902,0.793,-0.792], [0.633,1.060,-0.792], [0.615,1.057,-0.792],
          [0.884,0.790,-0.702], [0.902,0.793,-0.702], [0.633,1.060,-0.702], [0.615,1.057,-0.702]],
         CAR_TRIM, NO_SPIN);
  /* The gullwing shutlines. Each door takes a slice of the roof with
     it, leaving a fixed 330 mm T-panel spine down the middle whose two
     edges run the length of the cabin — the one line on this car that
     says the doors go UP. Sunk into the roof rather than floated over
     it: a face a fraction above another z-fights into stripes at
     distance.                                                        */
  {
    const roofY = z => 1.130 - (z + 0.700) * 0.028;
    const z0 = 0.060, z1 = -0.620, y0 = roofY(z0), y1 = roofY(z1);
    B.hexM([[0.152,y1-0.014,z1], [0.180,y1-0.014,z1], [0.180,y1+0.004,z1], [0.152,y1+0.004,z1],
            [0.152,y0-0.014,z0], [0.180,y0-0.014,z0], [0.180,y0+0.004,z0], [0.152,y0+0.004,z0]],
           CAR_BODY, NO_SPIN);
  }

  /* ── engine deck ──
     SIX blades, and they cover the WHOLE bay — from the roof's trailing
     edge back to the cover's lip, 1.04 m of the 1.15 m deck. That is the
     thing to get right about this car's back: the louvre panel is not a
     patch somewhere on the deck, it IS the deck. Scanning brightness
     straight down a rear-three-quarter photograph gives blade/slot/blade
     all the way from the roof to the tail edge with no plain stretch
     anywhere, at a pitch of 173 mm with the blade taking two thirds of
     it — and the fine engine grille people notice back there is seen
     THROUGH the slots, not sitting behind them, so it needs no geometry
     of its own.

     Each blade follows the bay floor (ytc) rather than the sail edge:
     the tops must stay BELOW the yt line either side, or the cover
     reads as a comb riding on the deck instead of louvres sunk into it.
     They widen with the bay as it opens toward the tail.             */
  const deckY = z => 1.038 + (z + 0.960) * 0.196;
  {
    const bayW = z => 0.552 + (-0.960 - z) / 1.025 * 0.058;
    const PITCH = 0.1733, DEEP = 0.116;
    for (let j = 0; j < 6; j++){
      const z0 = -0.914 - j * PITCH, z1 = z0 - DEEP;   // z1 is nearer the tail
      const y0 = deckY(z0), y1 = deckY(z1);
      const x = bayW((z0 + z1) * 0.5) - 0.022;
      B.hex([[-x,y1+0.006,z1], [x,y1+0.006,z1], [x,y1+0.036,z1], [-x,y1+0.036,z1],
             [-x,y0+0.006,z0], [x,y0+0.006,z0], [x,y0+0.036,z0], [-x,y0+0.036,z0]],
            CAR_BODY, NO_SPIN);
    }
    // the cover's own trailing lip, closing the bay against the tail
    const zF = -1.900, zR = -1.988, yF = deckY(zF), yR = deckY(zR), x = 0.585;
    B.hex([[-x,yR+0.002,zR], [x,yR+0.002,zR], [x,yR+0.030,zR], [-x,yR+0.030,zR],
           [-x,yF+0.002,zF], [x,yF+0.002,zF], [x,yF+0.030,zF], [-x,yF+0.030,zF]],
          CAR_BODY, NO_SPIN);
  }

  /* ── rear ──
     The clusters ARE the tail: each a 490 x 190 unit hung straight off
     the beltline crease, running from ±287 nearly out to the corner at
     ±775, so the two of them plus the plate bezel between them fill the
     entire panel edge to edge. There is no painted gap above them — the
     top edge IS the deck's trailing edge — and a model that shrinks
     them and floats them mid-panel throws away the strongest graphic on
     the car.

     Segments inboard to outboard: the clear reverse lamp (narrowest, an
     eighth of the lens), then the red grid, then amber — the same on US
     and European cars; there was never a red-indicator version. The
     grey bumper band sits well below, with the pipes hanging BELOW its
     bottom edge where they break the silhouette.                     */
  {
    const LY0 = 0.648, LY1 = 0.838, LZ0 = -2.092, LZ1 = -2.048;
    B.boxM(0.287, 0.343, LY0, LY1, LZ0, LZ1, CAR_TRIM, NO_SPIN, { nz: CAR_PLATE });
    B.boxM(0.343, 0.648, LY0, LY1, LZ0, LZ1, CAR_TRIM, NO_SPIN, { nz: CAR_TAIL });
    B.boxM(0.648, 0.775, LY0, LY1, LZ0, LZ1, CAR_TRIM, NO_SPIN, { nz: CAR_AMBER });
    B.box(-0.283, 0.283, LY0, LY1, -2.076, LZ1, CAR_TRIM, NO_SPIN);
    B.box(-0.152, 0.152, 0.657, 0.811, -2.086, -2.076, CAR_TRIM, NO_SPIN,
          { nz: CAR_PLATE });
  }
  B.hex([[-0.772,0.370,-2.112], [0.772,0.370,-2.112], [0.772,0.545,-2.112], [-0.772,0.545,-2.112],
         [-0.848,0.370,-2.030], [0.848,0.370,-2.030], [0.848,0.545,-2.030], [-0.848,0.545,-2.030]],
        CAR_FASCIA, NO_SPIN);
  B.boxM(0.500, 0.580, 0.248, 0.312, -2.100, -2.010, CAR_TRIM, NO_SPIN, { nz: CAR_EXH });

  /* no wing and nothing after it: split at the very end keeps the wing
     draw-range plumbing inert for this car whatever the checkbox says */
  return { ...B.finish(B.wireCount()), split: B.count() };
}

/* Model registry — the extension point for the cars that follow. len /
   halfW / height are the built model's own bounding box in metres; the
   placement, shadow and streak code reads them rather than assuming any
   one car's proportions. wheelR is the two rolling radii the odometry
   divides by. Capability flags default to true and are only written
   where a car LACKS something (`wing: false`, `pops: false`) — the
   panel hides the control and the lamp logic pins uHeadOn instead of
   tying it to a pop angle the model does not have.                    */
const CAR_MODELS = {
  lambo: { name: 'Lamborghini', build: buildCountach,
           len: 4.17, halfW: 1.02, height: 1.17,
           wheelR: [0.303, 0.311],
           /* contact patches, car-local metres: [x, z] per corner. The
              ground pass lays a tyre mark under each of them, and once
              the car is drifting they stop being two mirrored pairs, so
              it needs the real four rather than one track figure. */
           axles: [[0.77, 1.15], [-0.77, 1.15],      // front
                   [0.80, -1.30], [-0.80, -1.30]] }, // rear
  delorean: { name: 'DeLorean', build: buildDeLorean,
              len: 4.23, halfW: 1.00, height: 1.14,
              wheelR: [0.295, 0.3315],
              wing: false,     // never wore one — the checkbox hides
              pops: false,     // fixed quad lamps, uHeadOn pinned at 1
              axles: [[0.795, 1.244], [-0.795, 1.244],
                      [0.795, -1.169], [-0.795, -1.169]] },
};

/* ── car materials ────────────────────────────────────────────────────
   No lights in this scene, so the paint is lit the way the rest of the
   wallpaper is: a reflected sky gradient (the SAME uniform objects the
   sky dome uses, so the two can never drift), a specular off the sun's
   actual position, and a Fresnel rim in the palette accent. Every
   falloff is written with multiplication — pow() on a signed base is
   undefined in GLSL and renders as black blocks on some drivers.       */
const CAR_SPIN_GLSL = /* glsl */`
  attribute float aMat;
  attribute vec4  aRot;          // pivotY, pivotZ, swing | wheel cx, kind
  uniform float uWheelF, uWheelR, uPopAng, uSteer;
  vec3 carSpin(inout vec3 n){
    vec3 p = position;
    float ang = aRot.w > 2.5 ? uPopAng * aRot.z
              : aRot.w > 1.5 ? uWheelR
              : aRot.w > 0.5 ? uWheelF : 0.0;
    if (ang != 0.0){
      float c = cos(ang), s = sin(ang);
      vec2 d = p.yz - aRot.xy;
      p.yz = aRot.xy + vec2(d.x * c - d.y * s, d.x * s + d.y * c);
      n.yz = vec2(n.y * c - n.z * s, n.y * s + n.z * c);
    }
    /* Opposite lock. Only the FRONT wheels turn, and only about their own
       vertical axis — after the roll above, so the steer carries the
       already-rolling wheel round with it. Masked rather than branched:
       every other vertex gets a rotation of exactly zero, which is the
       identity, for a handful of instructions and no divergence. */
    float st = uSteer * step(0.5, aRot.w) * step(aRot.w, 1.5);
    if (st != 0.0){
      float c = cos(st), s = sin(st);
      vec2 piv = vec2(sign(p.x) * aRot.z, aRot.y);
      vec2 d = p.xz - piv;
      p.xz = piv + vec2(d.x * c + d.y * s, -d.x * s + d.y * c);
      n.xz = vec2(n.x * c + n.z * s, -n.x * s + n.z * c);
    }
    return p;
  }`;
const CAR_HUE_GLSL = /* glsl */`
  vec3 carHueRot(vec3 c, float a){
    const vec3 W = vec3(0.299, 0.587, 0.114);
    float ca = cos(a), sa = sin(a);
    vec3 d = c - vec3(dot(c, W));
    return vec3(dot(c, W)) + ca * d + sa * cross(vec3(0.57735), d);
  }`;

const carVert = /* glsl */`
  ${CAR_SPIN_GLSL}
  varying vec3 vN, vW;
  varying float vM, vD;
  #ifdef CAR_REFL
    uniform float uStretchRef;
  #endif
  void main(){
    vec3 n = normal;
    vec3 p = carSpin(n);
    vec4 wp = modelMatrix * vec4(p, 1.0);
    vec3 wn = normalize(mat3(modelMatrix) * n);
    #ifdef CAR_REFL
      /* mirror about the ground plane, then smear with depth by exactly
         the factor the floor shader uses on its own reflections */
      wp.y = -wp.y; wn.y = -wn.y;
      wp.y *= 1.0 + ${REFL_STRETCH}
            * clamp(max(-wp.y, 0.0) / uStretchRef, 0.0, 1.0);
    #endif
    vW = wp.xyz; vN = wn; vM = aMat;
    vec4 mv = viewMatrix * wp;
    vD = -mv.z;
    gl_Position = projectionMatrix * mv;
  }`;
const carFrag = /* glsl */`
  varying vec3 vN, vW;
  varying float vM, vD;
  uniform vec3 uBody, uNeon, uSkyTop, uSkyMid, uSkyBot, uGround, uSunC, uSunPos;
  uniform vec3 uFogColor, uCamPos;
  uniform float uFogNear, uFogFar, uLights, uNeonAmt, uHeadOn;
  #ifdef CAR_REFL
    uniform float uOp, uHueR, uFadeK;
    ${CAR_HUE_GLSL}
  #endif
  void main(){
    vec3 N = normalize(vN);
    vec3 V = normalize(uCamPos - vW);
    float nv = max(dot(N, V), 0.0);
    float fr = 1.0 - nv, fr2 = fr * fr, fr4 = fr2 * fr2;
    /* the horizon line sliding across the panels is what sells lacquer,
       so sample the real sky gradient off the reflected ray */
    vec3 Rd = reflect(-V, N);
    vec3 sky = mix(uSkyBot, uSkyMid, smoothstep(0.0, 0.32, Rd.y));
    sky = mix(sky, uSkyTop, smoothstep(0.32, 0.95, Rd.y));
    vec3 env = mix(uGround, sky, smoothstep(-0.10, 0.05, Rd.y));
    vec3 L = normalize(uSunPos - vW);
    float nl = max(dot(N, L), 0.0);
    float h = max(dot(N, normalize(L + V)), 0.0);
    float sp = h * h; sp = sp * sp; sp = sp * sp; sp = sp * sp;   // h^16
    vec3 rim = uNeon * fr4 * uNeonAmt;

    vec3 c;
    if (vM < 0.5){                                    // body paint
      c = uBody * (0.22 + 0.34 * (N.y * 0.5 + 0.5) + 0.34 * nl)
        + env * (0.09 + 0.44 * fr2) + uSunC * sp * 1.4 + rim * 0.9;
    } else if (vM < 1.5){                             // glass
      c = uBody * 0.04 + env * (0.20 + 0.70 * fr2)
        + uSunC * sp * 2.0 + rim * 0.5;
    } else if (vM < 2.5){                             // tyre
      c = vec3(0.018, 0.016, 0.026) + env * 0.05 * fr2 + rim * 0.45;
    } else if (vM < 3.5){                             // alloy
      c = vec3(0.30, 0.31, 0.36) * (0.35 + 0.65 * nl)
        + env * (0.25 + 0.35 * fr2) + uSunC * sp * 2.4;
    } else if (vM < 4.5){                             // tail lamps
      c = vec3(1.0, 0.055, 0.10) * (0.35 + 1.15 * uLights) * (0.4 + 0.6 * nv);
    } else if (vM < 5.5){                             // head lamps
      /* Down, a Countach's lamps are behind a body-coloured lid that is
         flush with the bonnet, so they paint as bodywork and the nose is
         unbroken; up, they are lamps. Crossfading on the same angle that
         raises the pod costs one mix on a few hundred pixels and saves
         two dark rectangles sitting on the wing tops all the time.    */
      c = mix(uBody * (0.22 + 0.34 * (N.y * 0.5 + 0.5) + 0.34 * nl)
                + env * (0.09 + 0.44 * fr2) + rim * 0.9,
              vec3(1.0, 0.96, 0.86) * (0.06 + 2.3 * uLights)
                * (0.30 + 0.70 * nv),
              uHeadOn);
    } else if (vM < 6.5){                             // dark trim
      c = vec3(0.022, 0.020, 0.034) + env * 0.09 * fr2 + rim * 0.55;
    } else if (vM < 7.5){                             // exhaust pipes
      // dark chrome with heat in the bore, not four little lamps
      c = vec3(0.10, 0.10, 0.11) * (0.4 + 0.6 * nl) + env * 0.10 * fr2
        + vec3(1.0, 0.35, 0.08) * uLights * 0.20;
    } else if (vM < 8.5){                             // indicator lenses
      // deliberately below the brake lights: an indicator that is not
      // flashing is a dull orange, and two bright red bars either side
      // of the plate is what actually reads as this car from behind
      c = vec3(1.0, 0.42, 0.05) * (0.20 + 0.45 * uLights) * (0.4 + 0.6 * nv);
    } else if (vM < 9.5){                             // number plate
      /* flat and pale, not lit: at any real distance the plate is a light
         rectangle in the middle of a dark tail, and that patch is one of
         the strongest cues that the shape ahead is a car at all */
      c = vec3(0.66, 0.66, 0.61) * (0.42 + 0.34 * nl) + env * 0.10;
    } else {                                          // fascia
      /* satin dark-grey plastic, a definite step lighter than the black
         trim: the DeLorean's nose and tail are one-piece mouldings in
         this grey, and against it the truly black bits — lamp bezels,
         sill band, spoiler — still read as black */
      c = vec3(0.115, 0.115, 0.125) * (0.30 + 0.45 * nl)
        + env * (0.10 + 0.18 * fr2) + rim * 0.6;
    }
    c = mix(c, uFogColor, smoothstep(uFogNear, uFogFar, vD));
    #ifdef CAR_REFL
      if (vW.y > 0.0) discard;                // a mirror never rises
      if (uHueR != 0.0) c = carHueRot(c, uHueR);
      // compact support: the fade reaches exactly zero, so no hard ring
      float a = uOp * (1.0 - smoothstep(0.0, uFadeK, -vW.y));
      if (a < 0.004) discard;
      gl_FragColor = vec4(c * 0.72, a);
    #else
      gl_FragColor = vec4(c, 1.0);
    #endif
  }`;

const carMat = new THREE.ShaderMaterial({
  fog: false,
  uniforms: {
    /* the SAME uniform objects the sky dome and the floor already own:
       one applySky updates the paint's environment and its fog too */
    uSkyTop:  skyMat.uniforms.uTop,
    uSkyMid:  skyMat.uniforms.uMid,
    uSkyBot:  skyMat.uniforms.uBot,
    uFogColor: gridMat.uniforms.uFogColor,
    uFogNear:  gridMat.uniforms.uFogNear,
    uFogFar:   gridMat.uniforms.uFogFar,
    uCamPos:   gridMat.uniforms.uCamPos,
    uBody:    { value: col('#2a0d46') },
    uNeon:    { value: col('#00e5ff') },
    uGround:  { value: col('#0a0616') },
    uSunC:    { value: col('#ff2975') },
    uSunPos:  { value: new THREE.Vector3(0, 41, -455) },
    uLights:  { value: 1 },
    uNeonAmt: { value: 1 },
    uHeadOn:  { value: 0 },
    uWheelF:  { value: 0 },
    uWheelR:  { value: 0 },
    uPopAng:  { value: 0 },
    uSteer:   { value: 0 },
  },
  vertexShader: carVert, fragmentShader: carFrag,
});
/* Mirrored twin. Same geometry, same uniform OBJECTS — only the mirror,
   the smear and the fade differ, and those are compiled in by a define
   rather than branched over.                                           */
const carReflMat = new THREE.ShaderMaterial({
  fog: false, transparent: true, depthTest: false, depthWrite: false,
  side: THREE.BackSide,               // the y-flip reverses every winding
  defines: { CAR_REFL: 1 },
  uniforms: Object.assign({}, carMat.uniforms, {
    uOp:         { value: 0.5 },
    uHueR:       { value: 0 },
    uFadeK:      { value: 6 },
    uStretchRef: { value: 25 },
  }),
  vertexShader: carVert, fragmentShader: carFrag,
});

/* wireframe overlay — Lines, never additive quads (see the note on
   shootMat): a bright alpha-blended line over dark tarmac reads the same
   on every GPU, and >1 colour still runs it into the bloom pass.       */
const carWireVert = /* glsl */`
  ${CAR_SPIN_GLSL}
  varying float vM, vD;
  varying vec3 vW;
  #ifdef CAR_REFL
    uniform float uStretchRef;
  #endif
  void main(){
    vec3 n = normal;
    vec3 p = carSpin(n);
    vec4 wp = modelMatrix * vec4(p, 1.0);
    #ifdef CAR_REFL
      wp.y = -wp.y;
      wp.y *= 1.0 + ${REFL_STRETCH}
            * clamp(max(-wp.y, 0.0) / uStretchRef, 0.0, 1.0);
    #endif
    vW = wp.xyz; vM = aMat;
    vec4 mv = viewMatrix * wp;
    vD = -mv.z;
    /* Pull the line a hair along the view ray so it wins the depth test
       against the panel it traces. A UNIFORM scale of the view-space
       position moves the point straight toward the eye, so the
       perspective divide cancels it and the pixel does not move — only
       its depth does, and by a margin that grows with distance exactly
       as depth precision loses it. */
    mv.xyz *= 0.9985;
    gl_Position = projectionMatrix * mv;
  }`;
const carWireFrag = /* glsl */`
  varying float vM, vD;
  varying vec3 vW;
  uniform vec3 uNeon, uFogColor;
  uniform float uFogNear, uFogFar, uLights, uHeadOn, uOp;
  #ifdef CAR_REFL
    uniform float uHueR, uFadeK;
    ${CAR_HUE_GLSL}
  #endif
  void main(){
    vec3 c = uNeon * 1.35;
    if (vM > 3.5 && vM < 4.5) c = vec3(1.0, 0.16, 0.20) * (0.6 + 1.7 * uLights);
    else if (vM > 4.5 && vM < 5.5)
      // down, the lid is bodywork, so its outline is an ordinary panel
      // line rather than a lamp — same crossfade the solid pass uses
      c = mix(uNeon * 1.35,
              vec3(1.0, 0.96, 0.86) * (0.18 + 1.7 * uLights), uHeadOn);
    else if (vM > 8.5 && vM < 9.5) c = vec3(0.92, 0.92, 0.86);
    else if (vM > 7.5) c = vec3(1.0, 0.46, 0.06) * (0.5 + 1.1 * uLights);
    else if (vM > 2.5 && vM < 3.5) c = vec3(0.88, 0.90, 1.0) * 1.15;
    else if (vM > 0.5 && vM < 1.5) c = mix(uNeon, vec3(1.0), 0.45) * 1.1;
    c = mix(c, uFogColor, smoothstep(uFogNear, uFogFar, vD));
    float a = uOp;
    #ifdef CAR_REFL
      if (vW.y > 0.0) discard;
      if (uHueR != 0.0) c = carHueRot(c, uHueR);
      a *= 1.0 - smoothstep(0.0, uFadeK, -vW.y);
      if (a < 0.004) discard;
    #endif
    gl_FragColor = vec4(c, a);
  }`;
const carWireMat = new THREE.ShaderMaterial({
  fog: false, transparent: true, depthWrite: false,
  uniforms: {
    uNeon:     carMat.uniforms.uNeon,
    uFogColor: gridMat.uniforms.uFogColor,
    uFogNear:  gridMat.uniforms.uFogNear,
    uFogFar:   gridMat.uniforms.uFogFar,
    uLights:   carMat.uniforms.uLights,
    uHeadOn:   carMat.uniforms.uHeadOn,
    uWheelF:   carMat.uniforms.uWheelF,
    uWheelR:   carMat.uniforms.uWheelR,
    uPopAng:   carMat.uniforms.uPopAng,
    uSteer:    carMat.uniforms.uSteer,
    uOp:      { value: 0.95 },
  },
  vertexShader: carWireVert, fragmentShader: carWireFrag,
});
const carWireReflMat = new THREE.ShaderMaterial({
  fog: false, transparent: true, depthTest: false, depthWrite: false,
  defines: { CAR_REFL: 1 },
  uniforms: Object.assign({}, carWireMat.uniforms, {
    uOp:         { value: 0.4 },
    uHueR:       carReflMat.uniforms.uHueR,
    uFadeK:      carReflMat.uniforms.uFadeK,
    uStretchRef: carReflMat.uniforms.uStretchRef,
  }),
  vertexShader: carWireVert, fragmentShader: carWireFrag,
});

/* Contact shadow + underglow + speed streaks, in ONE quad. Nothing sells
   "standing on the road" like the ground going dark directly under the
   car, and the neon spill and the tarmac smearing past are the same
   pass, so none of the three costs a draw call of its own.
   Normal blending with a premultiplied-style colour: black where only
   the shadow is present, HDR neon where only the glow is.

   Everything here is measured in WORLD units off the car's own
   footprint, never in quad UVs. The quad grows when the streaks are
   switched on, and a falloff written against UVs would change width
   with it — the underglow would get wider every time you raised the
   speed slider.                                                       */
/* A car is not a rectangle. This one is 1.26 m across the bonnet and
   2.00 m across the rear flares, so a box around its bounding size
   lights a rug on the floor — which is exactly what a rectangular
   footprint looked like. Scan the built mesh into a plan profile
   instead: 64 bins along the length, each holding the widest the body
   gets there, and let the ground shader look the half-width up per
   fragment. Model-agnostic — the next car brings its own silhouette —
   for one texture fetch and 256 bytes.                                */
function carPlanTexture(geo, halfW){
  const N = 64, bins = new Float32Array(N);
  geo.computeBoundingBox();
  const bb = geo.boundingBox, z1 = bb.max.z, span = bb.max.z - bb.min.z;
  const p = geo.getAttribute('position');
  // bin 0 is the NOSE, matching the shader's 0 = nose, 1 = tail
  const bin = z => Math.min(N - 1, Math.max(0,
    Math.floor((z1 - z) / span * N)));
  /* Rasterise TRIANGLES, not vertices. The loft carries 18 stations over
     4.2 m, so binning vertices leaves most of 64 bins empty and the
     outline collapses to zero between them — a glow that pinched to a
     point twice down the length of the car, which is worse than the
     rectangle it replaced. A triangle covers every bin its z range
     spans, and the skin is continuous, so nothing is left unwritten. */
  for (let i = 0; i < p.count; i += 3){
    let zLo = Infinity, zHi = -Infinity, mx = 0;
    for (let k = 0; k < 3; k++){
      const z = p.getZ(i + k), ax = Math.abs(p.getX(i + k));
      if (z < zLo) zLo = z;
      if (z > zHi) zHi = z;
      if (ax > mx) mx = ax;
    }
    for (let b = bin(zHi); b <= bin(zLo); b++) if (mx > bins[b]) bins[b] = mx;
  }
  const out = new Uint8Array(N * 4);
  for (let i = 0; i < N; i++){
    /* clamped to the body's own half-width: the door mirrors are the
       one thing outboard of the flares and they would otherwise punch a
       bulge through the outline. Smoothed, because a per-bin max over a
       point cloud is noisy where a station happens to fall.          */
    const a = Math.min(bins[Math.max(i - 1, 0)], halfW);
    const c = Math.min(bins[Math.min(i + 1, N - 1)], halfW);
    const m = Math.min(bins[i], halfW);
    const v = Math.round(Math.min((a + 2 * m + c) * 0.25 / halfW, 1) * 255);
    out[i * 4] = out[i * 4 + 1] = out[i * 4 + 2] = v;
    out[i * 4 + 3] = 255;
  }
  const tex = new THREE.DataTexture(out, N, 1);
  tex.minFilter = tex.magFilter = THREE.LinearFilter;
  tex.wrapS = tex.wrapT = THREE.ClampToEdgeWrapping;
  tex.needsUpdate = true;
  return tex;
}

const carShadowMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, fog: false,
  uniforms: {
    uNeon:   carMat.uniforms.uNeon,
    uShadow: { value: 0.7 },
    uGlowA:  { value: 0.35 },
    uPlan:   { value: null },     // half-width along the car, nose -> tail
    uQuad:   { value: new THREE.Vector2(1, 1) },  // quad half extents
    uHalf:   { value: new THREE.Vector2(1, 1) },  // body half extents
    uCtr:    { value: 0 },        // body centre, rearward of the quad's
    uPad:    { value: 1 },        // one car half-width — the unit below
    uSpeed:  { value: 0 },        // drives the airborne streaks
    uSkid:   { value: 0 },
    uScroll: { value: 0 },
    uTrkX:   { value: new THREE.Vector4(0.78, -0.78, 0.78, -0.78) },
    uTrkZ:   { value: new THREE.Vector4(0, 0, 0, 0) },
    uYaw:    { value: new THREE.Vector2(1, 0) },
  },
  vertexShader: /* glsl */`
    varying vec2 vUv;
    void main(){ vUv = uv;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: /* glsl */`
    varying vec2 vUv;
    uniform vec3 uNeon;
    uniform sampler2D uPlan;
    uniform float uShadow, uGlowA, uCtr, uPad;
    uniform vec2 uQuad, uHalf, uYaw;      // uYaw = cos, sin of the drift
    #ifdef CAR_SKID
      uniform float uSkid, uScroll;
      /* One mark per contact patch. The lateral offsets are NOT mirrored
         pairs once the car is sideways, so every wheel carries its own
         line and its own start. */
      uniform vec4 uTrkX, uTrkZ;
      float skidMark(float lat, float z0, float xn, float behind, float p){
        float ph = lat * 4.7;                  // each tyre wanders its own way
        float wob = 0.020 * sin(6.2832 * p + ph)
                  + 0.010 * sin(18.850 * p + 1.3 + ph)
                  + 0.005 * sin(31.416 * p + 2.7);
        float off = xn - (lat + wob);
        float dl  = abs(off);
        float core   = 1.0 - smoothstep(0.090, 0.150, dl);
        float groove = 1.0 - 0.18 * (0.5 + 0.5 * cos(off * 63.0));
        float patchy = 0.80 + 0.20 * (0.5 + 0.5 * sin(12.566 * p + 0.7)
                                              * sin(25.133 * p + 2.1));
        float b = behind - z0;                 // from THIS wheel, not the tail
        float fade = smoothstep(-0.15 * uPad, 0.15 * uPad, b)
                   * (1.0 - smoothstep(0.0, 5.5 * uPad, max(b, 0.0)));
        return core * groove * patchy * fade;
      }
    #endif
    void main(){
      // + y is REARWARD of the quad's centre; the body sits at uCtr
      vec2 w = (vUv * 2.0 - 1.0) * uQuad;
      w.y -= uCtr;
      /* TWO FRAMES in one pass. The shadow and the underglow belong to
         the BODY — the glow is bolted to the sills and the shadow is
         cast by the shell — so once the car is drifting they have to
         yaw with it. The tyre marks belong to the ROAD and must not.
         Rotating the sample point into the body frame is two multiplies
         and saves a second quad; leaving both in the road frame drew a
         car-shaped pool of light pointing down the road while the car
         itself sat across it. */
      vec2 wb = vec2( w.x * uYaw.x + w.y * uYaw.y,
                     -w.x * uYaw.y + w.y * uYaw.x);
      /* Signed distance to the car's PLAN OUTLINE, not to a box around
         it: the half-width is looked up along the length, so the glow
         pinches in over the bonnet and swells over the rear flares the
         way the bodywork does. */
      float t = clamp((wb.y + uHalf.y) / (2.0 * uHalf.y), 0.0, 1.0);
      float hx = texture2D(uPlan, vec2(t, 0.5)).r * uHalf.x;
      vec2 dd = vec2(abs(wb.x) - hx, abs(wb.y) - uHalf.y);
      float sd = length(max(dd, 0.0)) + min(max(dd.x, dd.y), 0.0);

      /* Contact shadow: a soft pool, darkest under the middle and
         already fading by the sills. The old one held one flat alpha
         across the whole footprint, which in wireframe mode painted an
         opaque slab exactly where the car is meant to be see-through. */
      float sh = uShadow * 0.60
               * (1.0 - smoothstep(-0.85 * uPad, 0.42 * uPad, sd));

      /* Underglow: strip lighting along the sills, spilling onto the road
         and dying within a third of a half-width. Deliberately soft the
         whole way rather than a crisp rim on the outline — light off a
         diffuser scatters, and a hard edge traced round the body reads
         as a painted line rather than as something glowing. The mottle
         is what stops the spill looking like an airbrushed gradient;
         it is cheap and it only ever varies the brightness, never the
         extent, so the shape still follows the plan exactly. */
      float mot = 0.80 + 0.20 * sin(wb.x * (5.1 / uPad))
                             * sin(wb.y * (3.7 / uPad) + 1.3);
      float spill = 1.0 - smoothstep(-0.06 * uPad, 0.30 * uPad, sd);
      float under = 0.34 + 0.66 * smoothstep(-0.40 * uPad, -0.02 * uPad, sd);
      float g  = spill * under * mot;
      /* CUBED, not squared. At a square the mid-tones stay high enough
         that the spill reads as a solid band of colour laid on the road
         rather than as light falling on it; the extra power pulls
         everything but the brightest edge down into haze without moving
         where the effect stops. */
      float gw = g * g * g * uGlowA;

      #ifdef CAR_SKID
        /* Tyre marks. Dark, so they add to the SHADOW term rather than
           the neon one and simply darken the tarmac. The track wanders:
           three sines whose periods all divide the scroll wrap, so the
           wander is continuous over the whole run and still seamless
           when the accumulator rolls over at 1. Everything is a function
           of the ROAD coordinate, not of distance behind the car, so a
           mark stays with the tarmac it was laid on. */
        float behind = w.y - uHalf.y;              // 0 at the tail
        float p = behind / (4.0 * uPad) - uScroll;
        float xn = w.x / uHalf.x;              // SIGNED: the four differ
        float mk = skidMark(uTrkX.x, uTrkZ.x, xn, behind, p)
                 + skidMark(uTrkX.y, uTrkZ.y, xn, behind, p);
        #ifdef CAR_SKID4
          /* Only compiled in once the car is sideways. Straight ahead the
             front tyres roll in the rears' tracks and two more marks buy
             nothing but fill, so the shader is built without them. */
          mk += skidMark(uTrkX.z, uTrkZ.z, xn, behind, p)
              + skidMark(uTrkX.w, uTrkZ.w, xn, behind, p);
        #endif
        sh += uSkid * min(mk, 1.25) * 1.35;    // capped where marks cross
      #endif

      float a = clamp(sh + gw, 0.0, 1.0);
      if (a < 0.004) discard;
      gl_FragColor = vec4(uNeon * (gw / max(a, 1e-4)) * 1.5, a);
    }`
});

/* Airborne streaks — the air going past, not just the floor. The ground
   pass alone puts every motion cue down at the contact patches, and from
   a chase view that is the most foreshortened place on screen.
   Heads are scattered in a ring AROUND the car's cross-section so they
   graze the flanks and the roof rather than skewer the body, and each
   one flies rearward on its own phase, stretching with speed and
   collapsing to nothing at zero. Lines, never additive quads — a bright
   alpha-blended line over a dark scene reads the same on every GPU.
   One draw call, 96 segments, and none of it exists until the effect is
   switched on.                                                         */
const CAR_STREAKS = 96;
function buildStreakGeo(halfW, height){
  const P = [], A = [];
  let s = 20221 >>> 0;                       // fixed seed: same car twice
  const rnd = () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296;
  for (let i = 0; i < CAR_STREAKS; i++){
    /* Hugging the body. Scattered even a little wide, a streak reads as
       a mark hanging in empty air beside the car rather than as air
       coming OFF it — the effect only works while they look attached.
       So: a thin shell just outside the silhouette, never further out
       than a fifth of a half-width. */
    /* The ring is one cross-section for the whole run, but the car is a
       wedge — the roof is only roof over the cabin, and 1.17 m up at the
       nose is empty sky. So the top of the ring sits well under the roof
       line; sideways there is bodywork the whole length and it can stay
       out at the flanks. */
    const a = rnd() * Math.PI * 2, v = rnd();
    const x = Math.cos(a) * halfW * (0.88 + 0.16 * v);
    const y = Math.min(Math.max(
      height * 0.40 + Math.sin(a) * height * (0.30 + 0.12 * v), 0.05),
      height * 0.82);
    const phase = rnd(), lenS = 0.45 + rnd() * 0.95;
    // per-streak boldness, so the run has weight in it rather than 96
    // identical hairlines
    const bold = 0.35 + rnd() * 0.65;
    for (const end of [0, 1]){ P.push(x, y, 0); A.push(phase, lenS, end, bold); }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(P, 3));
  g.setAttribute('aStk',     new THREE.Float32BufferAttribute(A, 4));
  g.computeBoundingSphere();
  return g;
}
const carStreakMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, fog: false,
  uniforms: {
    uNeon:    carMat.uniforms.uNeon,          // the SAME uniform objects
    uSpeed:   carShadowMat.uniforms.uSpeed,
    uScrollA: { value: 0 },
    uSpan:    { value: 20 },                  // metres of run, car-local
    uStart:   { value: -6 },
    uLen:     { value: 2.3 },
    uCone:    { value: 0 },       // widens the run as the car goes sideways
  },
  vertexShader: /* glsl */`
    attribute vec4 aStk;      // phase, length scale, 0 = head 1 = tail, bold
    uniform float uSpeed, uScrollA, uSpan, uStart, uLen, uCone;
    varying float vA;
    void main(){
      float e = fract(aStk.x + uScrollA);
      vec3 p = position;                       // x, y carry the scatter
      /* A drifting car presents a wider face to the air and throws it
         further out, so the run opens into a cone rather than a tube. */
      p.x *= 1.0 + uCone * (0.25 + 1.5 * e);
      p.z = -(uStart + e * uSpan + aStk.z * uLen * aStk.y * uSpeed);
      /* compact support at both ends of the run: a streak never pops
         into or out of existence at full brightness */
      vA = uSpeed * aStk.w * (1.0 - aStk.z * 0.80)
         * smoothstep(0.0, 0.10, e) * (1.0 - smoothstep(0.45, 0.90, e));
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      /* And killed off near the lens. The run trails toward the camera,
         so with the car parked close the far end of it ends up a couple
         of units from the eye, where perspective smears one streak clean
         across the sky and it reads as a scratch on the screen. Fading
         on view depth handles every distance and size setting at once,
         which clamping the run length alone cannot. */
      vA *= smoothstep(4.0, 13.0, -mv.z);
      gl_Position = projectionMatrix * mv;
    }`,
  fragmentShader: /* glsl */`
    uniform vec3 uNeon;
    varying float vA;
    void main(){
      if (vA < 0.004) discard;
      gl_FragColor = vec4(uNeon * 1.7, min(vA * 1.05, 1.0));
    }`,
});

/* carRoot carries the body (and its mirror, as a child so both share one
   world matrix). carGround stays flat on the tarmac while the body bobs
   on its springs, which is the whole point of keeping them apart.      */
const carRoot = new THREE.Group();
const carGround = new THREE.Group();
// yaw · pitch · roll, in that order — pitch and roll are about the car's
// own axes, which is not what the default XYZ order would give
carRoot.rotation.order = 'YXZ';
carRoot.visible = carGround.visible = false;
scene.add(carRoot); scene.add(carGround);

let carGeo = null, carModelId = '', carSolid = null, carWire = null,
    carSolidRefl = null, carWireRefl = null, carShadow = null,
    carStreaks = null, carPlanTex = null;
let carLen = 4.16, carHalfW = 1.06, carHeight = 1.26;   // metres, per model
let carRadF = 0.303, carRadR = 0.311, carHasPops = true;

/** Build (once) the geometry for the selected model. */
function buildCar(){
  const id = state.car.model in CAR_MODELS ? state.car.model : 'lambo';
  if (carGeo && carModelId === id) return;
  const m = CAR_MODELS[id];
  if (carGeo){
    carGeo.solid.dispose(); carGeo.wire.dispose();
    for (const o of [carSolid, carWire, carSolidRefl, carWireRefl, carStreaks])
      if (o && o.parent) o.parent.remove(o);
    if (carStreaks) carStreaks.geometry.dispose();
    carStreaks = null;
    if (carPlanTex) carPlanTex.dispose();
  }
  carModelId = id;
  carGeo = m.build();
  carLen = m.len; carHalfW = m.halfW; carHeight = m.height;
  [carRadF, carRadR] = m.wheelR;
  carHasPops = m.pops !== false;
  carPlanTex = carPlanTexture(carGeo.solid, carHalfW);
  carShadowMat.uniforms.uPlan.value = carPlanTex;
  const mk = (Cls, geo, mat, refl) => {
    const o = new Cls(geo, mat);
    o.frustumCulled = !refl;      // the mirror is built in the vertex stage
    carRoot.add(o);
    return o;
  };
  carSolid     = mk(THREE.Mesh, carGeo.solid, carMat, false);
  carSolidRefl = mk(THREE.Mesh, carGeo.solid, carReflMat, true);
  carWire      = mk(THREE.LineSegments, carGeo.wire, carWireMat, false);
  carWireRefl  = mk(THREE.LineSegments, carGeo.wire, carWireReflMat, true);
  // reflection under the body, both under the car itself
  carSolidRefl.renderOrder = 1; carWireRefl.renderOrder = 2;
  carWire.renderOrder = 3;
  if (!carShadow){
    const g = new THREE.PlaneGeometry(1, 1);
    g.rotateX(-Math.PI / 2);
    carShadow = new THREE.Mesh(g, carShadowMat);
    carShadow.renderOrder = 0;
    carGround.add(carShadow);
  }
  carStreaks = new THREE.LineSegments(
    buildStreakGeo(carHalfW, carHeight), carStreakMat);
  carStreaks.frustumCulled = false;      // the run is built in the vertex stage
  carStreaks.renderOrder = 4;
  carGround.add(carStreaks);
}

/* JS twin of the shader's roadCx(): where the tarmac's centre line is at
   a world z. The car has to stand on the road the floor actually paints,
   so this must never drift from GLSL_ROADC above.                      */
function roadCenterX(z){
  const r = state.road;
  if (!r.on) return 0;
  const s = clamp((-z - 10) / 400, 0, 1);
  return r.x + r.curve * s * s;
}
/** d(centre)/dz — the road's heading, so the car points down it */
function roadSlope(z){
  const r = state.road;
  if (!r.on) return 0;
  const t = (-z - 10) / 400;
  if (t <= 0 || t >= 1) return 0;          // clamped: the centre runs straight
  return -r.curve * t / 200;
}

/* ── car, per frame ───────────────────────────────────────────────────
   Two matrices and six uniforms. No geometry is touched and no group is
   walked: the wheels and the headlight pods turn in the vertex stage.  */
let carWF = 0, carWR = 0, carPop = 0, carDriftAng = 0;
/* Full lock at the top of the slider: 50 degrees is competition-drift
   territory — a big, obvious angle that still reads as a car holding a
   slide rather than one that has spun and is travelling backwards. */
const DRIFT_MAX = 0.87;
function updateCar(T, dt){
  const c = state.car, A = state.audio;
  /* Which way the car points follows the world rather than a setting.
     The floor scrolling toward you means YOU are moving forward, so the
     car ahead of you is driving away; reverse the scroll and it becomes
     oncoming traffic. Every motion cue below scales with that same
     speed, so a stopped road parks the car — wheels still, springs
     settled — instead of leaving it jiggling on the spot.             */
  const v = state.grid.speed * 6 + (state.road.on ? state.road.speed * 6 : 0);
  const away = v >= 0;
  const spd = Math.abs(v);                        // world units per second
  const S = M2W * c.size;
  const z = c.z, slope = roadSlope(z);
  /* lane is a FRACTION of the carriageway, not a world offset, so the
     car keeps its lane when the road is widened — and ±1 lands a flank
     on the kerb rather than half the car in the dirt */
  const halfRoad = state.road.on ? state.road.width : 7.5;
  const x = roadCenterX(z)
          + c.lane * Math.max(halfRoad - carHalfW * S, 0);

  /* The body does not move on its springs at all. An idle sine read as a
     fault rather than as speed; driving it from the audio then read as
     hovering, and once that was fixed by turning it into a squat there
     was nothing left worth having. The car sits on the road.        */
  const k = Math.min(spd / 7, 1);                 // 0 when parked
  carRoot.position.set(x, 0, z);
  carGround.position.set(x, 0.08, z);
  /* Drift is a yaw on the BODY only. carGround keeps pointing down the
     road, because the car is still travelling down the road — that is
     what a drift is, and it is why the tyre marks stay straight while
     the car sits across them. */
  const yaw = away ? Math.atan2(-slope, -1) : Math.atan2(slope, 1);
  carRoot.rotation.set(0, yaw + carDriftAng,
    clamp(-slope * k * 0.5, -0.09, 0.09));                  // lean into the bend
  carGround.rotation.y = yaw;

  /* Speed streaks: the ground pass smears the tarmac past the wheels.
     Phase is accumulated from real distance travelled and wrapped, so it
     stays exact over days rather than losing float32 precision, and the
     whole effect scales off the same road speed everything else does —
     a stopped road has no streaks at all.                             */
  /* ADDITIVE, not a multiplier on the slider. Scaling it meant a scene
     with the slider at 0 could map the band to anything it liked and
     still get nothing, because zero times a boost is zero — the mapping
     silently did nothing, which is the last thing an audio control
     should do. Audio can now raise the effect from a standing start. */
  const mo = bandVal(A.mCarMotion) * (A.mCarMotion.boost ?? 1);
  const su = carShadowMat.uniforms;
  const road = Math.min(spd / 9, 1);
  su.uSpeed.value = (c.motion + mo * 1.4) * road;
  su.uSkid.value  = c.skid * road;
  if (spd > 1e-4 && dt > 0){
    /* Two accumulators, because the road pattern and the air run are
       different lengths and both wrap at 1 — sharing one and scaling it
       would tear every time the shared value wrapped.                 */
    su.uScroll.value = (su.uScroll.value + spd * dt / (4.0 * su.uPad.value)) % 1;
    const st = carStreakMat.uniforms;
    st.uScrollA.value =
      (st.uScrollA.value + (spd * dt / S) / st.uSpan.value) % 1;
  }

  /* wheels: angle = distance / radius, so both axles agree with the road
     under them. They wrap at 2π separately — a single shared accumulator
     could not, because the two radii are not commensurate.            */
  if (spd > 1e-4 && dt > 0){
    const d = spd * dt / S;                       // metres of tarmac
    carWF = (carWF + d / carRadF) % (Math.PI * 2);
    carWR = (carWR + d / carRadR) % (Math.PI * 2);
    carMat.uniforms.uWheelF.value = carWF;
    carMat.uniforms.uWheelR.value = carWR;
  }
  /* pop-ups rise only for oncoming traffic — the one time a lit lens
     points anywhere near the camera. Driving away, the flush wedge is
     the better silhouette anyway. A car with FIXED lamps pins the target
     at 1 instead: its lenses are always glass, never bodywork, and the
     pop angle it also drives is inert because no vertex carries
     SPIN_POP.                                                         */
  const popT = !carHasPops ? 1 : (!away && c.lights > 0.01) ? 1 : 0;
  if (Math.abs(carPop - popT) > 0.0005){
    carPop += (popT - carPop) * Math.min(dt * 3.5, 1);
    carMat.uniforms.uPopAng.value = carPop;
    carMat.uniforms.uHeadOn.value = carPop;
  }
  // lamps and underglow flare on the beat, on top of the sliders
  const gl = bandVal(A.mCarGlow) * (A.mCarGlow.boost ?? 1);
  carMat.uniforms.uLights.value = c.lights * (1 + gl * 1.4);
  carShadowMat.uniforms.uGlowA.value = c.glow * (1 + gl * 1.6);
}

/* — floating neon / chrome text (canvas-rendered, system fonts only) — */
const textCanvas = document.createElement('canvas');
textCanvas.width = 1024; textCanvas.height = 256;
const textTex = new THREE.CanvasTexture(textCanvas);
textTex.colorSpace = THREE.SRGBColorSpace;
const textMesh = new THREE.Mesh(
  new THREE.PlaneGeometry(96, 24),
  new THREE.MeshBasicMaterial({ map: textTex, transparent: true,
    depthWrite: false, fog: false }));
textMesh.position.set(0, 46, -310);
textMesh.visible = false;
scene.add(textMesh);
let textAspect = 1;      // canvas width / 1024 — widens the mesh to match
function redrawText(){
  const { textStr, textStyle, textColor } = state.fx;
  const ctx = textCanvas.getContext('2d');
  const FONT = '900 italic 138px "Arial Black", Arial, sans-serif';
  // grow the canvas to fit the text instead of shrinking the font, so
  // long strings render full-size and can span the whole screen
  ctx.font = FONT;
  const w = clamp(Math.ceil(ctx.measureText(textStr).width + 220), 1024, 8192);
  if (w !== textCanvas.width) textCanvas.width = w;     // also clears
  textAspect = textCanvas.width / 1024;
  ctx.clearRect(0, 0, textCanvas.width, 256);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = FONT;                       // resizing resets context state
  const cx = textCanvas.width / 2, cy = 132;
  if (textStyle === 'chrome'){
    // classic sky/horizon chrome bands
    const g = ctx.createLinearGradient(0, 30, 0, 225);
    g.addColorStop(0.00, '#f6fbff'); g.addColorStop(0.35, '#9fc6ff');
    g.addColorStop(0.49, '#27204f'); g.addColorStop(0.52, '#efe7ff');
    g.addColorStop(0.62, textColor); g.addColorStop(1.00, '#ffe6f7');
    ctx.shadowColor = textColor; ctx.shadowBlur = 26;
    ctx.fillStyle = g;
    ctx.fillText(textStr, cx, cy);
    ctx.shadowBlur = 0;
    ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 2;
    ctx.strokeText(textStr, cx, cy);
  } else if (textStyle === 'outline'){
    ctx.shadowColor = textColor; ctx.shadowBlur = 34;
    ctx.strokeStyle = textColor; ctx.lineWidth = 7;
    for (let i = 0; i < 3; i++) ctx.strokeText(textStr, cx, cy);
  } else { // neon
    ctx.shadowColor = textColor; ctx.shadowBlur = 38;
    ctx.fillStyle = textColor;
    for (let i = 0; i < 3; i++) ctx.fillText(textStr, cx, cy);
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(255,255,255,.85)';
    ctx.fillText(textStr, cx, cy);
  }
  textTex.needsUpdate = true;
}

/* — light beams —
   Normal blending with clamped falloffs (see note on shootMat above):
   a bright alpha-blended shaft over the dark sky reads as light on
   every GPU, with no undefined pow() and no exotic blend state.        */
const beamProtoMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, fog: false,
  uniforms: { uColor: { value: col('#7a2bff') },
              uTime: { value: 0 }, uPhase: { value: 0 },
              uBright: { value: 1 } },
  vertexShader: /* glsl */`
    varying vec2 vUv;
    void main(){ vUv = uv;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: /* glsl */`
    varying vec2 vUv;
    uniform vec3 uColor;
    uniform float uTime, uPhase, uBright;
    void main(){
      float x = vUv.x * 2.0 - 1.0;
      float yv = max(1.0 - vUv.y, 0.0);
      float breathe = 0.85 + 0.25 * sin(uTime * 0.8 + uPhase);
      float a = exp(-x * x * 4.5) * yv * sqrt(yv) * breathe;   // pow-free
      /* brightness = flashiness: an HDR hot core down the shaft's center
         feeds bloom (and whitens past 1.0) while the beam's base color
         and footprint stay untouched */
      float core = exp(-x * x * 16.0) * yv * breathe;
      vec3 col = uColor * 1.9
               + uColor * core * uBright * 2.4
               + vec3(1.0) * core * max(uBright - 1.0, 0.0) * 0.8;
      gl_FragColor = vec4(col, min(a * 1.4, 1.0));
    }`
});
const beamGroup = new THREE.Group();
scene.add(beamGroup);
const beamGeo = new THREE.PlaneGeometry(16, 170);
beamGeo.translate(0, 85, 0);                       // pivot at base
/* Beams sit BEHIND every horizon row (the farthest is z=-432), so the
   shafts rise from behind the ridges/skyline. x and the geometry scale
   up by the same factor as the extra depth, keeping the on-screen
   spread and size identical to the old z=-352 placement.              */
const BEAM_Z = -448, BEAM_K = BEAM_Z / -352;
const beams = [];
for (let i = 0; i < 4; i++){
  const mat = beamProtoMat.clone();
  mat.uniforms.uPhase.value = i * 1.9;
  const mesh = new THREE.Mesh(beamGeo, mat);
  const side = i < 2 ? -1 : 1;
  mesh.position.set(side * (55 + (i % 2) * 105) * BEAM_K, 0, BEAM_Z);
  mesh.frustumCulled = false;
  beamGroup.add(mesh);
  beams.push({ mesh, phase: i * 1.7, spd: 0.75 + (i % 3) * 0.2 });
}
function updateBeams(T, tS){
  if (!state.fx.beams) return;
  const m = state.audio.mBeam;
  const bright = state.fx.beamBright + bandVal(m) * (m.boost ?? 1);
  const f = state.fx;
  const u = gridMat.uniforms;
  const reflOn = state.grid.reflectBeams > 0.001;
  beams.forEach((b, i) => {
    b.mesh.rotation.z = Math.sin(T * 0.22 * b.spd + b.phase) * 0.22;
    b.mesh.material.uniforms.uTime.value = tS;
    b.mesh.material.uniforms.uBright.value = bright;
    if (reflOn){
      // mirror inputs: base x/z, scaled half-width and height, live tilt
      u.uBeamData.value[i].set(b.mesh.position.x, b.mesh.position.z,
        8 * BEAM_K * f.beamWidth, 170 * BEAM_K * f.beamLen);
      u.uBeamRot.value[i] = b.mesh.rotation.z;
    }
  });
  if (reflOn){
    u.uBeamColor.value.set(f.beamColor);
    u.uBeamBright.value = bright;
  }
}

/* — rain (line segments animated entirely in the vertex shader) — */
const RAIN_N = 500;
const rainGeo = new THREE.BufferGeometry();
{
  const pos = new Float32Array(RAIN_N * 2 * 3);
  const aY0 = new Float32Array(RAIN_N * 2);
  const aDy = new Float32Array(RAIN_N * 2);
  const aR  = new Float32Array(RAIN_N * 2);
  const rng = mulberry32(3131);
  for (let i = 0; i < RAIN_N; i++){
    const x = (rng() * 2 - 1) * 90, z = 10 - rng() * 180;
    const y0 = rng() * 60, r = 0.55 + rng() * 0.7, len = 1.4 + rng() * 1.2;
    pos.set([x, 0, z], i * 6); pos.set([x, 0, z], i * 6 + 3);
    aY0[i * 2] = aY0[i * 2 + 1] = y0;
    aDy[i * 2] = 0; aDy[i * 2 + 1] = len;
    aR[i * 2] = aR[i * 2 + 1] = r;
  }
  rainGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  rainGeo.setAttribute('aY0', new THREE.BufferAttribute(aY0, 1));
  rainGeo.setAttribute('aDy', new THREE.BufferAttribute(aDy, 1));
  rainGeo.setAttribute('aR',  new THREE.BufferAttribute(aR, 1));
}
const rainMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, fog: false,
  uniforms: { uTime: { value: 0 }, uColor: { value: col('#9fc4ff') } },
  vertexShader: /* glsl */`
    attribute float aY0;
    attribute float aDy;
    attribute float aR;
    uniform float uTime;
    varying float vA;
    void main(){
      vec3 p = position;
      p.y = mod(aY0 - uTime * 38.0 * aR, 60.0) + 1.5 - aDy;
      vA = 0.10 + aR * 0.14;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
    }`,
  fragmentShader: /* glsl */`
    varying float vA;
    uniform vec3 uColor;
    void main(){ gl_FragColor = vec4(uColor * vA, vA); }`
});
const rainLines = new THREE.LineSegments(rainGeo, rainMat);
rainLines.frustumCulled = false;
rainLines.visible = false;
scene.add(rainLines);

/* — lightning (weather: storm) —
   One pooled jagged polyline rebuilt per strike (~every 6–22s) plus a
   short soft sky flash via the final pass. Deliberately gentle: single
   pulse, capped brightness, long minimum interval — never strobes.     */
const BOLT_SEG = 14;
const boltPos = new Float32Array((BOLT_SEG + 1) * 3);
const boltGeo = new THREE.BufferGeometry();
boltGeo.setAttribute('position',
  new THREE.BufferAttribute(boltPos, 3).setUsage(THREE.DynamicDrawUsage));
const boltLine = new THREE.Line(boltGeo,
  new THREE.LineBasicMaterial({ color: 0xdfe8ff, transparent: true, opacity: 0,
    blending: THREE.AdditiveBlending, depthWrite: false, fog: false }));
boltLine.visible = false;
boltLine.frustumCulled = false;
scene.add(boltLine);
let flash = 0, boltT = 0, nextStrike = 12;
function strikeLightning(T){
  let x = (Math.random() * 2 - 1) * 320;
  let y = 130 + Math.random() * 70;
  const z = -330 - Math.random() * 80;
  const stepY = y / BOLT_SEG;
  for (let i = 0; i <= BOLT_SEG; i++){
    boltPos[i * 3] = x; boltPos[i * 3 + 1] = Math.max(y, 0); boltPos[i * 3 + 2] = z;
    x += (Math.random() * 2 - 1) * 17;
    y -= stepY * (0.7 + Math.random() * 0.6);
  }
  boltGeo.attributes.position.needsUpdate = true;
  boltLine.visible = true;
  boltT = 0.22;
  flash = 0.85;
  // Flash frequency scales the interval (hard floor keeps it non-strobing)
  nextStrike = T + Math.max(
    (6 + Math.random() * 16) / clamp(state.fx.stormFreq, 0.2, 10), 0.8);
}

/* ════════════════════════════════════════════════════════════════════
   12. POST-PROCESSING — custom HDR pipeline (no three/addons needed)
   ════════════════════════════════════════════════════════════════════
   scene → HDR target → threshold → 3-level blur chain → single final
   composite pass (bloom + hue-cycle + tonemap + sRGB + vignette +
   scanlines + grain + chromatic aberration + VHS wobble).             */

class FSQuad {
  constructor(material){
    this.mesh = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), material);
    this.mesh.frustumCulled = false;
    this.scene = new THREE.Scene();
    this.scene.add(this.mesh);
    this.cam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
  }
  render(mat){
    this.mesh.material = mat;
    renderer.render(this.scene, this.cam);
  }
}
const FS_VERT = /* glsl */`
  varying vec2 vUv;
  void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`;

const brightMat = new THREE.ShaderMaterial({
  uniforms: { tSrc: { value: null }, uThresh: { value: 0.6 }, uKnee: { value: 0.35 } },
  vertexShader: FS_VERT,
  fragmentShader: /* glsl */`
    varying vec2 vUv;
    uniform sampler2D tSrc;
    uniform float uThresh, uKnee;
    void main(){
      vec3 c = texture2D(tSrc, vUv).rgb;
      float lum = dot(c, vec3(0.2126, 0.7152, 0.0722));
      float soft = clamp(lum - uThresh + uKnee, 0.0, 2.0 * uKnee);
      soft = soft * soft / (4.0 * uKnee + 1e-4);
      float w = max(soft, lum - uThresh) / max(lum, 1e-4);
      gl_FragColor = vec4(c * w, 1.0);
    }`
});
const blurMat = new THREE.ShaderMaterial({
  uniforms: { tSrc: { value: null }, uTexel: { value: new THREE.Vector2() },
              uDir: { value: new THREE.Vector2(1, 0) } },
  vertexShader: FS_VERT,
  fragmentShader: /* glsl */`
    varying vec2 vUv;
    uniform sampler2D tSrc;
    uniform vec2 uTexel, uDir;
    void main(){
      vec2 d = uTexel * uDir;
      vec3 c = texture2D(tSrc, vUv).rgb * 0.227027;
      c += (texture2D(tSrc, vUv + d * 1.3846).rgb
          + texture2D(tSrc, vUv - d * 1.3846).rgb) * 0.3162162;
      c += (texture2D(tSrc, vUv + d * 3.2308).rgb
          + texture2D(tSrc, vUv - d * 3.2308).rgb) * 0.0702703;
      gl_FragColor = vec4(c, 1.0);
    }`
});
const finalMat = new THREE.ShaderMaterial({
  uniforms: {
    tScene: { value: null },
    tB0: { value: null }, tB1: { value: null }, tB2: { value: null },
    uBloomStr: { value: 0.85 },
    uRes:    { value: new THREE.Vector2(1, 1) },
    uTime:   { value: 0 },
    uVig:    { value: 0.45 },
    uScan:   { value: 0.25 },
    uGrain:  { value: 0.18 },
    uChroma: { value: 0.15 },
    uVhs:    { value: 0 },
    uVhsCnt: { value: 1 },      // concurrent tracking bands (1–4)
    uHue:    { value: 0 },
    uJit:    { value: 0 },      // audio-reactive scanline jitter
    uScanCnt:{ value: 240 },    // scanline count (set from CSS px height)
    uFlash:  { value: 0 },      // lightning flash (storm weather)
    uExposure: { value: 1.1 },
  },
  vertexShader: FS_VERT,
  fragmentShader: /* glsl */`
    varying vec2 vUv;
    uniform sampler2D tScene, tB0, tB1, tB2;
    uniform vec2  uRes;
    uniform float uBloomStr, uTime, uVig, uScan, uGrain, uChroma, uVhs,
                  uVhsCnt, uHue, uJit, uScanCnt, uFlash, uExposure;
    ${GLSL_HASH}
    vec3 hueRotate(vec3 c, float a){
      const vec3 W = vec3(0.299, 0.587, 0.114);
      float ca = cos(a), sa = sin(a);
      vec3 d = c - vec3(dot(c, W));
      return vec3(dot(c, W)) + ca * d + sa * cross(vec3(0.57735), d);
    }
    void main(){
      vec2 uv = vUv;
      float band = 0.0;

      /* VHS wobble + up to 4 concurrent roaming tracking bands */
      if (uVhs > 0.001){
        uv.x += (sin(uv.y * 9.0 + uTime * 0.7) * 0.0016
               + sin(uv.y * 55.0 + uTime * 2.3) * 0.0005) * uVhs;
        for (int i = 0; i < 4; i++){
          if (float(i) >= uVhsCnt) break;
          float fi = float(i);
          /* per-band speed offset + slow irregular wander keeps multiple
             bands from marching in an even formation */
          float by = fract(uTime * (0.035 + fi * 0.023) + fi * 0.41
                   + sin(uTime * (0.09 + fi * 0.06) + fi * 2.3) * 0.16);
          float b1 = (1.0 - smoothstep(0.0, 0.035, abs(uv.y - by))) * uVhs;
          uv.x += b1 * 0.011
                * (hash21(vec2(floor(uTime * 24.0) + fi, uv.y * 60.0)) - 0.3);
          band += b1;
        }
      }

      /* chromatic aberration (radial) */
      vec3 c;
      if (uChroma > 0.001){
        vec2 d = (uv - 0.5) * uChroma * 0.012;
        c.r = texture2D(tScene, uv + d).r;
        c.g = texture2D(tScene, uv).g;
        c.b = texture2D(tScene, uv - d).b;
      } else {
        c = texture2D(tScene, uv).rgb;
      }

      /* bloom composite */
      if (uBloomStr > 0.001){
        vec3 bl = texture2D(tB0, uv).rgb * 0.5
                + texture2D(tB1, uv).rgb * 0.75
                + texture2D(tB2, uv).rgb * 1.0;
        c += bl * uBloomStr;
      }

      /* global palette hue-cycle, tonemap, gamma */
      if (uHue != 0.0) c = hueRotate(c, uHue);
      c = vec3(1.0) - exp(-c * uExposure);
      c = pow(max(c, 0.0), vec3(1.0 / 2.2));

      /* lightning: brief cool-white lift of the whole frame */
      if (uFlash > 0.001){
        c += uFlash * vec3(0.72, 0.78, 1.0) * 0.26;
        c *= 1.0 + uFlash * 0.35;
      }

      /* CRT scanlines (+ audio jitter) */
      if (uScan > 0.001){
        float y = uv.y + uJit * (hash21(vec2(floor(uTime * 47.0), 2.7)) - 0.5) * 0.004;
        float s = 0.5 + 0.5 * sin(y * uScanCnt * 6.28318);
        c *= 1.0 - uScan * 0.38 * s;
      }

      /* film grain */
      if (uGrain > 0.001){
        float n = hash21(uv * (uRes * 0.5) + fract(uTime * 7.13) * 91.7);
        c += (n - 0.5) * uGrain * 0.14;
      }

      /* vignette + tracking-band shimmer */
      float vd = length(uv - 0.5);
      c *= 1.0 - uVig * smoothstep(0.32, 0.78, vd);
      c += band * 0.05;

      gl_FragColor = vec4(c, 1.0);
    }`
});
const fsq = new FSQuad(finalMat);

/* render targets (rebuilt on resize / quality change) */
let sceneRT = null;
const bloomLv = [];                       // [{a, b}] at 1/2, 1/4, 1/8 res
let msaaSamples = 4;
function buildTargets(w, h){
  if (sceneRT) sceneRT.dispose();
  for (const lv of bloomLv){ lv.a.dispose(); lv.b.dispose(); }
  bloomLv.length = 0;
  sceneRT = new THREE.WebGLRenderTarget(w, h, {
    type: THREE.HalfFloatType, samples: msaaSamples, depthBuffer: true });
  let bw = w, bh = h;
  for (let i = 0; i < 3; i++){
    bw = Math.max(1, bw >> 1); bh = Math.max(1, bh >> 1);
    const opts = { type: THREE.HalfFloatType, depthBuffer: false };
    bloomLv.push({ a: new THREE.WebGLRenderTarget(bw, bh, opts),
                   b: new THREE.WebGLRenderTarget(bw, bh, opts),
                   texel: new THREE.Vector2(1 / bw, 1 / bh) });
  }
  finalMat.uniforms.uRes.value.set(w, h);
}

function renderFrame(){
  renderer.setRenderTarget(sceneRT);
  renderer.render(scene, camera);

  // bloom auto-disables at strength 0 (incl. the audio-driven extra term)
  const bloomOn = finalMat.uniforms.uBloomStr.value > 0.001;
  if (bloomOn){
    brightMat.uniforms.tSrc.value = sceneRT.texture;
    // audio also lowers the threshold so beats visibly widen the glow
    brightMat.uniforms.uThresh.value =
      clamp(state.post.bloomThr - audioBloom * 0.35, 0.05, 1);
    renderer.setRenderTarget(bloomLv[0].a);
    fsq.render(brightMat);
    let src = bloomLv[0].a.texture;
    for (const lv of bloomLv){
      blurMat.uniforms.uTexel.value.copy(lv.texel);
      blurMat.uniforms.tSrc.value = src;
      blurMat.uniforms.uDir.value.set(1, 0);
      renderer.setRenderTarget(lv.b);  fsq.render(blurMat);
      blurMat.uniforms.tSrc.value = lv.b.texture;
      blurMat.uniforms.uDir.value.set(0, 1);
      renderer.setRenderTarget(lv.a);  fsq.render(blurMat);
      src = lv.a.texture;
    }
    finalMat.uniforms.tB0.value = bloomLv[0].a.texture;
    finalMat.uniforms.tB1.value = bloomLv[1].a.texture;
    finalMat.uniforms.tB2.value = bloomLv[2].a.texture;
  }
  finalMat.uniforms.tScene.value = sceneRT.texture;
  renderer.setRenderTarget(null);
  fsq.render(finalMat);
}

/* ════════════════════════════════════════════════════════════════════
   13. AUDIO REACTIVITY — Wallpaper Engine feed / mic / audio file
   ════════════════════════════════════════════════════════════════════
   Raw band energy → attack/decay envelope → rolling-peak normalization,
   so motion follows the music instead of jittering.                    */

const isWE = typeof window.wallpaperRegisterAudioListener === 'function';

const audioEng = {
  vals: { off: 0, bass: 0, mid: 0, treble: 0 },     // normalized 0..1
  raw:  { bass: 0, mid: 0, treble: 0 },
  env:  { bass: 0, mid: 0, treble: 0 },
  peak: { bass: 0.25, mid: 0.25, treble: 0.25 },
  floor:{ bass: 0, mid: 0, treble: 0 },
  ctx: null, analyser: null, freq: null,
  micStream: null, sysStream: null, audioEl: null, fileUrl: null,
  weFresh: false,
};
/* Flipped once boot has painted. Until then the 'auto' source will not fall
   back to the microphone — see applyAudio.                                */
let audioArmed = false;

/* Wallpaper Engine: 128 floats = 64 left + 64 right, low → high */
if (isWE){
  window.wallpaperRegisterAudioListener(arr => {
    if (!state.audio.on) return;
    let bass = 0, mid = 0, treb = 0;
    for (let ch = 0; ch < 2; ch++){
      const o = ch * 64;
      for (let i = 0; i < 8;  i++) bass += arr[o + i];
      for (let i = 8; i < 28; i++) mid  += arr[o + i];
      for (let i = 28; i < 64; i++) treb += arr[o + i];
    }
    audioEng.raw.bass   = clamp(bass / 16, 0, 2);
    audioEng.raw.mid    = clamp(mid  / 40, 0, 2);
    audioEng.raw.treble = clamp(treb / 72 * 2.2, 0, 2);
    audioEng.weFresh = true;
  });
}

function audioEnsureCtx(){
  if (!audioEng.ctx){
    audioEng.ctx = new (window.AudioContext || window.webkitAudioContext)();
    audioEng.analyser = audioEng.ctx.createAnalyser();
    /* 2048 → 23.4 Hz bins at 48 kHz. At 1024 the bass band got only four
       46.9 Hz bins and everything under 46.9 Hz fell in bin 0, which is
       skipped as DC — so sub-bass was invisible. Costs ~21 ms more
       window, which no one can see in a wallpaper.                     */
    audioEng.analyser.fftSize = 2048;
    audioEng.analyser.smoothingTimeConstant = 0.35;
    audioEng.freq = new Uint8Array(audioEng.analyser.frequencyBinCount);
  }
  audioEng.ctx.resume();
}
async function audioUseMic(){
  try {
    audioEnsureCtx();
    if (!audioEng.micStream)
      audioEng.micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    audioEng.ctx.createMediaStreamSource(audioEng.micStream).connect(audioEng.analyser);
    toast('Microphone connected');
  } catch { toast('Microphone unavailable — try an audio file'); }
}
/** Computer audio in a normal browser: screen/tab share with audio.
    (Inside Wallpaper Engine the system feed arrives automatically.)  */
async function audioUseSystem(){
  try {
    audioEnsureCtx();
    const stream = await navigator.mediaDevices.getDisplayMedia(
      { video: true, audio: true,
        systemAudio: 'include', selfBrowserSurface: 'include' });
    if (!stream.getAudioTracks().length){
      for (const t of stream.getTracks()) t.stop();
      toast('That share had no audio. Chrome/Edge offer audio only for tabs '
          + '(or the entire screen on Windows) — pick one of those and tick '
          + 'its “share audio” box. Otherwise use mic or an audio file.');
      return;
    }
    for (const t of stream.getVideoTracks()) t.stop();   // audio only
    audioEng.sysStream = stream;
    audioEng.ctx.createMediaStreamSource(stream).connect(audioEng.analyser);
    toast('System audio connected');
  } catch { toast('System audio unavailable — try mic or a file'); }
}
function audioUseFile(file){
  audioEnsureCtx();
  if (audioEng.fileUrl) URL.revokeObjectURL(audioEng.fileUrl);
  audioEng.fileUrl = URL.createObjectURL(file);
  if (!audioEng.audioEl){
    audioEng.audioEl = new Audio();
    audioEng.audioEl.loop = true;
    const src = audioEng.ctx.createMediaElementSource(audioEng.audioEl);
    src.connect(audioEng.analyser);
    audioEng.analyser.connect(audioEng.ctx.destination);
  }
  audioEng.audioEl.src = audioEng.fileUrl;
  audioEng.audioEl.play();
  const bp = document.getElementById('btnAudioPause');
  if (bp) bp.textContent = '⏸';
  updateVis();                       // reveals the playback player row
  toast('Playing: ' + file.name);
}
function audioTeardown(){
  if (audioEng.micStream){
    for (const t of audioEng.micStream.getTracks()) t.stop();
    audioEng.micStream = null;
  }
  if (audioEng.sysStream){
    for (const t of audioEng.sysStream.getTracks()) t.stop();
    audioEng.sysStream = null;
  }
  if (audioEng.audioEl) audioEng.audioEl.pause();
  if (audioEng.ctx) audioEng.ctx.suspend();
  for (const k of ['bass', 'mid', 'treble'])
    audioEng.vals[k] = audioEng.env[k] = audioEng.raw[k] = audioEng.floor[k] = 0;
}

/** per-frame: fill raw bands from analyser, run envelopes (real dt) */
function audioUpdate(dt){
  const a = state.audio;
  if (!a.on) return;
  const src = a.src === 'auto' ? (isWE ? 'we' : 'mic') : a.src;
  if (src !== 'we' && audioEng.analyser && audioEng.ctx &&
      audioEng.ctx.state === 'running'){
    audioEng.analyser.getByteFrequencyData(audioEng.freq);
    const nyq = audioEng.ctx.sampleRate / 2;
    const bin = hz => clamp(Math.round(hz / nyq * audioEng.freq.length), 0,
                            audioEng.freq.length - 1);
    const avg = (a0, b0) => {
      let s = 0; const i0 = bin(a0), i1 = Math.max(bin(b0), i0 + 1);
      for (let i = i0; i < i1; i++) s += audioEng.freq[i];
      return s / (i1 - i0) / 255;
    };
    audioEng.raw.bass   = avg(35, 250)   * 1.4;
    audioEng.raw.mid    = avg(250, 2200) * 1.6;
    audioEng.raw.treble = avg(2200, 9000) * 2.0;
  } else if (src === 'we' && !audioEng.weFresh){
    // WE feed stalls when audio is silent — decay toward zero
    audioEng.raw.bass *= 0.94; audioEng.raw.mid *= 0.94; audioEng.raw.treble *= 0.94;
  }
  audioEng.weFresh = false;

  const atk = 1 - Math.exp(-dt / 0.035);
  const dec = 1 - Math.exp(-dt / lerp(0.09, 0.5, a.smooth));
  const rel = 1 - Math.exp(-dt / 9);          // floor creep, mirrors peak release
  for (const k of ['bass', 'mid', 'treble']){
    const raw = audioEng.raw[k], env = audioEng.env[k];
    audioEng.env[k] = env + (raw - env) * (raw > env ? atk : dec);
    /* Rolling peak AND floor. A peak alone equalizes each band's
       loudness but not its DYNAMICS: bass in music is near-continuous,
       so it sat at ~0.9 of its own peak and hardly moved, while
       intermittent treble swung freely — which made every bass-driven
       effect look dead next to a treble one. Mapping each band from its
       own recent floor→peak range equalizes how much the bands MOVE.
       The floor drops instantly to new minima and creeps back over 9 s,
       the mirror of the peak's release; the minimum span stops a steady
       drone from being amplified into jitter.                          */
    audioEng.peak[k] = Math.max(raw, audioEng.peak[k] * Math.exp(-dt / 9));
    const fl = audioEng.floor[k];
    const raised = raw < fl ? raw : fl + (raw - fl) * rel;
    /* The floor is never allowed to close all the way onto the peak: a
       long sustained pad has no dips to hold it down, so it would creep
       up, starve its own range and fade the effects to nothing over
       ~30 s. Capping it also bounds the expansion to ~6.7x.            */
    audioEng.floor[k] = Math.min(raised, audioEng.peak[k] * 0.85);
    const span = Math.max(audioEng.peak[k] - audioEng.floor[k], 0.12);
    audioEng.vals[k] = clamp((audioEng.env[k] - audioEng.floor[k]) / span, 0, 1);
  }
}
const bandVal = m => m.band === 'off' ? 0 : audioEng.vals[m.band] * m.sens;
/** like bandVal, but with a silence floor cut so the value pulses with
    beats instead of riding the auto-gain plateau — for halo effects   */
const bandPulse = m => m.band === 'off' ? 0
  : Math.max(audioEng.vals[m.band] - 0.22, 0) / 0.78 * m.sens;

/* ════════════════════════════════════════════════════════════════════
   14. RANDOMIZER — seeded, curated, mood-biased
   ════════════════════════════════════════════════════════════════════ */

/** Procedural palette inside HSL constraints that guarantee harmony:
    dark desaturated sky base + complementary/analogous neon accents. */
function genPalette(rng, dark){
  const h0  = R.range(rng, 0, 360);                       // sky family
  const rot = R.pick(rng, [-1, 1]) * R.range(rng, 130, 200); // accent family
  const ha  = h0 + rot;
  const skyL = dark ? [0.028, 0.085, 0.3]  : [0.045, 0.15, 0.5];
