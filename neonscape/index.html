           the same construction the sea shader uses.
           This has to be a real mirror. A flat colour wash here (the first
           attempt) just painted the puddles a colour while the dry tarmac
           kept mirroring everything, which is backwards.               */
        vec3 Vp = normalize(vPos - uCamPos);
        /* Sampled off the FLAT mirror ray, never the rippled one. The road
           is seen at a hair above grazing, so its own ray elevation is
           tiny (≈camH/dist) — a ripple bends the ray several times harder
           than that, sweeping a huge arc of the sky dome per pixel. The
           gradient then boils, and in screen space it banded into
           horizontal stripes right across the road. This is the same rule
           the sea's sun glint follows, for the same reason.            */
        float el = max(-Vp.y, 0.0);              // flat-water ray elevation
        float hh = clamp(el * 1.6 + 0.02, 0.0, 1.0);
        vec3 sky = hh < uSkyMidPos
          ? mix(uSkyBot, uSkyMid, smoothstep(0.0, uSkyMidPos, hh))
          : mix(uSkyMid, uSkyTop, smoothstep(uSkyMidPos, 1.0, hh));
        /* Ripples modulate the water's BRIGHTNESS instead, which reads as
           wobble without touching the colour.
           Their variation is kept almost entirely in X. Perspective
           crushes z — hundreds of world units into the last screen rows —
           so ANY appreciable z-frequency turns into transverse banding
           across the road however well it is anti-aliased. Waves running
           along the travel direction are also what water on a road
           actually looks like. Each wave additionally dies as its own
           wavelength nears pixel size, the guard seaMat's slopeAdd uses. */
        float pw = fwidth(vPos.x) + fwidth(vPos.z);
        float d1 = 1.92 * pw, d2 = 3.13 * pw;    // |frequency| of each wave
        float rip = sin(vPos.x * 1.9 + vPos.z * 0.25 + uTimeG * 2.4)
                      * exp(-d1 * d1)
                  + sin(vPos.x * 3.1 - vPos.z * 0.4 + uTimeG * 1.6) * 0.7
                      * exp(-d2 * d2);
        /* Grazing water mirrors hard, steep water shows the tarmac under
           it — which is why the far road goes bright and near puddles stay
           darker. The floor is well above the physical 0.04 (the sea
           shader does the same): at this camera height the near rows are
           steep enough that a physical Fresnel makes puddles vanish
           exactly where the viewer is looking. Base is clamped to [0,1]
           so pow is always defined.                                    */
        float Fp = 0.18 + 0.82 * pow(1.0 - clamp(el, 0.0, 1.0), 5.0);
        c += sky * Fp * (1.0 + rip * 0.3) * pud * uPuddle * bed * uRoadGloss
           * 0.7 * (1.0 - ff) * (1.0 - hb);

        float dash = dashOn(dz, uDashDuty, dAA);
        vec3  pc = vec3(0.0);        // paint colour, coverage-weighted
        float pa = 0.0;              // paint coverage
        vec3  pg = vec3(0.0);        // additive bleed around the paint
        /* Painted markings sit just under 1 so they read as retroreflective
           paint; the neon styles run above it and bloom in their own hue. */
        const float PAINT = 0.85, NEON = 1.7, BLEED = 0.3;

        /* centre: one line, or a pair straddling the middle */
        if (uCtrN > 0.5){
          float sep = uMarkW * 3.5;
          float o = uCtrN > 1.5 ? sep : 0.0;
          float d1 = rx - o, d2 = rx + o;
          float dsh = mix(1.0, dash, uCtrDash);
          float cov = (stripeCov(d1, uMarkW, rAA)
                     + stripeCov(d2, uMarkW, rAA) * step(0.5, uCtrN - 1.5)) * dsh;
          float bl  = (lineBleed(d1, uMarkW)
                     + lineBleed(d2, uMarkW) * step(0.5, uCtrN - 1.5)) * dsh;
          inkAdd(uCtrColor * PAINT, min(cov, 1.0), bl * BLEED, pc, pa, pg);
        }
        /* neon inlay — a light bar sunk INTO the tarmac rather than paint
           laid on top of it, so it keeps glowing where the surface is
           darkest and throws a wide spill across the lanes either side */
        if (uCtrStrip > 0.5){
          float w = uMarkW * 2.6;
          float g = max(arx - w, 0.0) / max(uRoadW * 0.3, 0.5);
          inkAdd(uCtrColor * NEON, stripeCov(rx, w, rAA),
                 exp(-g * g * 3.0) * 0.28, pc, pa, pg);
        }
        /* lane dividers, always dashed. Constant loop bounds with the
           uniform test inside — GLSL ES wants the count fixed. An even
           lane count puts a boundary exactly on the centre line; that slot
           belongs to the centre style, so it is skipped, not drawn twice. */
        if (uLanes > 1.5){
          for (int i = 1; i < 6; i++){
            float fi = float(i);
            if (fi < uLanes){
              float o = uRoadW * (2.0 * fi / uLanes - 1.0);
              float w = uMarkW * 0.8;
              float k = dash * step(uMarkW * 4.0, abs(o));
              inkAdd(uEdgeColor * PAINT, stripeCov(rx - o, w, rAA) * k,
                     lineBleed(rx - o, w) * k * BLEED, pc, pa, pg);
            }
          }
        }
        /* edges: painted lines, or fat neon rails set just inside the kerb */
        if (uEdgeOn > 0.5){
          float ew = mix(uMarkW, uMarkW * 2.2, uEdgeRail);
          float o  = uRoadW - ew * 1.4;
          float dsh = mix(1.0, dash, uEdgeDash);
          float cov = (stripeCov(rx - o, ew, rAA)
                     + stripeCov(rx + o, ew, rAA)) * dsh;
          float bl  = (lineBleed(rx - o, ew) + lineBleed(rx + o, ew)) * dsh;
          inkAdd(uEdgeColor * mix(PAINT, NEON, uEdgeRail), min(cov, 1.0),
                 bl * mix(BLEED, 0.7, uEdgeRail), pc, pa, pg);
        }
        /* Keep the paint on the tarmac — a little wider than the bed so the
           bleed can spill over the kerb — and let it die into the fog and
           the horizon wash exactly as the floor beneath it does.
           Glow above 1 brightens the paint (into bloom); below 1 it fades
           the coverage instead, so 0 means "no markings" rather than
           "markings painted black".                                    */
        float gate = stripeCov(rx, uRoadW * 1.12, rAA);
        float vis  = gate * (1.0 - ff) * (1.0 - hb);
        float bright = uRoadGlow * (1.0 + uRoadPulse);
        c = mix(c, pc * max(bright, 1.0), pa * vis * min(bright, 1.0));
        c += pg * bright * vis;
      }
      #endif
      gl_FragColor = vec4(c, 1.0);
    }`
});
/* Puddles mirror the sky, so they read the sky dome's OWN uniform objects
   rather than copies — the water cannot drift from the sky above it, and
   the per-frame hue shift carries into the reflection for free. */
for (const [g, s] of [['uSkyTop','uTop'], ['uSkyMid','uMid'],
                      ['uSkyBot','uBot'], ['uSkyMidPos','uMidPos']])
  gridMat.uniforms[g] = skyMat.uniforms[s];
const gridGeo = new THREE.PlaneGeometry(900, 520, 150, 130);
gridGeo.rotateX(-Math.PI / 2);
gridGeo.translate(0, 0, -210);           // spans z +50 … -470
const gridMesh = new THREE.Mesh(gridGeo, gridMat);
gridMesh.frustumCulled = false;
scene.add(gridMesh);

/* ════════════════════════════════════════════════════════════════════
   8. HORIZON — mountains / cityscape / sea (one active at a time)
   ════════════════════════════════════════════════════════════════════ */

const mtnGroup = new THREE.Group();
scene.add(mtnGroup);
const cityGroup = new THREE.Group();
scene.add(cityGroup);

const MTN_W = 1500;                       // world width of the ridge span
/** ridge height at world x for one layer — the single source of truth
    shared by the drawn geometry and the baked reflection heightfield */
function ridgeAt(noise, x, H, freq, off){
  const ridge = Math.max(0, noise.fbm1(x * freq + off, 4) * 1.4 - 0.5) * H + 1.2;
  // fade ridges to the floor at screen edges so silhouettes never end abruptly
  return ridge * clamp(2.2 - Math.abs(x) / (MTN_W * 0.32), 0, 1);
}
/* ── city skyline data ────────────────────────────────────────────────
   Buildings live in fixed-width slots across the span. Each slot gets a
   height, side gaps and a window seed from a seeded rng; the SAME array
   feeds the row's shader (via a float DataTexture) and the reflection
   bank bake, so the skyline and its reflection can never disagree.    */
const CITY_ROWS_MAX = 3, CITY_SLOTS_MAX = 512, CITY_Z0 = -432;
const CITY_H_MAX = 1.9;                  // ceiling for the audio height pulse
/** Half-width the skyline must reach for `spread` of the SCREEN, so the
    max setting spans the horizon on any aspect ratio instead of running
    out of buildings on ultrawide displays. */
function cityHalfWidth(){
  const d = -CITY_Z0 + 18;                   // horizon row → camera distance
  /* This sizes real geometry, so it never trusts a float it did not compute
     itself. A non-finite aspect (see applyRendererSize) would otherwise
     build a PlaneGeometry of NaN vertices; three then reports a NaN
     bounding sphere and the driver answers INVALID_VALUE then
     INVALID_OPERATION for two frames, until any resize quietly heals it. */
  const asp = camera.aspect > 0 && Number.isFinite(camera.aspect)
    ? camera.aspect : 1;
  const halfScreen = d * Math.tan(state.cam.fov * Math.PI / 360) * asp;
  return Math.max(halfScreen * 1.06 * clamp(state.mtn.spread, 0.04, 1), 12);
}
/** spread falloff, 1 in the core → 0 at the edge. Shared by the shader
    and the reflection bake via the identical GLSL below. */
function citySpreadK(x, halfW){
  const t = clamp((Math.abs(x) / halfW - 0.55) / 0.45, 0, 1);
  return 1 - t * t * (3 - 2 * t);            // smoothstep(0.55, 1, |x|/halfW)
}
const GLSL_CITY_SPREAD = /* glsl */`
  float citySpreadK(float x, float halfW){
    return 1.0 - smoothstep(0.55, 1.0, abs(x) / halfW);
  }`;
/** Raw slot heights, independent of spread — spread is applied later as a
    multiplier so changing it (or resizing) never reshuffles the skyline. */
function citySlots(m, li){
  const rng = mulberry32((((m.seed | 0) * 7349 + li * 131071) >>> 0) || 1);
  const slotW = 15 / clamp(m.density, 0.4, 2.5);
  const spanW = Math.min(cityHalfWidth() * 2.1, CITY_SLOTS_MAX * slotW);
  const n = Math.max(Math.ceil(spanW / slotW), 8);
  const H = m.height * Math.max(0.35, 1 - li * 0.22);   // nearer rows lower
  const data = new Float32Array(n * 4);
  for (let i = 0; i < n; i++){
    let h = 0;
    const empty = rng() < (li === 0 ? 0.08 : 0.03);     // skyline gaps
    const v = rng(), tower = rng() < 0.05 + 0.02 * m.rough;
    if (!empty){
      // rough = variety: higher pushes most buildings low, towers stand out
      h = H * (0.25 + 0.75 * Math.pow(v, 0.55 * m.rough + 0.45));
      if (tower) h = H * (0.95 + 0.3 * rng());
    }
    data[i * 4]     = h;
    data[i * 4 + 1] = 0.05 + rng() * 0.13;              // gap left  (slot frac)
    data[i * 4 + 2] = 0.05 + rng() * 0.13;              // gap right
    data[i * 4 + 3] = rng();                            // window seed
  }
  return { data, n, slotW, spanW: n * slotW };
}
/** skyline height at world x — bake-side mirror of the city shader */
function cityHAt(s, x, halfW){
  const u = (x + s.spanW / 2) / s.slotW;
  const i = Math.floor(u);
  if (i < 0 || i >= s.n) return 0;
  const f = u - i, o = i * 4;
  if (f < s.data[o + 1] || f > 1 - s.data[o + 2]) return 0;
  return s.data[o] * citySpreadK(x, halfW);
}

/** bake every horizon layer into the shared silhouette texture, nearest
    row first (the reflection loop walks near → far and stops on a hit) */
function bakeHorizon(){
  const m = state.mtn;
  const u = gridMat.uniforms;
  const isM = m.mode === 'mountains', isC = m.mode === 'city';
  if (!isM && !isC){ u.uHorizN.value = 0; return; }
  const noise = isM ? makeNoise((m.seed | 0) ^ 0x5eed) : null;
  const L = Math.min(m.layers, isC ? CITY_ROWS_MAX : HORIZ_MAX);
  const halfW = isC ? cityHalfWidth() : 0;
  const prof = new Float32Array(HORIZ_W);
  for (let row = 0; row < L; row++){
    const li = L - 1 - row;                       // row 0 = nearest layer
    const z = CITY_Z0 + li * 20;
    let maxH = 1e-3, span = MTN_W / 2;
    if (isM){
      const H = m.height * Math.max(0.22, 1 - li * 0.15);
      const freq = 0.0042 * m.rough * (1 + li * 0.35);
      const off = li * 137.7;
      for (let i = 0; i < HORIZ_W; i++){
        const x = -span + (i / (HORIZ_W - 1)) * MTN_W;
        const y = ridgeAt(noise, x, H, freq, off);
        prof[i] = y;
        if (y > maxH) maxH = y;
      }
    } else {
      const slots = citySlots(m, li);
      span = slots.spanW / 2;                     // the row's own x range
      for (let i = 0; i < HORIZ_W; i++){
        const x = -span + (i / (HORIZ_W - 1)) * slots.spanW;
        const y = cityHAt(slots, x, halfW);
        prof[i] = y;
        if (y > maxH) maxH = y;
      }
    }
    // stored normalised per layer, so 8 bits still resolve <0.2 world units
    for (let i = 0; i < HORIZ_W; i++){
      const o = (row * HORIZ_W + i) * 4;
      horizData[o] = Math.round(clamp(prof[i] / maxH, 0, 1) * 255);
      horizData[o + 1] = horizData[o + 2] = 0;
      horizData[o + 3] = 255;
    }
    u.uHorizData.value[row].set(z, maxH, span,
      clamp(1 - li * 0.28, 0.25, 1) * (isC ? 0.3 : 0.5)); // edge-line opacity
  }
  u.uHorizN.value = L;
  horizTex.needsUpdate = true;
}

function rebuildMountains(){
  // dispose previous
  for (const child of [...mtnGroup.children]){
    child.geometry.dispose(); child.material.dispose();
    mtnGroup.remove(child);
  }
  const m = state.mtn;
  if (m.mode !== 'mountains') return;

  const noise = makeNoise((m.seed | 0) ^ 0x5eed);
  const W = MTN_W, N = 220;

  for (let li = 0; li < m.layers; li++){
    const z = -432 + li * 20;                       // farthest layer first
    const H = m.height * Math.max(0.22, 1 - li * 0.15);  // nearer layers lower
    const freq = 0.0042 * m.rough * (1 + li * 0.35);
    const off = li * 137.7;

    const top = new Float32Array((N + 1) * 3);
    const pos = new Float32Array((N + 1) * 2 * 3);  // top+bottom strip
    const idx = [];
    for (let i = 0; i <= N; i++){
      const x = -W / 2 + (i / N) * W;
      const y = ridgeAt(noise, x, H, freq, off);
      top.set([x, y, z], i * 3);
      pos.set([x, y, z], i * 6);
      pos.set([x, -2, z], i * 6 + 3);
      if (i < N){
        const a = i * 2;
        idx.push(a, a + 1, a + 2, a + 1, a + 3, a + 2);
      }
    }
    const fillGeo = new THREE.BufferGeometry();
    fillGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    fillGeo.setIndex(idx);
    // scene fog at this distance would erase the silhouette entirely, so
    // atmospheric depth is blended manually per layer (see recolorHorizon)
    const fill = new THREE.Mesh(fillGeo,
      new THREE.MeshBasicMaterial({ fog: false }));
    fill.frustumCulled = false;
    fill.userData = { li, kind: 'fill' };
    mtnGroup.add(fill);

    const edgeGeo = new THREE.BufferGeometry();
    edgeGeo.setAttribute('position', new THREE.BufferAttribute(top, 3));
    const edge = new THREE.Line(edgeGeo,
      new THREE.LineBasicMaterial({ transparent: true,
        opacity: clamp(1 - li * 0.28, 0.25, 1),
        blending: THREE.AdditiveBlending, depthWrite: false, fog: false }));
    edge.frustumCulled = false;
    edge.userData = { li, kind: 'edge' };
    mtnGroup.add(edge);
  }
  bakeHorizon();
  recolorHorizon();
}

/* ── cityscape rows — procedural buildings with lit windows ─────────── */
const CITY_VERT = /* glsl */`
  varying vec3 vW;
  void main(){
    vec4 wp = modelMatrix * vec4(position, 1.0);
    vW = wp.xyz;
    gl_Position = projectionMatrix * viewMatrix * wp;
  }`;
const CITY_FRAG = /* glsl */`
  varying vec3 vW;
  uniform sampler2D uCityTex;
  uniform float uSlots, uSlotW, uSpanW, uHalfW, uHScale, uLit, uWinA, uEdgeGlow;
  uniform vec3 uFill, uWinC, uEdgeC;
  ${GLSL_HASH}
  ${GLSL_CITY_SPREAD}
  void main(){
    float u = (vW.x + uSpanW * 0.5) / uSlotW;
    float slot = floor(u);
    if (slot < 0.0 || slot >= uSlots) discard;
    vec4 B = texture2D(uCityTex, vec2((slot + 0.5) / uSlots, 0.5));
    // spread is a per-slot multiplier (never regenerates the skyline) and
    // uHScale is the audio height pulse — both mirrored in the bake
    float h = B.r * citySpreadK(vW.x, uHalfW) * uHScale;
    if (h < 0.6) discard;
    float f = u - slot;
    /* screen-space AA on the hard silhouette edges (roof + both sides) */
    float px = fwidth(vW.x), py = fwidth(vW.y);
    float pf = px / uSlotW;
    float alpha = smoothstep(B.g - pf, B.g + pf, f)
                * (1.0 - smoothstep(1.0 - B.b - pf, 1.0 - B.b + pf, f))
                * (1.0 - smoothstep(h - py, h + py, vW.y));
    if (alpha < 0.002) discard;
    /* windows: fixed world-size cells, LOD-faded to an average glow when
       a cell drops under ~3 px so far rows don't shimmer */
    vec2 cell = vec2(vW.x / 2.3, (vW.y + 1.0) / 3.5);
    vec2 ci = floor(cell), cf = fract(cell);
    float lit = step(hash21(ci + vec2(B.a * 917.3, B.a * 271.9)), uLit);
    float pxc = px / 2.3, pyc = py / 3.5;
    float wx = smoothstep(0.24 - pxc, 0.24 + pxc, cf.x)
             * (1.0 - smoothstep(0.76 - pxc, 0.76 + pxc, cf.x));
    float wy = smoothstep(0.30 - pyc, 0.30 + pyc, cf.y)
             * (1.0 - smoothstep(0.72 - pyc, 0.72 + pyc, cf.y));
    float lod = smoothstep(0.9, 0.4, pxc);
    /* keep windows clear of the roofline and the building edges */
    float inset = step(B.g + 0.05, f) * step(f, 0.95 - B.b)
                * (1.0 - smoothstep(h - 3.2, h - 1.4, vW.y));
    float win = mix(uLit * 0.20, wx * wy * lit, lod) * inset;
    vec3 c = uFill;
    c = mix(c, uFill * 0.45, (1.0 - lit) * wx * wy * lod * inset);  // dark glass
    c += uWinC * win * uWinA;
    /* thin neon roofline */
    c += uEdgeC * smoothstep(h - py * 2.5, h - py * 0.5, vW.y);
    gl_FragColor = vec4(c, alpha);
  }`;

function rebuildCity(){
  for (const c of [...cityGroup.children]){
    c.geometry.dispose();
    c.material.uniforms.uCityTex.value.dispose();
    c.material.dispose();
    cityGroup.remove(c);
  }
  const m = state.mtn;
  if (m.mode !== 'city') return;
  const L = Math.min(m.layers, CITY_ROWS_MAX);
  const halfW = cityHalfWidth();
  for (let li = 0; li < L; li++){
    const slots = citySlots(m, li);
    const tex = new THREE.DataTexture(slots.data, slots.n, 1,
      THREE.RGBAFormat, THREE.FloatType);
    tex.minFilter = tex.magFilter = THREE.NearestFilter;
    tex.needsUpdate = true;
    // headroom for the audio height pulse, or tall beats would clip
    const maxH = m.height * 1.35 * CITY_H_MAX + 6;
    const mat = new THREE.ShaderMaterial({
      transparent: true, depthWrite: false, fog: false,
      uniforms: {
        uCityTex: { value: tex },
        uSlots:   { value: slots.n },
        uSlotW:   { value: slots.slotW },
        uSpanW:   { value: slots.spanW },
        uHalfW:   { value: halfW },
        uHScale:  { value: 1 },
        uLit:     { value: m.lit },
        uWinA:    { value: 1 },
        uEdgeGlow:{ value: m.edgeGlow },
        uFill:    { value: col(m.fill) },
        uWinC:    { value: col(m.edge) },
        uEdgeC:   { value: col(m.edge) },
      },
      vertexShader: CITY_VERT, fragmentShader: CITY_FRAG,
    });
    const mesh = new THREE.Mesh(new THREE.PlaneGeometry(slots.spanW, maxH), mat);
    mesh.position.set(0, maxH / 2 - 2, CITY_Z0 + li * 20);
    mesh.frustumCulled = false;
    mesh.userData = { li };
    cityGroup.add(mesh);
  }
  bakeHorizon();
  recolorHorizon();
}

/* ── sea — far water band with real specular reflections ──────────────
   A flat plane whose normals are perturbed analytically per pixel; the
   reflected view ray then samples the sky gradient (Fresnel-weighted)
   and picks up the sun as a wave-broken glint column — sea-style
   reflections, not the floor shader's mirror smear. Invisible (zero
   draw calls, zero shading) in every other horizon mode.              */
const seaMat = new THREE.ShaderMaterial({
  /* depthTest OFF: the water sits 0.12 above the grid plane, far beyond
     depth-buffer resolution at 100-450 units — testing z-fights into
     stripes. Painting over the floor is also the wanted look: palms and
     beams (nearer, sorted later) rise out of the water, terrain can't
     poke through it, and the floor's own sun reflection is replaced by
     the sea's glint.                                                   */
  transparent: true, depthWrite: false, depthTest: false, fog: false,
  uniforms: {
    uTime:   { value: 0 },
    uWaveA:  { value: 0.5 },
    uWaveSpd:{ value: 0.5 },
    uChop:   { value: 1.0 },
    uGlint:  { value: 1.0 },
    uGlintBeam:{ value: 1.0 },
    uWaterY: { value: 0.55 },           // waterline in world units
    uWater:  { value: col('#0e0426') },
    uEdgeC:  { value: col('#ff2d95') },
    uSkyTop: { value: col('#070118') },
    uSkyMid: { value: col('#2b0a56') },
    uSkyBot: { value: col('#ff2d95') },
    uMidPos: { value: 0.42 },
    uHaze:   { value: 0.5 },
    uHazeC:  { value: col('#2b0a56') },
    uHorizC: { value: col('#ff2d95') },
    uHueR:   { value: 0 },
    uSunX:   { value: 0 },
    uSunY:   { value: 26 },
    uSunZ:   { value: -455 },
    uSunR:   { value: 62 },
    uSunOn:  { value: 1 },
    uSunC1:  { value: col('#ffd319') },
    uSunC2:  { value: col('#ff2975') },
    uSunC3:  { value: col('#8c1eff') },
    uZNear:  { value: -260 },
    uZFar:   { value: -450 },
  },
  vertexShader: /* glsl */`
    varying vec3 vW;
    void main(){
      vec4 wp = modelMatrix * vec4(position, 1.0);
      vW = wp.xyz;
      gl_Position = projectionMatrix * viewMatrix * wp;
    }`,
  fragmentShader: /* glsl */`
    varying vec3 vW;
    uniform float uTime, uWaveA, uWaveSpd, uChop, uGlint, uGlintBeam, uWaterY,
                  uMidPos, uHaze, uZNear, uZFar,
                  uSunX, uSunY, uSunZ, uSunR, uSunOn, uHueR;
    uniform vec3  uWater, uEdgeC, uSkyTop, uSkyMid, uSkyBot, uHazeC, uHorizC,
                  uSunC1, uSunC2, uSunC3;
    // shared uniform OBJECTS with gridMat — terrain and beams can't drift
    uniform float uAmp, uAmpPulse, uNScale, uNOff, uTerrNear;
    uniform int   uBeamN;
    uniform vec4  uBeamData[4];
    uniform float uBeamRot[4];
    uniform vec3  uBeamColor;
    uniform float uBeamBright;
    ${GLSL_HASH}
    ${GLSL_PNOISE}
    ${GLSL_ROADC}
    ${GLSL_TERR}
    vec3 hueRot(vec3 c, float a){
      const vec3 W = vec3(0.299, 0.587, 0.114);
      float ca = cos(a), sa = sin(a);
      vec3 d = c - vec3(dot(c, W));
      return vec3(dot(c, W)) + ca * d + sa * cross(vec3(0.57735), d);
    }
    /* one directional wave's contribution to the surface slope; the
       amplitude fades out as its wavelength nears pixel size so the far
       rows flatten into a clean mirror instead of aliasing */
    vec2 slopeAdd(vec2 p, vec2 d, float k, float a, float w, float t, float pw){
      a *= exp(-pow(k * pw * 1.2, 2.0));
      return d * (a * k * cos(dot(p, d) * k + t * w));
    }
    void main(){
      vec2 p = vW.xz;
      float t = uTime * uWaveSpd;
      float pw = fwidth(p.x) + fwidth(p.y);
      float kc = uChop;
      /* Dry land: terrain rising above the waterline pushes the sea
         aside, so hills emerge from the water instead of being painted
         over by it. Same terrH the grid displaces its vertices with.
         uWaterY raises the line, drowning more of the terrain.        */
      float land = terrH(p, uAmp + uAmpPulse);
      if (land > uWaterY) discard;
      // foam ring just under the waterline, scaled so it stays in
      // proportion however high the water is raised
      float beach = smoothstep(uWaterY * 0.04, uWaterY * 0.9, land);
      /* long crests mostly along x → the glint breaks into the classic
         vertical column; a couple of skewed components keep it organic */
      vec2 sl = vec2(0.0);
      sl += slopeAdd(p, vec2( 0.100, 0.995), 0.105 * kc, 0.85, 1.05, t, pw);
      sl += slopeAdd(p, vec2(-0.160, 0.987), 0.185 * kc, 0.50, 1.35, t, pw);
      sl += slopeAdd(p, vec2( 0.310, 0.951), 0.350 * kc, 0.28, 1.90, t, pw);
      sl += slopeAdd(p, vec2(-0.419, 0.908), 0.700 * kc, 0.16, 2.60, t, pw);
      sl += slopeAdd(p, vec2( 0.548, 0.837), 1.400 * kc, 0.09, 3.40, t, pw);
      sl += slopeAdd(p, vec2( 0.750, 0.661), 2.600 * kc, 0.05, 5.00, t, pw);
      sl += slopeAdd(p, vec2(-0.702, 0.712), 2.900 * kc, 0.05, 5.60, t, pw);
      vec3 n = normalize(vec3(-sl.x * uWaveA * 2.2, 1.0, -sl.y * uWaveA * 2.2));
      vec3 V = normalize(vW - cameraPosition);
      vec3 R = reflect(V, n);
      R.y = abs(R.y);
      /* sky reflection — the sky dome's exact 3-stop gradient */
      float hh = clamp(R.y * 1.6 + 0.02, 0.0, 1.0);
      vec3 sky = hh < uMidPos
        ? mix(uSkyBot, uSkyMid, smoothstep(0.0, uMidPos, hh))
        : mix(uSkyMid, uSkyTop, smoothstep(uMidPos, 1.0, hh));
      sky += uHazeC * uHaze * 0.6 * exp(-R.y * 9.0);
      if (uHueR != 0.0) sky = hueRot(sky, uHueR);
      /* wave faces tilted toward the camera catch the bright low sky,
         away faces fall dark — the horizontal streaking that makes the
         surface read as water even at steep viewing angles */
      sky *= 1.0 + clamp(-sl.y * uWaveA * 5.0, -0.5, 1.1);
      /* Fresnel floor raised a touch over the physical 0.04: synthwave
         water is stylized-reflective, and it keeps near rows alive */
      float F = 0.08 + 0.92 * pow(1.0 - clamp(dot(-V, n), 0.0, 1.0), 5.0);
      vec3 c = mix(uWater * (0.35 + 0.3 * n.y), sky, F);
      float glintA = 0.0;                  // specular energy → drives alpha
      /* sun glint: reflected ray vs the real sun disc, plus a soft tail
         and a drifting shimmer so the column sparkles */
      if (uSunOn > 0.5){
        vec3 sp = vec3(uSunX, uSunY, uSunZ);
        vec3 S = normalize(sp - vW);
        float ang = acos(clamp(dot(R, S), -1.0, 1.0));
        float sunA = uSunR / max(length(sp - vW), 1.0);
        float core = 1.0 - smoothstep(sunA * 0.55, sunA * 1.5, ang);
        float tail = exp(-ang / (sunA * 2.2)) * 0.35;
        float shimmer = 0.75 + 0.5 *
          pnoise(p * vec2(0.9, 0.35) + vec2(t * 1.7, t * 0.6), 64.0);
        /* Colour the glint with the part of the disc this patch of water
           actually mirrors, so a gradient sun lays its own colours down
           the column instead of one averaged tint. Sampled off the FLAT
           mirror ray, not the wave-perturbed one: near the horizon a
           grazing ray swings wildly over the disc and the gradient would
           boil. The waves already break up the intensity above.        */
        vec3 Rf = vec3(V.x, -V.y, V.z);        // ideal (glassy) mirror
        vec3 sg = mix(uSunC2, uSunC1, 0.35);
        if (abs(Rf.z) > 1e-4){
          float ti = (uSunZ - vW.z) / Rf.z;
          if (ti > 0.0){
            float dy = (vW.y + Rf.y * ti - uSunY) / max(uSunR, 1.0);
            float tG = clamp(dy * 0.5 + 0.5, 0.0, 1.0);
            sg = mix(uSunC3, uSunC2, smoothstep(0.0, 0.55, tG));
            sg = mix(sg, uSunC1, smoothstep(0.55, 1.0, tG));
          }
        }
        c += sg * (core * 1.6 + tail) * uGlint * shimmer;
        glintA += (core * 1.1 + tail * 0.5) * uGlint;
      }
      /* beams glint on the water the same way the sun does: reflect the
         view ray off the wave and see whether it lands inside a shaft */
      if (uGlintBeam > 0.001){
        for (int i = 0; i < 4; i++){
          if (i >= uBeamN) break;
          vec4 B = uBeamData[i];
          float tb = (B.y - vW.z) / R.z;
          if (tb <= 0.0) continue;
          vec2 dd = vec2(vW.x + R.x * tb - B.x, vW.y + R.y * tb);
          float cs = cos(uBeamRot[i]), sn = sin(uBeamRot[i]);
          vec2 lp = vec2(dd.x * cs + dd.y * sn, -dd.x * sn + dd.y * cs);
          float vy = lp.y / max(B.w, 1.0);
          if (vy < 0.0 || vy > 1.0) continue;
          float bx = lp.x / max(B.z, 0.001);
          float yv = 1.0 - vy;
          float ba = exp(-bx * bx * 4.5) * yv * sqrt(yv);
          float bc = exp(-bx * bx * 16.0) * yv;
          float bsh = 0.65 + 0.6 * pnoise(
            p * vec2(1.1, 0.4) + vec2(t * 2.1, t * 0.7), 64.0);
          c += (uBeamColor * 1.9 + uBeamColor * bc * uBeamBright * 2.4)
             * ba * uGlintBeam * bsh;
          glintA += ba * uGlintBeam * 0.8;
        }
      }
      /* settle into the grid's horizon color on the last rows (seam) */
      c = mix(c, uHorizC, smoothstep(uZFar + 55.0, uZFar + 6.0, vW.z) * 0.45);

      /* ── shoreline ──────────────────────────────────────────────────
         The waterline meanders and drifts rather than ruling a straight
         line across the floor, and sets of crests roll in and break on
         it. All amplitudes are WORLD units, so a thin (far) sea shrinks
         them into the horizon by perspective alone.                   */
      float meander = sin(p.x * 0.055 + t * 0.31) * 6.5
                    + sin(p.x * 0.021 - t * 0.19) * 10.0
                    + (pnoise(vec2(p.x * 0.011, t * 0.04), 64.0) - 0.5) * 24.0;
      float edgeZ = uZNear + meander;
      float d = edgeZ - vW.z;                 // >0 still water, <0 past shore
      // breakers: crest lines marching toward the beach, tightening as
      // they arrive, plus a bright lip exactly on the waterline
      float roll = fract(d * 0.055 - t * 0.5);
      float crest = smoothstep(0.62, 0.97, roll) * smoothstep(90.0, 12.0, d);
      float lip = exp(-abs(d) * 0.22);
      float surf = crest * 0.55 + lip * 0.9;
      // the same treatment where water meets a hill it can't cover
      // ripple frequency is relative to the waterline, so raising the
      // water doesn't shred the foam into high-frequency noise
      surf += beach * (0.5 + 0.5 * sin(land / max(uWaterY, 0.05) * 5.0
                                       - t * 3.0)) * 1.15;
      c += uEdgeC * surf;
      glintA += surf * 0.5;

      /* Fresnel drives ALPHA too: far, grazing water is a near mirror,
         but shallow near water stays translucent so the neon grid — and
         the floor's own sun reflection — still read underneath. Capped
         under 1 so the two always coexist instead of one winning.     */
      float alpha = clamp(0.30 + 0.55 * F + glintA, 0.0, 0.93)
                  * smoothstep(-2.0, 3.5, d);
      gl_FragColor = vec4(c, alpha);
    }`
});
/* Share the uniform OBJECTS (not copies) that describe the terrain and
   the beams, so the water's coastline and its beam glints are always
   the exact same data the floor shader uses — nothing to keep in sync. */
for (const k of ['uAmp', 'uAmpPulse', 'uNScale', 'uNOff', 'uTerrNear',
                 'uRoadX', 'uRoadCv', 'uCorrIn', 'uCorrOut',
                 'uBeamN', 'uBeamData', 'uBeamRot', 'uBeamColor', 'uBeamBright'])
  seaMat.uniforms[k] = gridMat.uniforms[k];

const seaGeo = new THREE.PlaneGeometry(MTN_W, 1, 1, 1);

/** Extent is defined in SCREEN terms (degrees below the horizon), not
    world z — perspective crams hundreds of far units into a few pixel
    rows, so a world-z band would be invisible. Derived from the camera
    height, so applyCam refreshes it too.                              */
function syncSeaExtent(spanMul = 1){
  if (state.mtn.mode !== 'sea') return;
  const su = seaMat.uniforms;
  const camZ = 18, h = Math.max(state.cam.height, 0.6);
  /* Angle is capped at ~10.5°, about a third of the visible floor: past
     that the water swallows the grid instead of sitting on the horizon
     the way the mountains and skyline do. 0.5 ≈ 3.6°, a far strip.   */
  const sp = clamp(state.mtn.span * spanMul, 0.05, 1);
  const ang = 0.004 + 0.18 * Math.pow(sp, 1.6);
  const zF = -450;
  const zN = clamp(camZ - h / Math.tan(ang), zF + 25, camZ - 12);
  su.uZFar.value = zF;
  su.uZNear.value = zN;
  seaMesh.scale.z = zN - zF;
  seaMesh.position.set(0, 0.12, (zN + zF) / 2);
}

/** fill = silhouette color pushed toward the fog/sky color with distance;
    edge = neon accent line, brighter than 1.0 so bloom picks it up.
    Covers whichever horizon type is active (also syncs sea sky colors). */
function recolorHorizon(){
  const m = state.mtn;
  // silhouette haze scales with the fog-depth setting (and deepens
  // further past 1.0 — the "mountains dissolving into sky" look).
  // Floored at 0.35: with no haze at all the fills collapse into a
  // solid black band that reads as a hole above the grid.
  const fogK = clamp(state.sky.fog, 0.35, 1.5);
  if (m.mode === 'mountains'){
    const L = Math.min(m.layers, HORIZ_MAX);
    for (const child of mtnGroup.children){
      const { li, kind } = child.userData;
      if (kind === 'fill'){
        child.material.color.set(m.fill)
          .lerp(scene.fog.color, clamp((0.55 - li * 0.17) * fogK, 0.05, 0.95));
        // the reflection samples the same per-layer color (row = near→far)
        const row = L - 1 - li;
        if (row >= 0 && row < HORIZ_MAX)
          gridMat.uniforms.uHorizCol.value[row].copy(child.material.color);
      } else {
        child.material.color.set(m.edge).multiplyScalar(0.4 + m.edgeGlow * 1.1);
      }
    }
    gridMat.uniforms.uHorizEdge.value.set(m.edge)
      .multiplyScalar(0.4 + m.edgeGlow * 1.1);
  } else if (m.mode === 'city'){
    const L = Math.min(m.layers, CITY_ROWS_MAX);
    for (const mesh of cityGroup.children){
      const li = mesh.userData.li, u = mesh.material.uniforms;
      // li 0 = farthest. depth 0 → far, 1 → nearest row
      const depth = L > 1 ? li / (L - 1) : 0;
      /* Atmospheric perspective, exaggerated so the rows read apart: far
         rows wash toward the sky AND stay pale, near rows drop into a
         darker, more saturated silhouette with brighter windows.       */
      u.uFill.value.set(m.fill)
        .lerp(scene.fog.color, clamp((0.5 - li * 0.16) * fogK, 0.05, 0.9))
        .multiplyScalar(1 - depth * 0.42);
      u.uWinC.value.set(m.edge).multiplyScalar(
        (0.5 + m.edgeGlow) * (0.5 + depth * 0.5));
      u.uEdgeC.value.set(m.edge).multiplyScalar(
        m.edgeGlow * 0.35 * (0.55 + depth * 0.45));
      u.uLit.value = m.lit;
      const row = L - 1 - li;
      if (row >= 0 && row < HORIZ_MAX)
        gridMat.uniforms.uHorizCol.value[row].copy(u.uFill.value);
    }
    gridMat.uniforms.uHorizEdge.value.set(m.edge)
      .multiplyScalar(0.3 + m.edgeGlow * 0.5);
  } else if (m.mode === 'sea'){
    const k = state.sky, su = seaMat.uniforms;
    su.uWater.value.set(m.fill);
    su.uEdgeC.value.set(m.edge).multiplyScalar(0.4 + m.edgeGlow * 1.1);
    su.uSkyTop.value.set(k.top);
    su.uSkyMid.value.set(k.mid);
    su.uSkyBot.value.set(k.bot);
    su.uMidPos.value = k.midPos;
    su.uHazeC.value.set(k.bot);
    su.uHaze.value = state.clouds.haze;
    su.uHorizC.value.copy(gridMat.uniforms.uHorizC.value);
  }
}

/* ════════════════════════════════════════════════════════════════════
   9. STARS — instanced point dome + shooting-star pool
   ════════════════════════════════════════════════════════════════════ */

const STAR_MAX = 1400;
const starGeo = new THREE.BufferGeometry();
{
  const pos   = new Float32Array(STAR_MAX * 3);
  const aSize = new Float32Array(STAR_MAX);
  const aPhase= new Float32Array(STAR_MAX);
  const aSpd  = new Float32Array(STAR_MAX);
  const aTint = new Float32Array(STAR_MAX);
  const rng = mulberry32(991124);            // fixed layout, density via drawRange
  let i = 0;
  while (i < STAR_MAX){
    const u = rng() * 2 - 1, v = rng() * 2 - 1, w = rng() * 2 - 1;
    const l = Math.hypot(u, v, w);
    if (l < 0.2 || l > 1) continue;
    const y = v / l;
    if (y < 0.02) continue;                  // above horizon only
    pos.set([u / l * 700, y * 700, w / l * 700], i * 3);
    aSize[i]  = 0.9 + rng() * 1.9;
    aPhase[i] = rng() * Math.PI * 2;
    aSpd[i]   = 0.4 + rng() * 1.4;
    aTint[i]  = rng();
    i++;
  }

  starGeo.setAttribute('aSize',  new THREE.BufferAttribute(aSize, 1));
  starGeo.setAttribute('aPhase', new THREE.BufferAttribute(aPhase, 1));
  starGeo.setAttribute('aSpd',   new THREE.BufferAttribute(aSpd, 1));
  starGeo.setAttribute('aTint',  new THREE.BufferAttribute(aTint, 1));

const starMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, fog: false,
  uniforms: {
    uTime:  { value: 0 },
    uTwk:   { value: 0.8 },
    uColor: { value: col('#9fd8ff') },
    uBright:{ value: 1 },                    // audio-reactive
    uSize:  { value: 1 },
    uPx:    { value: 1 },
  },
  vertexShader: /* glsl */`
    attribute float aSize;
    attribute float aPhase;
    attribute float aSpd;
    attribute float aTint;
    varying float vTw;
    varying float vTint;
    uniform float uTime, uTwk, uSize, uPx;
    void main(){
      float tw = uTwk > 0.001
        ? 0.55 + 0.45 * sin(uTime * (0.6 + uTwk * 2.4) * aSpd + aPhase)
        : 1.0;
      vTw = tw; vTint = aTint;
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      gl_PointSize = aSize * uSize * uPx * (0.75 + 0.5 * tw);
      gl_Position = projectionMatrix * mv;
    }`,
  fragmentShader: /* glsl */`
    varying float vTw;
    varying float vTint;
    uniform vec3 uColor;
    uniform float uBright;
    void main(){
      float d = length(gl_PointCoord - 0.5);
      float a = smoothstep(0.5, 0.12, d) * vTw * uBright;
      vec3 c = mix(vec3(1.0), uColor, vTint);
      gl_FragColor = vec4(c * a, a);
    }`
});
const starPoints = new THREE.Points(starGeo, starMat);
starPoints.frustumCulled = false;
starPoints.renderOrder = -1;      // behind the sun disc (transparent sorting)
scene.add(starPoints);

/* shooting stars: tiny pool of streak sprites steered from JS */
/* Normal blending + clamped falloffs: additive mesh quads and unclamped
   pow() bases rendered as black boxes on some GPUs (NaN / driver blend
   quirks). Alpha-blended bright color over the dark sky looks the same. */
const shootMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, fog: false,
  uniforms: { uOpacity: { value: 0 }, uColor: { value: col('#cfe8ff') } },
  vertexShader: /* glsl */`
    varying vec2 vUv;
    void main(){ vUv = uv;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: /* glsl */`
    varying vec2 vUv;
    uniform float uOpacity; uniform vec3 uColor;
    void main(){
      float tx = clamp(vUv.x, 0.0, 1.0);
      float tail = tx * tx * tx;                          // bright head at x=1
      float cy = max(1.0 - abs(vUv.y - 0.5) * 2.0, 0.0);
      float a = tail * cy * cy * uOpacity;
      gl_FragColor = vec4(uColor * 1.6, min(a, 1.0));
    }`
});
const SHOOT_N = 3;
const shooters = [];
for (let i = 0; i < SHOOT_N; i++){
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), shootMat.clone());
  mesh.scale.set(34, 1.1, 1);
  mesh.visible = false;
  mesh.frustumCulled = false;
  scene.add(mesh);
  shooters.push({ mesh, active: false, t: 0, dur: 1,
    from: new THREE.Vector3(), dir: new THREE.Vector3(), nextAt: 5 + i * 9 });
}
const _v3 = new THREE.Vector3();                           // scratch, no per-frame allocs
function updateShooters(T, dt){
  const on = state.stars.on && state.stars.shooting;
  for (const s of shooters){
    if (!s.active){
      if (on && T >= s.nextAt){
        s.active = true; s.t = 0; s.dur = 0.8 + Math.random() * 0.7;
        s.from.set((Math.random() * 2 - 1) * 420, 150 + Math.random() * 160,
                   -380 - Math.random() * 160);
        const ang = Math.PI * (1.15 + Math.random() * 0.5);  // down-left/right
        s.dir.set(Math.cos(ang), Math.sin(ang) * 0.55, 0).multiplyScalar(120 + Math.random() * 90);
        s.mesh.visible = true;
        s.mesh.rotation.z = Math.atan2(s.dir.y, s.dir.x);
      }
      continue;
    }
    s.t += dt;
    const p = s.t / s.dur;
    if (p >= 1 || !on){
      s.active = false; s.mesh.visible = false;
      s.nextAt = T + 7 + Math.random() * 22;
      continue;
    }
    _v3.copy(s.dir).multiplyScalar(p);
    s.mesh.position.copy(s.from).add(_v3);
    s.mesh.material.uniforms.uOpacity.value = Math.sin(p * Math.PI) * 0.9;
  }
}

/* ════════════════════════════════════════════════════════════════════
   10. CLOUDS — drifting bands from a generated noise texture
   ════════════════════════════════════════════════════════════════════ */

function makeCloudTexture(){
  const w = 256, h = 128;
  const cnv = document.createElement('canvas');
  cnv.width = w; cnv.height = h;
  const ctx = cnv.getContext('2d');
  const img = ctx.createImageData(w, h);
  const noise = makeNoise(4242);
  for (let y = 0; y < h; y++){
    const envY = Math.pow(Math.sin(Math.PI * y / h), 1.4);  // soft top/bottom
    for (let x = 0; x < w; x++){
      // fade all four edges so cloud planes never show as rectangles
      const env = envY * Math.pow(Math.sin(Math.PI * x / w), 0.55);
      // stretched fbm reads as wind-smeared bands
      const n = noise.fbm2(x / 46, y / 15, 4);
      const a = clamp((n - 0.46) * 2.6, 0, 1) * env;
      const o = (y * w + x) * 4;
      img.data[o] = img.data[o + 1] = img.data[o + 2] = 255;
      img.data[o + 3] = a * 255;
    }
  }
  ctx.putImageData(img, 0, 0);
  const tex = new THREE.CanvasTexture(cnv);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.wrapS = THREE.RepeatWrapping;
  return tex;
}
const cloudTex = makeCloudTexture();
const cloudGroup = new THREE.Group();
scene.add(cloudGroup);
const cloudPlanes = [];
{
  const rng = mulberry32(777);
  for (let i = 0; i < 8; i++){
    const wPl = 200 + rng() * 180, hPl = 26 + rng() * 24;
    const mat = new THREE.MeshBasicMaterial({ map: cloudTex, transparent: true,
      opacity: 0.35, color: 0xff5ec4, depthWrite: false, fog: false });
    const mesh = new THREE.Mesh(new THREE.PlaneGeometry(wPl, hPl), mat);
    // spread across the whole sky, at varying depths and heights
    mesh.position.set((rng() * 2 - 1) * 430, 24 + rng() * 58, -310 - rng() * 120);
    mesh.frustumCulled = false;
    cloudGroup.add(mesh);
    cloudPlanes.push({ mesh, speed: 0.6 + rng() * 0.8, half: 470 + wPl,
                       oMul: 0.55 + rng() * 0.65,
                       baseW: wPl, bz: mesh.position.z });
  }
}
function updateClouds(dt){
  if (!state.clouds.on) return;
  const v = state.clouds.speed * 2.2;
  for (const c of cloudPlanes){
    c.mesh.position.x += v * c.speed * dt;
    if (c.mesh.position.x >  c.half) c.mesh.position.x = -c.half;
    if (c.mesh.position.x < -c.half) c.mesh.position.x =  c.half;
  }
}

/* ════════════════════════════════════════════════════════════════════
   11. SCENE EXTRAS — palms, car, neon text, beams, weather
   ════════════════════════════════════════════════════════════════════ */

/* — palm silhouettes (procedural canvas drawing, tinted by material) — */
function makePalmTexture(){
  const cnv = document.createElement('canvas');
  cnv.width = 256; cnv.height = 512;
  const ctx = cnv.getContext('2d');
  ctx.fillStyle = ctx.strokeStyle = '#fff';
  ctx.lineCap = 'round';
  // trunk: tapered strokes along a lazy curve
  const trunk = t => ({ x: 128 + Math.sin(t * 1.8) * 26 * t, y: 500 - t * 320 });
  for (let i = 0; i < 24; i++){
    const t0 = i / 24, t1 = (i + 1) / 24;
    const a = trunk(t0), b = trunk(t1);
    ctx.lineWidth = 22 - t0 * 12;
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
  }
  // fronds: feathered spines fanning from the crown
  const top = trunk(1);
  for (let f = 0; f < 9; f++){
    const ang = -Math.PI * (0.08 + 0.84 * f / 8);
    const len = 105 + (f % 3) * 18;
    const droop = 0.9 + (f % 2) * 0.5;
    let px = top.x, py = top.y, dx = Math.cos(ang), dy = Math.sin(ang);
    for (let s = 0; s < 14; s++){
      const t = s / 13;
      const nx = top.x + dx * len * t;
      const ny = top.y + dy * len * t + droop * 55 * t * t;   // gravity droop
      ctx.lineWidth = 5;
      ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(nx, ny); ctx.stroke();
      // leaflets, shrinking toward the tip
      const ll = 26 * (1 - t) + 4;
      const pang = Math.atan2(ny - py, nx - px) + Math.PI / 2;
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(nx, ny);
      ctx.lineTo(nx + Math.cos(pang + 0.5) * ll, ny + Math.sin(pang + 0.5) * ll);
      ctx.moveTo(nx, ny);
      ctx.lineTo(nx - Math.cos(pang - 0.5) * ll, ny - Math.sin(pang - 0.5) * ll);
      ctx.stroke();
      px = nx; py = ny;
    }
  }
  const tex = new THREE.CanvasTexture(cnv);
  tex.colorSpace = THREE.SRGBColorSpace;
  // blurred copy: the halo the palms light up. Tight blur drawn twice
  // keeps the aura dense near the silhouette with a short falloff.
  const gcnv = document.createElement('canvas');
  gcnv.width = 256; gcnv.height = 512;
  const gctx = gcnv.getContext('2d');
  gctx.filter = 'blur(5px)';
  gctx.drawImage(cnv, 0, 0);
  gctx.drawImage(cnv, 0, 0);
  const glowTex = new THREE.CanvasTexture(gcnv);
  glowTex.colorSpace = THREE.SRGBColorSpace;
  return { tex, glowTex };
}
const { tex: palmTex, glowTex: palmGlowTex } = makePalmTexture();
gridMat.uniforms.uPalmTex.value = palmTex;   // the floor reflects palms too
const palmGroup = new THREE.Group();
scene.add(palmGroup);
/* Palm shader: silhouette tint + manual fog + wind sway bent in the
   vertex stage (bend grows toward the crown, phase from world position
   so every tree moves differently). Zero CPU work per frame.           */
const palmMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, fog: false,
  uniforms: {
    uMap:     { value: palmTex },
    uColor:   { value: col('#0b0318') },
    uGlowC:   { value: col('#ff2d95') },  // audio-reactive glow tint
    uGlowA:   { value: 0 },               // audio-reactive glow amount
    uSway:    { value: 0.3 },
    uTime:    { value: 0 },
    uFogColor:{ value: col('#2b0a56') },
    uFogNear: { value: 60 },
    uFogFar:  { value: 460 },
  },
  vertexShader: /* glsl */`
    varying vec2 vUv;
    varying float vDist;
    uniform float uSway, uTime;
    void main(){
      vUv = uv;
      vec3 p = position;
      float ph = modelMatrix[3][0] * 0.37 + modelMatrix[3][2] * 0.11;
      float bend = uv.y * uv.y * uSway;      // crown moves, trunk base stays
      p.x += (sin(uTime * 1.3 + ph) + 0.35 * sin(uTime * 2.7 + ph * 1.7))
           * bend * 2.4;
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      vDist = -mv.z;
      gl_Position = projectionMatrix * mv;
    }`,
  fragmentShader: /* glsl */`
    varying vec2 vUv;
    varying float vDist;
    uniform sampler2D uMap;
    uniform vec3 uColor, uFogColor, uGlowC;
    uniform float uFogNear, uFogFar, uGlowA;
    void main(){
      vec4 t = texture2D(uMap, vUv);
      if (t.a < 0.28) discard;
      float ff = smoothstep(uFogNear, uFogFar, vDist);
      vec3 c = mix(uColor, uFogColor, ff);
      // audio glow: silhouettes light up in the chosen neon tint
      c += uGlowC * uGlowA * (1.0 - ff * 0.7);
      gl_FragColor = vec4(c, t.a);
    }`
});
/* soft outer glow behind each palm, driven entirely by the audio band.
   Same sway vertex stage so the halo follows the tree; NormalBlending
   (additive mesh quads misrender on some GPUs — see note above).      */
const palmGlowMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, fog: false,
  uniforms: {
    uMap:   { value: palmGlowTex },
    uGlowC: { value: col('#ff2d95') },
    uGlowA: { value: 0 },
    uSway:  { value: 0.3 },
    uTime:  { value: 0 },
  },
  vertexShader: /* glsl */`
    varying vec2 vUv;
    uniform float uSway, uTime;
    void main(){
      vUv = uv;
      vec3 p = position;
      float ph = modelMatrix[3][0] * 0.37 + modelMatrix[3][2] * 0.11;
      float bend = uv.y * uv.y * uSway;
      p.x += (sin(uTime * 1.3 + ph) + 0.35 * sin(uTime * 2.7 + ph * 1.7))
           * bend * 2.4;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
    }`,
  fragmentShader: /* glsl */`
    varying vec2 vUv;
    uniform sampler2D uMap;
    uniform vec3 uGlowC;
    uniform float uGlowA;
    void main(){
      float t = texture2D(uMap, vUv).a;
      // threshold ramp: the faint wide skirt is cut away, leaving a
      // dense aura hugging the silhouette with a short falloff.
      // Color kept near 1.0 — HDR here would hand the halo to bloom,
      // which smears it right back into a huge soft blob.
      float a = smoothstep(0.16, 0.5, t) * uGlowA;

      gl_FragColor = vec4(uGlowC * 0.78, min(a * 1.35, 1.0));
    }`
});
const palmGlowGroup = new THREE.Group();
palmGlowGroup.visible = false;
scene.add(palmGlowGroup);
function rebuildPalms(){

  for (const c of [...palmGlowGroup.children]) palmGlowGroup.remove(c);

  for (let i = 0; i < n; i++){
    const side = i % 2 === 0 ? -1 : 1;
    // nearest pair frames the view like a poster; the rest recede

    const x = side * (20 + rng() * 28 + (-z) * 0.1);
    const h = (i < 2 ? 38 : 30) + rng() * 18;             // nearest pair is tallest
    const geo = new THREE.PlaneGeometry(h * 0.62, h);
    const mesh = new THREE.Mesh(geo, palmMat);
    mesh.position.set(x, h / 2 - 1, z);
    mesh.rotation.z = side * (0.03 + rng() * 0.07);       // lean into the frame
    if (rng() > 0.5) mesh.scale.x *= -1;                  // mirror variety
    palmGroup.add(mesh);
    // matching halo quad, slightly larger, just behind the silhouette
    const glow = new THREE.Mesh(geo, palmGlowMat);
    glow.position.set(x, h / 2 - 1, z - 0.8);
    glow.rotation.z = mesh.rotation.z;
    glow.scale.copy(mesh.scale).multiplyScalar(1.04);
    palmGlowGroup.add(glow);
    // feed the floor shader: x, z, height, ±halfWidth (sign = mirrored)
    if (i < 8) pu[i].set(x, z, h, (h * 0.31) * (mesh.scale.x < 0 ? -1 : 1));
  }
  gridMat.uniforms.uPalmN.value = Math.min(n, 8);
}

/* ── CAR ──────────────────────────────────────────────────────────────
   A real low-poly mesh, not a billboard. The camera sways, dollies and
   can orbit, and a sprite would shear off the tarmac the moment it did —
   this has to hold up as an object standing on the road, so it is
   modelled, lit and reflected as one.

   Cost is kept down by shape, not by cutting the model back:

   · The whole car — body, glass, wheels, lamps, wing — is ONE non-indexed
     BufferGeometry carrying a per-vertex material id, so it draws in a
     single call. The fragment shader picks a look off that id; the branch
     is coherent per triangle and there is no second draw call to pay for.
   · The wheels and the pop-up headlights turn in the VERTEX stage, about
     a pivot carried on an attribute. Nothing about the car needs a matrix
     update, a group hierarchy or any CPU work per frame beyond writing
     six uniforms.
   · The rear wing is emitted last, so switching it off is a draw-range
     change rather than a rebuild.
   · Nothing is built until the car is first switched on: with car.on
     false there is no geometry, no shader program, no draw call and no
     per-frame work at all.

   Model space is METRES, car-local: +Z nose, +X right, y = 0 at the
   ground. carRoot scales that into world units.                        */

/* World units per metre. Read off the road: the default carriageway is
   2*7.5 = 15 units wide and carries two lanes, so a unit is ~0.48 m.
   At this scale the camera's 3.2-unit default height is ~1.5 m, which is
   about where your eyes are in a car — the scene agrees with itself.   */
const M2W = 2.1;

/* per-vertex material ids */
const CAR_BODY = 0, CAR_GLASS = 1, CAR_TYRE = 2, CAR_RIM = 3,
      CAR_TAIL = 4, CAR_HEAD = 5, CAR_TRIM = 6, CAR_EXH = 7,
      CAR_AMBER = 8, CAR_PLATE = 9, CAR_FASCIA = 10;
/* aRot.w — which uniform angle a vertex turns with */
const SPIN_NONE = 0, SPIN_WF = 1, SPIN_WR = 2, SPIN_POP = 3;
const NO_SPIN = [0, 0, 0, SPIN_NONE];

/** Polygon soup → flat-shaded triangles + a deduplicated edge list.
    Winding is load-bearing: normals come from the vertex order, so a
    reversed face is both unlit and culled. Every emitter below was
    derived against this convention (CCW seen from outside).           */
function carBuilder(){
  const P = [], N = [], MT = [], RT = [];              // solid
  /* Wire edges are collected with the face that emitted them and pruned
     at the end: an edge shared by two faces that meet at less than
     CREASE_COS and carry the same material is INSIDE a smooth surface —
     drawing it turns the wireframe into a mesh of triangulation noise
     rather than the car's own lines. Boundaries, creases and material
     changes survive; the tessellation of the wheels and the loft does
     not. Same idea as EdgesGeometry, done here because the polygon
     topology is already known and its diagonals never existed.        */
  const CREASE_COS = Math.cos(25 * Math.PI / 180);
  const edgeIx = new Map(), edges = [];
  const key = p => `${Math.round(p[0] * 1e3)},${Math.round(p[1] * 1e3)},`
                 + `${Math.round(p[2] * 1e3)}`;
  let faceN = [0, 0, 0];                    // normal of the face being emitted
  function tri(a, b, c, m, r){
    const ux = b[0]-a[0], uy = b[1]-a[1], uz = b[2]-a[2];
    const vx = c[0]-a[0], vy = c[1]-a[1], vz = c[2]-a[2];
    let nx = uy*vz - uz*vy, ny = uz*vx - ux*vz, nz = ux*vy - uy*vx;
    const l = Math.sqrt(nx*nx + ny*ny + nz*nz);
    if (l < 1e-9) return;                     // collapsed ring segment
    nx /= l; ny /= l; nz /= l;
    for (const p of [a, b, c]){
      P.push(p[0], p[1], p[2]); N.push(nx, ny, nz);
      MT.push(m); RT.push(r[0], r[1], r[2], r[3]);
    }
  }
  function edge(a, b, m, r){
    const ka = key(a), kb = key(b);
    if (ka === kb) return;
    const k = ka < kb ? ka + '|' + kb : kb + '|' + ka;
    const prev = edgeIx.get(k);
    if (prev !== undefined){
      const e = edges[prev];
      const d = e.n[0] * faceN[0] + e.n[1] * faceN[1] + e.n[2] * faceN[2];
      if (d > CREASE_COS && e.m === m) e.keep = false;
      return;
    }
    edgeIx.set(k, edges.length);
    edges.push({ a, b, m, r, n: faceN, keep: true });
  }
  const B = {
    /** convex polygon, fanned; its boundary becomes wireframe lines */
    poly(pts, m, r){
      r = r || NO_SPIN;
      for (let i = 1; i < pts.length - 1; i++) tri(pts[0], pts[i], pts[i+1], m, r);
      /* Newell's normal for the whole polygon, not the last fan triangle:
         the loft's skin quads are not planar, and a degenerate triangle
         (collapsed ring segment) contributes nothing at all */
      let nx = 0, ny = 0, nz = 0;
      for (let i = 0; i < pts.length; i++){
        const p = pts[i], q = pts[(i + 1) % pts.length];
        nx += (p[1] - q[1]) * (p[2] + q[2]);
        ny += (p[2] - q[2]) * (p[0] + q[0]);
        nz += (p[0] - q[0]) * (p[1] + q[1]);
      }
      const l = Math.sqrt(nx*nx + ny*ny + nz*nz) || 1;
      faceN = [nx / l, ny / l, nz / l];
      for (let i = 0; i < pts.length; i++)
        edge(pts[i], pts[(i + 1) % pts.length], m, r);
    },
    /** same polygon mirrored across x=0 — order reversed to keep winding */
    polyM(pts, m, r){
      B.poly(pts, m, r);
      B.poly(pts.map(p => [-p[0], p[1], p[2]]).reverse(), m, r);
    },
    /* Hexahedron with eight independent corners. Almost nothing on a
       Countach is an axis-aligned box — the chin spoiler splays outward,
       the intake ears taper, the wing struts rake back — and shearing a
       hex costs exactly what a box costs. Corner order is the box's:
       0..3 = the -z face read anticlockwise from +z (bottom-left,
       bottom-right, top-right, top-left), 4..7 = the same on +z.
       Per-face material overrides via `faces` (px/nx/py/ny/pz/nz).    */
    hex(p, m, r, faces){
      const f = faces || {};
      B.poly([p[5], p[1], p[2], p[6]], f.px ?? m, r);
      B.poly([p[0], p[4], p[7], p[3]], f.nx ?? m, r);
      B.poly([p[7], p[6], p[2], p[3]], f.py ?? m, r);
      B.poly([p[0], p[1], p[5], p[4]], f.ny ?? m, r);
      B.poly([p[4], p[5], p[6], p[7]], f.pz ?? m, r);
      B.poly([p[1], p[0], p[3], p[2]], f.nz ?? m, r);
    },
    hexM(p, m, r, faces){
      B.hex(p, m, r, faces);
      // mirror, then swap the two z-faces' corner pairs back into order
      const q = p.map(v => [-v[0], v[1], v[2]]);
      B.hex([q[1], q[0], q[3], q[2], q[5], q[4], q[7], q[6]], m, r,
        faces ? { ...faces, px: faces.nx, nx: faces.px } : faces);
    },
    /** axis-aligned box — a hex with its corners on the two z-planes */
    box(x0, x1, y0, y1, z0, z1, m, r, faces){
      B.hex([[x0,y0,z0], [x1,y0,z0], [x1,y1,z0], [x0,y1,z0],
             [x0,y0,z1], [x1,y0,z1], [x1,y1,z1], [x0,y1,z1]], m, r, faces);
    },
    boxM(x0, x1, y0, y1, z0, z1, m, r, faces){
      B.box(x0, x1, y0, y1, z0, z1, m, r, faces);
      B.box(-x1, -x0, y0, y1, z0, z1, m, r, faces
        ? { ...faces, px: faces.nx, nx: faces.px } : faces);
    },
    /** counts so far — the wing split points */
    count(){ return MT.length; },
    wireCount(){ return edges.length; },
    /** @param wingAt edge index the wing starts at (from wireCount) */
    finish(wingAt){
      const g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.Float32BufferAttribute(P, 3));
      g.setAttribute('normal',   new THREE.Float32BufferAttribute(N, 3));
      g.setAttribute('aMat',     new THREE.Float32BufferAttribute(MT, 1));
      g.setAttribute('aRot',     new THREE.Float32BufferAttribute(RT, 4));
      g.computeBoundingSphere();
      const EP = [], EM = [], ER = [];
      let wireSplit = Infinity;
      edges.forEach((e, i) => {
        if (i === wingAt) wireSplit = EM.length;
        if (!e.keep) return;
        EP.push(e.a[0], e.a[1], e.a[2], e.b[0], e.b[1], e.b[2]);
        EM.push(e.m, e.m);
        ER.push(...e.r, ...e.r);
      });
      const w = new THREE.BufferGeometry();
      w.setAttribute('position', new THREE.Float32BufferAttribute(EP, 3));
      w.setAttribute('aMat',     new THREE.Float32BufferAttribute(EM, 1));
      w.setAttribute('aRot',     new THREE.Float32BufferAttribute(ER, 4));
      w.computeBoundingSphere();
      return { solid: g, wire: w, wireSplit };
    },
  };
  return B;
}

/* ── Lamborghini Countach 5000 QV ──────────────────────────────────────
   Real proportions: 4.14 m long, 2.00 over the flares, 1.07 tall, 2.45
   wheelbase, with the QV's enormous rear tyres.

   The shell is lofted from longitudinal stations, each a closed 10-gon.
   Stations sit ON the creases — cowl, screen head, rear-glass base — so
   flat shading folds the wedge for free instead of needing extra
   geometry to fake a crease.

   The wheel arches come out of the same loft rather than costing their
   own geometry, and the trick is worth spelling out. Over an axle the
   ring's flare edge (w, ysl) climbs to clear the tyre while the sill
   (ws) tucks sharply inboard, so the panel between them runs diagonally
   from deep inside the wheel well up to the top of the arch. Everywhere
   that panel sits lower than the tyre it is also inboard of the tyre's
   outer face, so the wheel hides it; the only part that reaches the
   car's outer surface is above the tread. What is left is a real arch
   opening with the wheel sitting in it — for the price of four extra
   stations per axle and no new primitive at all.

   Everything a lofted ring genuinely cannot express — the chin spoiler,
   the recessed front grilles, the pop-up pods, the intake ears behind
   the doors, the engine louvres, the lamp clusters, the quad pipes, the
   wing — is a hex bolted on afterwards, each one standing PROUD of what
   it sits on. Nothing is a decal: a face a fraction above another
   z-fights into stripes once the car is a couple of hundred units out,
   and a part with real depth in front of another cannot.

     z      yb    ws    ysl   wLo   yf    wHi   wt    yt    ytc         */
const COUNTACH_ST = [
  [-1.99, 0.42, 0.72, 0.46, 0.83, 0.70, 0.74, 0.70, 0.78, 0.74],  //  0 tail face
  [-1.88, 0.24, 0.78, 0.36, 0.90, 0.76, 0.87, 0.78, 0.86, 0.83],  //  1 under-tail tuck
  [-1.70, 0.18, 0.84, 0.34, 0.94, 0.80, 0.97, 0.86, 0.92, 0.90],  //  2 arch, back
  [-1.52, 0.17, 0.70, 0.60, 0.96, 0.82, 1.00, 0.90, 0.95, 0.94],  //  3
  [-1.30, 0.16, 0.62, 0.70, 0.96, 0.84, 1.00, 0.92, 0.97, 0.96],  //  4 rear axle
  [-1.08, 0.16, 0.70, 0.60, 0.96, 0.84, 1.00, 0.92, 0.99, 0.98],  //  5
  [-0.90, 0.16, 0.82, 0.34, 0.95, 0.85, 0.99, 0.91, 1.02, 1.02],  //  6 arch, front
  [-0.72, 0.16, 0.88, 0.30, 0.95, 0.85, 0.98, 0.80, 1.05, 1.05],  //  7 deck / screen base
  [-0.40, 0.16, 0.88, 0.30, 0.94, 0.85, 0.96, 0.56, 1.07, 1.07],  //  8 roof rear
  [ 0.06, 0.16, 0.88, 0.30, 0.94, 0.84, 0.96, 0.58, 1.07, 1.07],  //  9 screen head
  [ 0.62, 0.16, 0.88, 0.300, 0.940, 0.800, 0.960, 0.820, 0.840, 0.810], // 10 cowl
  [ 0.85, 0.16, 0.860,0.400, 0.900, 0.660, 0.895, 0.865, 0.812, 0.798], // 11 arch, back
  [ 0.97, 0.16, 0.700,0.640, 0.915, 0.720, 0.908, 0.868, 0.800, 0.786], // 12
  [ 1.15, 0.16, 0.620,0.690, 0.925, 0.770, 0.916, 0.866, 0.790, 0.776], // 13 front axle
  [ 1.33, 0.16, 0.700,0.640, 0.915, 0.720, 0.906, 0.850, 0.740, 0.728], // 14
  [ 1.51, 0.17, 0.820,0.400, 0.890, 0.610, 0.880, 0.822, 0.672, 0.664], // 15 arch, front
  [ 1.86, 0.115,0.820,0.285, 0.880, 0.470, 0.868, 0.740, 0.520, 0.516], // 16 nose shoulder
  [ 2.04, 0.100,0.800,0.245, 0.860, 0.380, 0.840, 0.632, 0.430, 0.428], // 17 nose face
];
/** one station → 10 ring points, counter-clockwise in xy. Shared by
    every lofted model; the roles below are explained through the
    Countach's table but the vocabulary is the same for all of them.
    The flank carries TWO widths — wLo at the arch lip and wHi at the
    shoulder — and the sign of the difference between them is what stops
    the car being a box. Over the REAR wheels wHi > wLo, which is those
    flares' tumblehome; at the tail wHi < wLo, so the Kamm panel is a
    trapezoid that leans in as it rises instead of a vertical slab. A
    single width per station could express neither.
    Over the FRONT wheels the sign flips: wLo is the widest thing on the
    car's nose, so the widest point sits DOWN at the arch lip, level with
    the top of the tyre, and the flank above it runs almost straight up
    to a hard crease at wt before the bonnet. Putting the maximum up at
    the shoulder instead — which is what this table used to do — turns
    each front wing into a smooth blister, and head on the whole nose
    reads as a rounded loaf rather than a wedge with creases in it.
    The nose tapers in plan almost entirely along the TOP edge and
    hardly at all along the bottom: wt falls 866 -> 632 from the front
    axle to the nose while wLo barely moves, 925 -> 860. That is why the
    car is a wedge in two axes at once, and why the front bumper is
    nearly as wide as the widest part of the car while the bonnet
    between the wings is barely more than a metre across.
    yt above ytc drops the top edge into a valley down the middle. At the
    tail that is the whole point: the Countach's rear fenders stand proud
    of the engine deck, and that hump-valley-hump edge is why the rear
    panel cannot be one rectangle. Along the bonnet it is nearly nothing
    — under 20 mm — because a Countach's bonnet is a FLAT plane.        */
function carRing(st){
  const [z, yb, ws, ysl, wLo, yf, wHi, wt, yt, ytc] = st;
  const half = [[0, yb], [ws, yb + 0.02], [wLo, ysl], [wHi, yf], [wt, yt]];
  const out = half.map(([x, y]) => [x, y, z]);
  out.push([0, ytc, z]);
  for (let i = half.length - 1; i >= 1; i--)
    out.push([-half[i][0], half[i][1], z]);
  return out;
}
/* Skin material for span i (station i → i+1), ring edge k.
   k: 0 underbody R · 1 wheel well R · 2 flare face R · 3 upper flank R
      4 roof R · 5 roof L · 6 upper flank L · 7 flare face L
      8 wheel well L · 9 underbody L                                   */
function countachSkin(i, k){
  if (k === 0 || k === 9) return CAR_TRIM;                          // underbody
  if (i >= 3 && i <= 5) return (k === 4 || k === 5) ? CAR_TRIM      // engine bay
                             : CAR_BODY;                            //   under the slats
  if (i === 6) return (k === 3 || k === 6) ? CAR_TRIM : CAR_BODY;   // side intakes
  if (i === 7) return (k === 4 || k === 5) ? CAR_GLASS : CAR_BODY;  // rear screen
  if (i === 8) return (k === 3 || k === 6) ? CAR_GLASS : CAR_BODY;  // side glass
  if (i === 9) return (k >= 3 && k <= 6) ? CAR_GLASS : CAR_BODY;    // windscreen
  return CAR_BODY;
}
/** One wheel and its mirror: tyre, sidewall, slotted alloy. Shared by
    every model — seg and slotEvery pick the alloy pattern: 15/3 is the
    Countach's five-slot Bravo, finer pitches read as finned discs. */
function carWheels(B, cx, cz, r, hw, rim, spin, seg = 15, slotEvery = 3){
  const SEG = seg;
  /* aRot.z is the pop-ups' swing angle and unused by a wheel, so the
     wheel's centreline lives there — the steer needs a pivot and there
     is no spare attribute. Stored unsigned: polyM hands the mirrored
     wheel the SAME aRot, so the side is taken from the vertex's own x. */
  const rot = [r, cz, cx, spin];
  const x0 = cx - hw, x1 = cx + hw;     // inner, outer
  const at = (x, k, rr) => {
    const a = k / SEG * Math.PI * 2;
    return [x, r + Math.sin(a) * rr, cz + Math.cos(a) * rr];
  };
  for (let k = 0; k < SEG; k++){
    const k1 = (k + 1) % SEG;
    // tread
    B.polyM([at(x0, k, r), at(x1, k, r), at(x1, k1, r), at(x0, k1, r)],
            CAR_TYRE, rot);
    // outer sidewall, down to the alloy
    B.polyM([at(x1, k, r), at(x1, k, rim), at(x1, k1, rim), at(x1, k1, r)],
            CAR_TYRE, rot);
    // alloy face — every slotEvery-th wedge is a slot
    B.polyM([[x1, r, cz], at(x1, k1, rim), at(x1, k, rim)],
            k % slotEvery === 0 ? CAR_TRIM : CAR_RIM, rot);
    // inner face (only ever seen through the arch)
    B.polyM([[x0, r, cz], at(x0, k, r), at(x0, k1, r)], CAR_TYRE, rot);
  }
}
/** build the Countach; returns { solid, wire, split, wireSplit } */
function buildCountach(){
  const B = carBuilder();

  /* ── shell ── */
  const rings = COUNTACH_ST.map(carRing);
  const n = rings[0].length;
  for (let i = 0; i < rings.length - 1; i++){
    const a = rings[i], b = rings[i + 1];
    for (let k = 0; k < n; k++){
      const k1 = (k + 1) % n;
      B.poly([a[k], a[k1], b[k1], b[k]], countachSkin(i, k));
    }
  }
  // caps: fanned from a point inside the ring, which stays valid through
  // the shallow notch the bonnet channel puts in the top edge
  const capC = st => [0, (st[1] + st[9]) * 0.5, st[0]];
  const first = rings[0], last = rings[rings.length - 1];
  const c0 = capC(COUNTACH_ST[0]), c1 = capC(COUNTACH_ST[COUNTACH_ST.length - 1]);
  for (let k = 0; k < n; k++){
    const k1 = (k + 1) % n;
    B.poly([c0, first[k1], first[k]], CAR_BODY);
    B.poly([c1, last[k], last[k1]], CAR_BODY);
  }

  /* ── wheels — 225/50 front, 345/35 rear, as the QV wore them.
        Each sits ~3 cm inside its flare, so the flare lip reads and the
        arch opening the loft carves has something in it.             */
  /* Radii are the real rolling radii, not guesses: 225/50 VR15 is
     381 + 2*112.5 = 606 mm across, 345/35 VR15 is 381 + 2*120.75 =
     622 mm. Track 1535 front / 1605 rear puts the centreplanes at
     0.77 and 0.80, and the flares clear the outer sidewalls by the
     ~30 mm that makes them look shrink-wrapped onto the tyres.      */
  carWheels(B,  0.77,  1.15, 0.303, 0.1125, 0.200, SPIN_WF);
  carWheels(B,  0.80, -1.30, 0.311, 0.1725, 0.205, SPIN_WR);

  /* ── front ──
     A Countach's face is three stacked bands, each stepping forward as
     it drops: the flat upper nose, a bumper bar standing proud of it
     with the lamps and grilles recessed INTO that bar, and a slim
     spoiler blade under everything. What used to sit here was one
     full-width slab hung off the front of the car, 300 mm deep and
     wider than the bodywork, which read as a snowplough.
     Bumper bar in strips: the two bays simply stop 35 mm short of the
     body strips either side, so the recess is a gap between real
     surfaces and its neighbours become its side walls. The ORDER is the
     one thing a photograph settles instantly, and it is the opposite of
     what was here — going outboard from the centre it runs body,
     rectangular driving lamp, divider, slatted grille, corner.       */
  const BY0 = 0.245, BY1 = 0.395, BZ0 = 2.020, BZ1 = 2.085;
  const RY0 = 0.270, RY1 = 0.360, BZR = 2.052;   // the recessed bays
  B.box(-0.205, 0.205, BY0, BY1, BZ0, BZ1, CAR_BODY, NO_SPIN);
  /* The driving lamp is a PLATE, not a head lamp: CAR_HEAD is tied to the
     pop-up angle now, so borrowing it here would blank these to body
     colour whenever the lights are down and blow them out to pure white
     whenever they are up. A pale unlit lens is what they read as. */
  B.boxM(0.210, 0.348, RY0, RY1, BZ0, BZR, CAR_BODY, NO_SPIN, { pz: CAR_PLATE });
  B.boxM(0.348, 0.368, BY0, BY1, BZ0, BZ1, CAR_BODY, NO_SPIN);
  B.boxM(0.368, 0.628, RY0, RY1, BZ0, BZR, CAR_BODY, NO_SPIN, { pz: CAR_TRIM });
  B.boxM(0.628, 0.800, BY0, BY1, BZ0, BZ1, CAR_BODY, NO_SPIN);
  /* The spoiler's real depth is in the SHELL: stations 16 and 17 drop
     their sill to 100 mm and carry it out to 790, so the whole nose ends
     in a low valance the way the car's does. All that is left to bolt on
     is the lip — 60 mm of forward projection, its top edge buried inside
     that valance so there is no seam, and narrow enough that it never
     shows as a ledge from head on. A blade sized to read from the front
     is the thing that made this a snowplough.                        */
  /* 90 mm is the lowest anything on this car goes, front or rear, and it
     is deliberate: suspension travel, roll on a cambered road and the
     audio bump all move the body DOWN, and between them they use most of
     what is left before a corner would dip through the tarmac.       */
  B.hex([[-0.800,0.090,1.94], [0.800,0.090,1.94], [0.800,0.245,1.94], [-0.800,0.245,1.94],
         [-0.780,0.090,2.055], [0.780,0.090,2.055], [0.780,0.215,2.055], [-0.780,0.215,2.055]],
        CAR_BODY, NO_SPIN);
  // brake-cooling slots in the blade. Without them the whole 160 mm
  // between the bumper and the ground is one blank band, which is a lot
  // of flat colour right where the eye lands.
  B.boxM(0.450, 0.680, 0.120, 0.180, 2.045, 2.061, CAR_BODY, NO_SPIN,
         { pz: CAR_TRIM });
  /* The lenses that actually read as this car's eyes. With the lamps
     down — which is whenever it is driving away, so most of the time —
     a Countach's face is these two trapezoids in the wing tops, not the
     headlights, which are flush body colour and invisible. Sunk into
     the surface rather than sat on it: the slab's underside is buried
     in the bonnet, so only its lid shows.                            */
  B.hexM([[0.480,0.548,1.76], [0.735,0.548,1.76], [0.735,0.574,1.76], [0.480,0.574,1.76],
          [0.480,0.476,1.92], [0.690,0.476,1.92], [0.690,0.502,1.92], [0.480,0.502,1.92]],
         CAR_TRIM, NO_SPIN, { py: CAR_AMBER });
  /* Pop-up headlights, hinged the way the real mechanism is: the pivot
     is the pod's FRONT edge, its tail swings up, and the lamp is on the
     pod's TOP face — flush and dark lying down, aimed down the road
     once it is up. Hinging at the back would point the beam at the sky.
     The swing is 86 degrees rather than 60: at 60 the lens still faces
     half at the sky, and from a camera above the car that turns it into
     a billboard rather than a lamp. The lid is 180 mm long and its
     inboard edge is half a metre off the centreline, which leaves a
     full metre of unbroken flat bonnet between the two pods — the old
     pods were 560 mm wide and 600 mm apart, so they covered the bonnet
     instead of sitting in it.
     aRot = pivot y, pivot z, swing in radians.                       */
  const LZ0 = 1.44, LZ1 = 1.62, LY0 = 0.706, LY1 = 0.630;
  const pop = [0.590, LZ1, 1.50, SPIN_POP];
  B.hexM([[0.480,0.666,LZ0], [0.800,0.666,LZ0], [0.800,LY0,LZ0], [0.480,LY0,LZ0],
          [0.480,0.590,LZ1], [0.800,0.590,LZ1], [0.800,LY1,LZ1], [0.480,LY1,LZ1]],
         CAR_BODY, pop, { ny: CAR_TRIM, nz: CAR_TRIM });
  /* TWO round 5 3/4 inch lamps per pod, not one rectangle. The factory
     parts book lists four separate low/high beam assemblies, and a pair
     of circles a side is what reads as a Countach with its lights up;
     one lens filling the lid reads as a glowing flap, which is what the
     old 440 x 260 rectangle did to the whole front of the car.
     Eight-sided reads as round at every size the car is ever drawn, for
     six triangles a lamp; at six the flats show once the size slider is
     up. Each one is sheared to follow the lid's 23 degree slope — a lamp
     with a level top would be half buried and half floating.        */
  const lidY = z => LY0 + (LY1 - LY0) * (z - LZ0) / (LZ1 - LZ0);
  function popLamp(cx){
    const R = 0.068, SEG = 8, zc = 0.5 * (LZ0 + LZ1);
    // negative sweep: seen from +y that is the winding that faces out
    const at = (k, dy) => {
      const a = -(k / SEG) * Math.PI * 2;
      const z = zc + Math.sin(a) * R;
      return [cx + Math.cos(a) * R, lidY(z) + dy, z];
    };
    const lens = [];
    for (let k = 0; k < SEG; k++) lens.push(at(k, 0.016));
    B.polyM(lens, CAR_HEAD, pop);
    for (let k = 0; k < SEG; k++){          // the bucket, buried in the lid
      const k1 = (k + 1) % SEG;
      B.polyM([at(k, -0.028), at(k1, -0.028), at(k1, 0.016), at(k, 0.016)],
              CAR_TRIM, pop);
    }
  }
  popLamp(0.565); popLamp(0.720);

  /* ── flanks ── */
  // door mirrors on their stalks — small, but the Countach's stand well
  // clear of the body and the silhouette is wrong without them
  B.hexM([[0.92,0.78,0.52], [1.02,0.78,0.52], [1.02,0.83,0.52], [0.92,0.83,0.52],
          [0.92,0.78,0.60], [1.02,0.78,0.60], [1.02,0.83,0.60], [0.92,0.83,0.60]],
         CAR_TRIM, NO_SPIN);
  B.hexM([[1.00,0.76,0.46], [1.11,0.76,0.46], [1.11,0.90,0.46], [1.00,0.90,0.46],
          [1.00,0.78,0.64], [1.11,0.78,0.64], [1.11,0.90,0.64], [1.00,0.90,0.64]],
         CAR_BODY, NO_SPIN);

  /* ── engine deck ──
     The louvred cover: body-coloured fins standing over the dark bay the
     shell already recesses there, so the slats are lit and the gaps
     between them are not.                                            */
  const deckY = z => 0.95 + (z + 1.30) * 0.172;
  for (let j = 0; j < 6; j++){
    const zc = -1.42 + j * 0.125, y = deckY(zc);
    B.box(-0.54, 0.54, y - 0.03, y + 0.04, zc - 0.052, zc + 0.052,
          CAR_BODY, NO_SPIN);
  }
  /* The intake ears behind the door glass — as much a part of the QV's
     shape as the wing. Tall and open at the front, tapering away over
     the rear deck.                                                   */
  B.hexM([[0.56,0.96,-1.06], [0.84,0.96,-1.06], [0.84,1.01,-1.06], [0.56,1.01,-1.06],
          [0.56,1.00,-0.70], [0.84,1.00,-0.70], [0.84,1.15,-0.70], [0.56,1.15,-0.70]],
         CAR_BODY, NO_SPIN, { pz: CAR_TRIM });

  /* ── rear ──
     NOT one rectangle, which is what kept making this read as a slab.
     The engine deck falls into a valley between the two rear fender
     humps, and the lamp panel follows that line: under each hump a TALL
     end section, raked inward as it rises so its outer end comes to a
     point, and between them the panel drops to a thin horizontal band
     for the badges and the plate. The ends stand proud, the middle sits
     30 mm further forward. Thick pointed ends, thin middle.          */
  B.hexM([[0.30,0.470,-2.04], [0.75,0.470,-2.04], [0.65,0.755,-2.04], [0.30,0.755,-2.04],
          [0.30,0.470,-1.99], [0.75,0.470,-1.99], [0.65,0.755,-1.99], [0.30,0.755,-1.99]],
         CAR_TRIM, NO_SPIN);
  B.box(-0.30, 0.30, 0.50, 0.66, -2.01, -1.99, CAR_TRIM, NO_SPIN);
  /* Three SQUARE ~75 mm lenses a side, not one long bar: the Countach
     wears Alfa Alfetta berlina clusters (Lamborghini 006310489/490), and
     outboard→inboard they run amber indicator, red stop/tail, white
     reverse. The indicator has to be the outboard one — ECE puts its
     outer edge within 400 mm of the car's widest point, which on a
     2000 mm body pins the cluster hard into the corner of the panel and
     leaves a ~720 mm gap in the middle for the plate and the scripts. */
  B.boxM(0.335, 0.425, 0.575, 0.690, -2.08, -2.04, CAR_TRIM, NO_SPIN, { nz: CAR_PLATE });
  B.boxM(0.431, 0.549, 0.575, 0.690, -2.08, -2.04, CAR_TRIM, NO_SPIN, { nz: CAR_TAIL });
  B.boxM(0.555, 0.645, 0.575, 0.690, -2.08, -2.04, CAR_TRIM, NO_SPIN, { nz: CAR_AMBER });
  /* Deliberately ~35% larger than the real 250 x 90 cluster, and the red
     stop lens wider than its neighbours. At true scale each lens is 13 px
     on a wallpaper and the tail reads as a black slab with confetti on
     it; the layout, the order and the wide centre gap are what make it a
     Countach, so those stay exact and only the size is pushed.        */
  // Euro plate, centred on the thin middle band
  B.box(-0.21, 0.21, 0.545, 0.635, -2.04, -2.01, CAR_TRIM, NO_SPIN, { nz: CAR_PLATE });
  /* The pipes hang UNDER the tail rather than sitting on it. The Kamm
     face stops at y 0.42 and the body tucks hard forward below that, so
     the quad outlets poke out of shadow beneath the lower edge — which
     is also what stops the rear reading as one tall flat slab.        */
  B.boxM(0.012, 0.097, 0.31, 0.39, -2.03, -1.95, CAR_TRIM, NO_SPIN, { nz: CAR_EXH });
  B.boxM(0.112, 0.197, 0.31, 0.39, -2.03, -1.95, CAR_TRIM, NO_SPIN, { nz: CAR_EXH });

  const split = B.count(), wingAt = B.wireCount();
  // rear wing — last, so switching it off is a draw-range change
  /* Span matters more than anything else about the wing. The QV's blade
     is ~1.6 m on a 2.0 m car — clearly INSIDE the rear flares — and a
     blade as wide as the haunches squares the whole rear silhouette off
     into a rectangle, which is exactly what it must not be.           */
  B.hex([[-0.85,1.11,-2.08], [0.85,1.11,-2.08], [0.85,1.17,-2.08], [-0.85,1.17,-2.08],
         [-0.85,1.07,-1.50], [0.85,1.07,-1.50], [0.85,1.13,-1.50], [-0.85,1.13,-1.50]],
        CAR_BODY, NO_SPIN);
  // wide plates, not posts — the QV's uprights are as much of the wing's
  // signature as the blade, and a thin stalk reads as a table leg
  B.hexM([[0.38,0.82,-1.74], [0.56,0.82,-1.74], [0.56,1.12,-1.86], [0.38,1.12,-1.86],
          [0.38,0.82,-1.60], [0.56,0.82,-1.60], [0.56,1.12,-1.72], [0.38,1.12,-1.72]],
         CAR_BODY, NO_SPIN);
  return { ...B.finish(wingAt), split };
}

/* ── DMC DeLorean (DMC-12) ────────────────────────────────────────────
   Every number below was read off an orthographic four-view and a
   dead-on photograph rather than guessed: 4216 mm over the bumpers,
   1857 over the body — the 1988 the encyclopedias quote includes the
   door mirrors — 1140 tall, 2413 wheelbase, 864 / 939 overhangs, 1590
   track at both ends, and the factory-staggered wheels: 195/60R14
   front (590 dia), 235/60R15 rear (663), a 12% difference that is most
   of the car's stance.

   The Countach is a wedge; this emphatically is not, and every attempt
   to draw it as one comes out looking like a generic eighties sports
   car. What actually makes it a DeLorean, measured:

   · The bonnet is nearly LEVEL. 673 mm at its leading edge, 804 at the
     cowl — 131 mm over 1391, five and a half degrees. Draw it at the
     nine a wedge wants and the nose drops 60 mm too far and the whole
     car turns into a doorstop.
   · In plan it is almost a constant-width slab: 816 mm half-width at
     the nose, 927 at the widest, 836 at the tail. A 13% total taper.
   · The roof is LONG and flat — 47% to 70% of the length — and the
     tail panel is TALL, its top edge still at 855 mm, three quarters
     of the car's height. The deck falls only 11° across the louvres.
   · One flank groove at 585 mm and one beltline at 780 split the side
     into three near-vertical bands. The arch crowns (661 front, 741
     rear — each clearing its own tyre by 75) cut THROUGH the groove.
   · A slatted grille sits between the lamp pairs, and the bonnet's
