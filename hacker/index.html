   Layout + dashboard
   ------------------------------------------------------------------ */

/* Every kind of panel the layout can hold. `min` is the smallest size, in
   CSS px, the panel is laid out at by the editor — below it the content
   stops reading as anything. Keys are part of saved layouts. */
const PANEL_TYPES = {
  trace:     { name: "SYS://TRACE", desc: "scrolling event log", min: [150, 70],
               make: function () { return new TerminalPanel("SYS://TRACE", T.Green, RD.systemLogLine, 5, 11); } },
  hex:       { name: "MEMORY INSPECTOR", desc: "hex dump", min: [150, 60],
               make: function () { return new HexPanel(); } },
  code:      { name: "SOURCE SYNTH", desc: "code being typed live", min: [200, 90],
               make: function () { return new CodePanel(); } },
  target:    { name: "TARGET ACQUISITION", desc: "companies being “breached”", min: [170, 150],
               make: function () { return new CompanyPanel(); } },
  tty:       { name: "TTY", desc: "terminal running commands", min: [200, 90],
               make: function () { return new ShellPanel(); } },
  telemetry: { name: "TELEMETRY", desc: "charts and counters", min: [200, 80],
               make: function () { return new GraphPanel(2, true, 3); } },
  pipeline:  { name: "TASK PIPELINE", desc: "progress bars", min: [150, 56],
               make: function () { return new ProgressPanel(); } },
  stream:    { name: "RAW STREAM", desc: "binary stream", min: [110, 56],
               make: function () { return new BinaryPanel(); } }
};
const PANEL_TYPE_KEYS = Object.keys(PANEL_TYPES);
const LAYOUT_GAP = 6, LAYOUT_MARGIN = 8;

/* A layout is a tree. A leaf is a panel, { p: type, id, s? }; a split lays its
   children side by side ("h") or stacked ("v"), { d, c: [children],
   f: [fractions summing to 1] }. Fractions share out the split's size net
   of the gaps between its children. The id ties a leaf to its live panel
   instance, so moving a panel keeps its content running instead of
   restarting it. `s` holds that panel's own settings, only the values that
   differ from its type's defaults (see panelConfig). */

function jitter(base, amount) { return base + (rnd() * 2 - 1) * amount; }

/** The arrangement the wallpaper ships with, its split fractions jittered
 *  so the geometry differs a little on every load. */
function defaultLayout() {
  const leftW = jitter(0.22, 0.02), centerW = jitter(0.46, 0.02);
  const bottomH = jitter(0.18, 0.02);
  const leftSplit = jitter(0.58, 0.04), rightSplit = jitter(0.55, 0.04);
  const leaf = function (p, id) { return { p: p, id: id }; };
  return { d: "v", f: [1 - bottomH, bottomH], c: [
    { d: "h", f: [leftW, centerW, 1 - leftW - centerW], c: [
      { d: "v", f: [leftSplit, 1 - leftSplit], c: [leaf("trace", 1), leaf("hex", 2)] },
      leaf("code", 3),
      { d: "v", f: [rightSplit, 1 - rightSplit], c: [leaf("target", 4), leaf("tty", 5)] }
    ]},
    { d: "h", f: [0.38, 0.36, 0.26], c: [leaf("telemetry", 6), leaf("pipeline", 7), leaf("stream", 8)] }
  ]};
}

function cloneTree(n) { return n ? JSON.parse(JSON.stringify(n)) : null; }

/** Collapses one-child splits and folds a split into a parent running the
 *  same way, so however a layout was edited it stays the simplest tree
 *  that draws it. Mutates and returns the (possibly new) node. */
function tidyTree(n) {
  if (!n || !n.c) return n;
  const c = [], f = [];
  for (let i = 0; i < n.c.length; i++) {
    const k = tidyTree(n.c[i]);
    if (!k) continue;
    if (k.c && k.d === n.d) {
      for (let j = 0; j < k.c.length; j++) { c.push(k.c[j]); f.push(n.f[i] * k.f[j]); }
    } else { c.push(k); f.push(n.f[i]); }
  }
  if (c.length === 0) return null;
  if (c.length === 1) return c[0];
  let sum = 0;
  for (let i = 0; i < f.length; i++) sum += f[i];
  n.c = c;
  n.f = f.map(function (x) { return Number((x / sum).toFixed(5)); });
  return n;
}

/** Rebuilds a layout from untrusted input — a save, a link, a JSON file —
 *  keeping only what is well-formed. Unknown panel types and malformed
 *  splits are dropped, missing or bad fractions shared equally, duplicate
 *  ids renumbered. Returns a tidy tree, or null when nothing survives. */
function validateTree(n) {
  const seen = new Set();
  let leaves = 0;
  function walk(n, depth) {
    if (!n || typeof n !== "object" || depth > 24 || leaves >= 64) return null;
    if (typeof n.p === "string") {
      if (!PANEL_TYPES[n.p]) return null;
      let id = Number.isInteger(n.id) && n.id > 0 ? n.id : 0;
      if (!id || seen.has(id)) id = 0;
      if (id) seen.add(id);
      leaves++;
      const out = { p: n.p, id: id };
      const s = diffState(panelConfig(n.p, n.s), panelDefaults(n.p));
      if (s) out.s = s;
      return out;
    }
    if ((n.d !== "h" && n.d !== "v") || !Array.isArray(n.c)) return null;
    const c = [], f = [];
    for (let i = 0; i < n.c.length; i++) {
      const k = walk(n.c[i], depth + 1);
      if (!k) continue;
      const fi = Array.isArray(n.f) ? Number(n.f[i]) : NaN;
      c.push(k);
      f.push(Number.isFinite(fi) && fi > 0 ? fi : NaN);
    }
    const known = f.filter(function (x) { return !isNaN(x); });
    const fill = known.length ? known.reduce(function (a, b) { return a + b; }, 0) / known.length : 1;
    return { d: n.d, c: c, f: f.map(function (x) { return isNaN(x) ? fill : x; }) };
  }
  const t = tidyTree(walk(n, 0));
  // ids lost to duplicates or bad input get fresh ones
  let next = 1;
  seen.forEach(function (id) { if (id >= next) next = id + 1; });
  forEachLeaf(t, function (l) { if (!l.id) l.id = next++; });
  return t;
}

function forEachLeaf(n, fn) {
  if (!n) return;
  if (!n.c) { fn(n); return; }
  for (let i = 0; i < n.c.length; i++) forEachLeaf(n.c[i], fn);
}
function nextLeafId(root) {
  let m = 0;
  forEachLeaf(root, function (l) { if (l.id > m) m = l.id; });
  return m + 1;
}
/** Smallest [w, h] a subtree can be laid out at, gaps included. */
function minSize(n) {
  if (!n) return [0, 0];
  if (!n.c) return PANEL_TYPES[n.p].min.slice();
  let w = 0, h = 0;
  for (let i = 0; i < n.c.length; i++) {
    const m = minSize(n.c[i]);
    if (n.d === "h") { w += m[0]; h = Math.max(h, m[1]); }
    else { h += m[1]; w = Math.max(w, m[0]); }
  }
  const gaps = (n.c.length - 1) * LAYOUT_GAP;
  if (n.d === "h") w += gaps; else h += gaps;
  return [w, h];
}

/** Lays the tree out into `r`. Collects every leaf with its rect, and every
 *  gap between two siblings as a splitter the editor can drag. */
function solveTree(n, r, leaves, splitters) {
  if (!n) return;
  if (!n.c) { leaves.push({ node: n, r: r }); return; }
  const horiz = n.d === "h";
  const total = (horiz ? r.w : r.h) - LAYOUT_GAP * (n.c.length - 1);
  let pos = horiz ? r.x : r.y;
  for (let i = 0; i < n.c.length; i++) {
    const last = i === n.c.length - 1;
    // the last child takes whatever is left, so rounding never opens a seam
    const size = last ? (horiz ? r.x + r.w : r.y + r.h) - pos : total * n.f[i];
    const cr = horiz ? { x: pos, y: r.y, w: size, h: r.h } : { x: r.x, y: pos, w: r.w, h: size };
    solveTree(n.c[i], cr, leaves, splitters);
    pos += size;
    if (!last) {
      splitters.push({ node: n, i: i, total: total,
        r: horiz ? { x: pos, y: r.y, w: LAYOUT_GAP, h: r.h } : { x: r.x, y: pos, w: r.w, h: LAYOUT_GAP } });
      pos += LAYOUT_GAP;
    }
  }
}

/* ---- edits — each takes a root and returns the new root ------------- */

/** Finds the split holding the leaf with this id, and the leaf's index. */
function findParent(n, id, parent, index) {
  if (!n) return null;
  if (!n.c) return n.id === id ? { parent: parent, index: index, leaf: n } : null;
  for (let i = 0; i < n.c.length; i++) {
    const hit = findParent(n.c[i], id, n, i);
    if (hit) return hit;
  }
  return null;
}
function removeLeaf(root, id) {
  const hit = findParent(root, id, null, -1);
  if (!hit) return root;
  if (!hit.parent) return null;
  hit.parent.c.splice(hit.index, 1);
  hit.parent.f.splice(hit.index, 1);
  return tidyTree(root);
}
/** Docks `leaf` on one side ("l", "r", "t", "b") of the leaf with id
 *  `targetId`, halving that leaf — or, with targetId null, along that whole
 *  edge of the screen, taking `share` of it. */
function dockLeaf(root, leaf, targetId, side, share) {
  const dir = side === "l" || side === "r" ? "h" : "v";
  const before = side === "l" || side === "t";
  if (!root) return leaf;
  if (targetId === null) {
    const s = share || 0.25;
    const wrap = { d: dir, c: before ? [leaf, root] : [root, leaf], f: before ? [s, 1 - s] : [1 - s, s] };
    return tidyTree(wrap);
  }
  const hit = findParent(root, targetId, null, -1);
  if (!hit) return root;
  const target = hit.leaf;
  if (hit.parent && hit.parent.d === dir) {
    // the target's own split already runs this way: share its slot
    const half = hit.parent.f[hit.index] / 2;
    hit.parent.f[hit.index] = half;
    hit.parent.c.splice(before ? hit.index : hit.index + 1, 0, leaf);
    hit.parent.f.splice(before ? hit.index : hit.index + 1, 0, half);
    return tidyTree(root);
  }
  const pair = { d: dir, c: before ? [leaf, target] : [target, leaf], f: [0.5, 0.5] };
  if (!hit.parent) return pair;
  hit.parent.c[hit.index] = pair;
  return tidyTree(root);
}
function swapLeaves(root, idA, idB) {
  const a = findParent(root, idA, null, -1), b = findParent(root, idB, null, -1);
  if (!a || !b) return root;
  const pa = a.parent ? a.parent.c : null, pb = b.parent ? b.parent.c : null;
  if (!pa || !pb) return root;
  pa[a.index] = b.leaf;
  pb[b.index] = a.leaf;
  return root;
}

/** Owns the panel instances, one per layout leaf, and lays them out. */
class PanelManager {
  constructor() {
    this.defaultTree = defaultLayout();
    this.instances = new Map();      // leaf id -> panel
    this.panels = [];                // in layout order, for update and draw
    this.root = null;
    this.leaves = [];                // [{ node, r }] after layout()
    this.splitters = [];
    this.setTree(this.currentTree());
  }
  /** The tree in force: the user's, or the default one when there is none. */
  currentTree() { return S.layout ? S.layout.root : this.defaultTree; }
  /** Makes the instances match the tree. A leaf whose id is already live
   *  keeps its panel — and with it the content that panel was showing; a
   *  leaf of a different type under the same id gets a fresh one. */
  setTree(root) {
    this.root = root;
    const keep = new Map(), list = [];
    const self = this;
    forEachLeaf(root, function (leaf) {
      let p = self.instances.get(leaf.id);
      if (!p || p._type !== leaf.p) {
        p = PANEL_TYPES[leaf.p].make();
        p._type = leaf.p;
      }
      p._leafId = leaf.id;
      p.configure(panelConfig(leaf.p, leaf.s));
      keep.set(leaf.id, p);
      list.push(p);
    });
    this.instances.forEach(function (p, id) { if (keep.get(id) !== p) p.layer.release(); });
    this.instances = keep;
    this.panels = list;
  }
  update(dt) {
    for (let i = 0; i < this.panels.length; i++) {
      const p = this.panels[i];
      p.update(dt * p.speed);
    }
  }
  /** A Layer notices its own geometry changing, but a resize can also
   *  change DPR and re-measure every font while a panel keeps its pixel
   *  size, so drop every cache explicitly rather than reason about it. */
  invalidateAll() {
    for (let i = 0; i < this.panels.length; i++) this.panels[i].layer.invalidate();
  }
  layout(width, height) {
    this.leaves = []; this.splitters = [];
    solveTree(this.root, { x: LAYOUT_MARGIN, y: LAYOUT_MARGIN,
      w: width - LAYOUT_MARGIN * 2, h: height - LAYOUT_MARGIN * 2 }, this.leaves, this.splitters);
    for (let i = 0; i < this.leaves.length; i++) {
      const l = this.leaves[i], p = this.instances.get(l.node.id);
      p.x = l.r.x; p.y = l.r.y; p.w = l.r.w; p.h = l.r.h;
      if (p instanceof GraphPanel) p.syncOrientation();
    }
  }
}

/** Root: clears, draws the wallpaper + panels, then the CRT overlays. */
class Dashboard {
  constructor() {
    this.panels = new PanelManager();
    this.bg = new BackgroundLayer(pick(BG_KEYS));
    // Phases rather than one clock, so a speed setting changing mid-run
    // changes the rate from here on instead of jumping the position.
    this.scanPhase = 0; this.bandPhase = 0;
    this.flickerTimer = 3; this.flickerLeft = 0;
    this.glitchTimer = 5; this.glitchLeft = 0; this.glitchY = 0;
    this.scanPattern = null;
    this.vignette = null;
    this.bandFill = ""; this.flickerFill = "";
    this.rebuildFx();
  }
  /** Re-derives everything the overlays draw with from S.fx. None of it
   *  depends on the screen size (the vignette is drawn in a unit square
   *  scaled to the screen), so this runs on a settings change only. A
   *  strength of 0 leaves the asset null and its draw is skipped. */
  rebuildFx() {
    const fx = S.fx;

    // Scanlines as a 4px-tall repeating pattern: one fillRect per frame
    // instead of a DrawLine for every fourth row of a 4K screen.
    this.scanPattern = null;
    if (fx.scan > 0) {
      const pc = document.createElement("canvas");
      pc.width = 1; pc.height = 4;
      const px = pc.getContext("2d");
      px.fillStyle = "rgba(0,0,0," + Math.min(1, 0.10 * fx.scan) + ")";
      px.fillRect(0, 0, 1, 1);
      this.scanPattern = screenCtx.createPattern(pc, "repeat");
    }

    this.vignette = null;
    if (fx.vignette > 0) {
      const g = screenCtx.createRadialGradient(0, 0, 0, 0, 0, 0.75);
      g.addColorStop(0, "rgba(0,0,0,0)");
      g.addColorStop(0.75, "rgba(0,0,0,0)");
      g.addColorStop(1, "rgba(0,0,0," + Math.min(1, 0.35 * fx.vignette) + ")");
      this.vignette = g;
    }

    // Built directly rather than through fade(), whose 1/64 alpha steps
    // would turn these faint fills into a staircase. The band's base alpha
    // is 1/64 because that is what fade(Green, 0.025) quantised it to.
    const G = T.Green;
    this.bandFill = "rgba(" + G.r + "," + G.g + "," + G.b + "," + (fx.band / 64) + ")";
    this.flickerFill = "rgba(255,255,255," + Math.min(1, 0.03 * fx.flicker) + ")";
  }
  /** Swaps in a different wallpaper without reloading, punctuated with a
   *  glitch burst so the change reads as intentional. Never re-rolls onto
   *  the wallpaper already showing. */
  reroll() {
    let keys = BG_KEYS;
    if (keys.length > 1) {
      const self = this;
      keys = keys.filter(function (k) { return k !== self.bg.key; });
    }
    this.bg = new BackgroundLayer(pick(keys));
    this.glitchLeft = 0.18;
    this.glitchY = rnd();
  }
  /** Re-reads the layout from S: instances to match, then their rects. */
  applyLayout() {
    this.panels.setTree(this.panels.currentTree());
    this.panels.layout(VW, VH);
  }
  resized() {
    this.panels.layout(VW, VH);
    this.panels.invalidateAll();
    this.bg.invalidate();
  }
  update(dt) {
    const fx = S.fx;
    this.scanPhase = (this.scanPhase + dt * 12 * fx.scanDrift) % 4;
    this.bandPhase = (this.bandPhase + dt * 0.09 * fx.bandSpeed) % 1.25;
    this.panels.update(dt);
    this.bg.update(dt);

    this.flickerLeft -= dt;
    this.flickerTimer -= dt;
    if (this.flickerTimer <= 0) {
      this.flickerTimer = 4 + rnd() * 9;
      this.flickerLeft = 0.06 + rnd() * 0.08;
    }
    // Frequency scales how fast the countdown runs, so 0 simply never
    // fires — F6's own burst still plays.
    this.glitchLeft -= dt;
    this.glitchTimer -= dt * fx.glitch;
    if (this.glitchTimer <= 0) {
      this.glitchTimer = 6 + rnd() * 12;
      this.glitchLeft = 0.10 + rnd() * 0.15;
      this.glitchY = rnd();
    }
  }
  draw() {
    // Cleared to the wallpaper's own backdrop colour, not the theme black,
    // so a contained image shows no rectangle edge against it.
    ctx.fillStyle = this.bg.backdrop;
    ctx.fillRect(0, 0, VW, VH);
    this.bg.draw(this.glitchLeft > 0 ? 1 : 0);

    const panels = this.panels.panels;
    for (let i = 0; i < panels.length; i++) panels[i].render();

    this.drawOverlays();
  }
  drawOverlays() {
    // Slowly drifting scanlines — subtle so text stays readable.
    const fx = S.fx;
    if (this.scanPattern) {
      const phase = this.scanPhase;
      ctx.save();
      ctx.translate(0, phase);
      ctx.fillStyle = this.scanPattern;
      ctx.fillRect(0, -phase, VW, VH + 4);
      ctx.restore();
    }

    // A brighter "refresh band" sweeping down the screen.
    if (fx.band > 0) {
      const bandY = this.bandPhase * VH * 1.25 - VH * 0.125;
      ctx.fillStyle = this.bandFill;
      ctx.fillRect(0, bandY, VW, VH * 0.10);
    }

    if (this.flickerLeft > 0 && fx.flicker > 0) {
      ctx.fillStyle = this.flickerFill;
      ctx.fillRect(0, 0, VW, VH);
    }

    if (this.glitchLeft > 0) {
      const gy = this.glitchY * VH;
      const gh = 3 + ((this.glitchLeft * 40) % 6);
      ctx.fillStyle = fade(T.Cyan, 0.10);
      ctx.fillRect(3, gy, VW, gh);
      ctx.fillStyle = fade(T.Red, 0.08);
      ctx.fillRect(-3, gy + gh, VW, gh * 0.6);
    }

    // Soft radial vignette for the CRT feel.
    if (this.vignette) {
      ctx.save();
      ctx.translate(VW / 2, VH / 2);
      ctx.scale(VW, VH);
      ctx.fillStyle = this.vignette;
      ctx.fillRect(-0.5, -0.5, 1, 1);
      ctx.restore();
    }
  }
}

/* ---------------------------------------------------------------------
   Settings — schema
   ------------------------------------------------------------------ */

/* Everything the settings panel shows, in order. A section is
   { id, title, apply?, closed?, rows }; a row is { kind, label, path, ... }
   where `kind` names a builder in ROW_KINDS (range, check, select, note,
   button). Optional on any row: tip (hover text), show(s) / dis(s)
   predicates re-evaluated on every change, and apply, overriding the
   section's. `apply` names an entry of APPLY, run after the value lands.
   A range row also takes `unit` (see U_PCT), which sets both how its value
   reads and how a typed value is understood.

   Adding a setting is: a key in DEFAULTS, a row here, and — if the
   wallpaper has to rebuild something for it — an applier. Ranges declared
   here are also what sanitizeState() clamps loaded values to. */

/* How a ranged value reads and is typed. It shows as value * scale to `dp`
   decimals plus `suffix`, with `zero` in place of the number at 0; typing
   uses the same units, so 137 in a percentage field means 1.37. `int`
   rounds typed values to whole units. */
const U_PCT = { scale: 100, dp: 0, suffix: "%", zero: "off" };
const U_MUL = { scale: 1, dp: 2, suffix: "x", zero: "stopped" };
const U_SPEED = { scale: 1, dp: 2, suffix: "x", zero: "frozen" };
const U_FPS = { scale: 1, dp: 0, suffix: "", zero: "uncapped", int: true };
const U_NUM2 = { scale: 1, dp: 2, suffix: "" };

/** Display number, to `dp` decimals unless a typed value carries more. */
function unitNumber(u, v) {
  const d = v * u.scale, s = d.toFixed(u.dp);
  return Math.abs(Number(s) - d) < 1e-9 ? s : String(Number(d.toFixed(u.dp + 3)));
}
function unitShow(u, v) { return v <= 0 && u.zero ? u.zero : unitNumber(u, v) + u.suffix; }
function unitEditText(u, v) { return String(Number((v * u.scale).toFixed(6))); }
/** Typed text -> value, or NaN. Accepts a decimal comma, the unit's own
 *  suffix and its zero word ("off"). */
function unitParse(u, text) {
  const t = String(text).trim().toLowerCase().replace(",", ".");
  if (u.zero && t === u.zero) return 0;
  const num = t.replace(/\s*[%x×]$/, "");
  if (!num || !/^[-+]?(\d+\.?\d*|\.\d+)(e[-+]?\d+)?$/.test(num)) return NaN;
  const v = Number(num) / u.scale;
  return u.int ? Math.round(v) : Number(v.toFixed(6));
}

/** Holds every value in `o` to what its row allows, in place: ranges
 *  clamped (and rounded where the unit is whole numbers), unknown choices
 *  back to their default, text cut to length. */
function sanitizeRows(o, rows, defaults) {
  for (let i = 0; i < rows.length; i++) {
    const row = rows[i];
    if (!row.path) continue;
    const v = getPath(o, row.path);
    if (row.kind === "range") {
      const c = clamp(v, row.min, row.max);
      setPath(o, row.path, row.unit && row.unit.int ? Math.round(c) : c);
    } else if (row.kind === "select" && !row.options.some(function (x) { return x[0] === v; })) {
      setPath(o, row.path, getPath(defaults, row.path));
    } else if (row.kind === "text" && v.length > (row.max || 40)) {
      setPath(o, row.path, v.slice(0, row.max || 40));
    }
  }
}
function sanitizeState(s) {
  if (s.layout !== null)
    s.layout = s.layout && typeof s.layout === "object" && !Array.isArray(s.layout)
      ? { root: validateTree(s.layout.root) } : null;
  for (let i = 0; i < SETTINGS_SCHEMA.length; i++) sanitizeRows(s, SETTINGS_SCHEMA[i].rows, DEFAULTS);
}

/* The sections a panel's settings window shows. Built once per type. */
const _panelSections = {};
function panelSections(type) {
  let secs = _panelSections[type];
  if (secs) return secs;
  secs = [{ id: "panel", title: "PANEL", rows: PANEL_COMMON_ROWS }];
  if (PANEL_ROWS[type].length) secs.push({ id: type, title: PANEL_TYPES[type].name, rows: PANEL_ROWS[type] });
  if (type === "tty") {
    secs.push({ id: "cmds", title: "COMMANDS", closed: true, rows:
      [{ kind: "note", label: "Which commands this terminal runs. With none ticked, it runs them all." }]
      .concat(SHELL_COMMANDS.map(function (k) {
        return { kind: "check", label: k[1], path: "cmd." + k[0], def: true };
      })) });
  }
  return (_panelSections[type] = secs);
}

function setPathDeep(o, path, v) {
  const p = path.split(".");
  for (let i = 0; i < p.length - 1; i++) o = o[p[i]] || (o[p[i]] = {});
  o[p[p.length - 1]] = v;
}
const _panelDefaults = {};
function panelDefaults(type) {
  let d = _panelDefaults[type];
  if (d) return d;
  d = {};
  panelSections(type).forEach(function (sec) {
    sec.rows.forEach(function (row) { if (row.path) setPathDeep(d, row.path, row.def); });
  });
  return (_panelDefaults[type] = d);
}
/** A panel's full settings: its type's defaults with `s` merged over them,
 *  every value clamped to what its row allows. */
function panelConfig(type, s) {
  const c = cloneState(panelDefaults(type));
  mergeInto(c, s);
  panelSections(type).forEach(function (sec) { sanitizeRows(c, sec.rows, panelDefaults(type)); });
  return c;
}


/* What has to happen after a value changes, by group. Anything read
   straight from S every frame (master speed) needs no entry. */
const APPLY = {
  fx: function () { if (dashboard) dashboard.rebuildFx(); },
  perf: function () {
    // turning the override off hands the cap straight back to the host
    if (applyHostFps()) Settings.refresh();
    if (dashboard && targetDpr() !== DPR) resize();
  },
  ui: function () { Settings.syncButton(); },
  layout: function () {
    if (!dashboard) return;
    dashboard.applyLayout();
    LayoutEditor.refresh();
    PanelGears.refresh();
  }
};
function applyAll() {
  const k = Object.keys(APPLY);
  for (let i = 0; i < k.length; i++) APPLY[k[i]]();
  requestDraw();
}

/** Replaces the whole state: defaults, then `obj` merged over them. */
function loadState(obj, persist) {
  S = cloneState(DEFAULTS);
  mergeInto(S, obj);
  sanitizeState(S);
  // an imported state brings its own override switch — the host's limit
  // takes the cap straight back if it arrived turned off
  if (applyHostFps() || persist !== false) persistLater();
  applyAll();
  Settings.refresh();
}

let fpsMeter = null;

function domEl(tag, cls, parent, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  if (parent) parent.appendChild(e);

/* ---------------------------------------------------------------------
   Settings — form controls
   ------------------------------------------------------------------ */

/* Builds window contents from a schema (see SETTINGS_SCHEMA) bound to some
   state: the settings window binds it to S, a panel's settings window to
   that one panel's values. ctx is { get(path), set(row, sec, value),
   status(msg), state() }, where state() is what show/dis predicates see. */
const Form = (function () {
  const el = domEl;
  let closePop = null;            // closes whichever dropdown list is open

  function onActivate(e, fn) {
    e.addEventListener("click", fn);
    e.addEventListener("keydown", function (ev) {
      if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); fn(); }
    });
  }
  function mkButton(parent, label, title) {
    const b = el("div", "hk-btn", parent, label);
    b.tabIndex = 0;
    b.setAttribute("role", "button");
    if (title) b.title = title;
    return b;
  }

  /* ---- row builders ------------------------------------------------
     Each returns a binding { row, rowEl, input, sync }, where sync()
     pulls the control back in line with the state the form edits. */
  const ROW_KINDS = {
    range: function (parent, row, sec, ctx) {
      const r = el("div", "hk-row", parent);
      const lab = el("div", "hk-lab", r);
      el("span", null, lab, row.label);
      const val = el("span", "hk-val", lab);
      val.tabIndex = 0;
      val.setAttribute("role", "button");
      val.title = "Click to type an exact value";
      const inp = el("input", null, r);
      inp.type = "range";

      inp.setAttribute("aria-label", row.label);

      // something expensive (a resize re-bakes the background)
