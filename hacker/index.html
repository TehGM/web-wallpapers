      });
      if (row.live === false)
        inp.addEventListener("change", function () { ctx.set(row, sec, parseFloat(inp.value)); });

      /* The readout doubles as a text field for exact values: the slider
         snaps to its step, a typed value does not. The slider then shows
         its nearest step while the setting keeps what was typed. */
      function edit() {
        if (inp.disabled) return;
        const box = el("input", "hk-edit");
        box.type = "text";
        box.spellcheck = false;
        box.inputMode = "decimal";
        box.setAttribute("aria-label", row.label);
        box.value = unitEditText(u, ctx.get(row.path));
        val.replaceWith(box);
        box.focus();
        box.select();
        let done = false;
        function finish(accept, refocus) {
          if (done) return;
          done = true;
          if (accept) {
            const v = unitParse(u, box.value);
            if (isNaN(v)) ctx.status("not a number: " + box.value.trim());
            else {
              const c = clamp(v, row.min, row.max);
              if (c !== v) ctx.status(row.label.toLowerCase() + " limited to " +
                                  unitNumber(u, row.min) + "–" + unitNumber(u, row.max) + u.suffix);
              if (c !== ctx.get(row.path)) ctx.set(row, sec, c);
            }
          }
          box.replaceWith(val);
          sync();
          if (refocus) val.focus();
        }
        box.addEventListener("keydown", function (e) {
          if (e.key === "Enter") { e.preventDefault(); finish(true, true); }
          else if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); finish(false, true); }
        });
        box.addEventListener("blur", function () { finish(true, false); });
      }
      val.addEventListener("click", edit);
      val.addEventListener("keydown", function (e) {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); edit(); }
      });

      function sync() {
        const v = ctx.get(row.path);
        inp.value = v;
        val.textContent = unitShow(u, v);
      }
      return { row: row, rowEl: r, input: inp, sync: sync };
    },
    check: function (parent, row, sec, ctx) {
      const r = el("label", "hk-row hk-chk", parent);
      const inp = el("input", null, r);
      inp.type = "checkbox";
      el("span", "hk-box", r);
      el("span", null, r, row.label);
      inp.addEventListener("change", function () { ctx.set(row, sec, inp.checked); });
      return { row: row, rowEl: r, input: inp, sync: function () {
        inp.checked = !!ctx.get(row.path);
      }};
    },
    select: function (parent, row, sec, ctx) {
      const r = el("div", "hk-row", parent);
      el("div", "hk-lab", r, row.label);
      const sel = makeSelect(el("div", "hk-sel", r), row.options);
      sel.el.setAttribute("aria-label", row.label);
      sel.onChange = function () { ctx.set(row, sec, sel.value); };
      return { row: row, rowEl: r, input: sel.el, sync: function () {
        sel.value = ctx.get(row.path);
      }};
    },
    /* Commits on Enter or on leaving the field, not per keystroke — a
       half-typed host name is not worth a repaint. Esc puts it back. */
    text: function (parent, row, sec, ctx) {
      const r = el("div", "hk-row", parent);
      el("div", "hk-lab", r, row.label);
      const inp = el("input", "hk-text", r);
      inp.type = "text";
      inp.spellcheck = false;
      inp.maxLength = row.max || 40;
      if (row.placeholder) inp.placeholder = row.placeholder;
      inp.setAttribute("aria-label", row.label);
      inp.addEventListener("change", function () { ctx.set(row, sec, inp.value.trim()); });
      inp.addEventListener("keydown", function (e) {
        if (e.key === "Enter") { e.preventDefault(); inp.blur(); }
        else if (e.key === "Escape") {
          e.preventDefault(); e.stopPropagation();
          inp.value = ctx.get(row.path);
          inp.blur();
        }
      });
      return { row: row, rowEl: r, input: inp, sync: function () {
        if (document.activeElement !== inp) inp.value = ctx.get(row.path);
      }};
    },
    note: function (parent, row) {
      return { row: row, rowEl: el("div", "hk-note", parent, row.label), input: null, sync: null };
    },
    button: function (parent, row) {
      const r = el("div", "hk-row", parent);
      const b = mkButton(r, row.label, row.tip);
      onActivate(b, row.run);
      return { row: row, rowEl: r, input: b, sync: null };
    }
  };

  /* ---- dropdown ----------------------------------------------------
     Stand-in for <select>, rendered as plain divs.

     Wallpaper Engine runs the page in an off-screen CEF (Chromium 146), and
     there a <select> kills the renderer with STATUS_ILLEGAL_INSTRUCTION the
     instant it generates a layout box — styling or hiding one is not enough,
     it must never reach layout. Same look and behaviour as the native
     control: click or Enter/Space opens the list, arrows step through values
     while closed, Escape (handled globally) or an outside click dismisses.

     `o.menu` makes it a menu button: it keeps its own label, has no value,
     and fires onChange on every pick, even the same entry twice. */
  function makeSelect(trg, items, o) {
    o = o || {};
    trg.tabIndex = 0;
    trg.setAttribute("role", o.menu ? "button" : "combobox");
    trg.setAttribute("aria-haspopup", "listbox");
    trg.setAttribute("aria-expanded", "false");
    let value = o.menu ? "" : items[0][0];
    let pop = null;
    const api = {
      el: trg,
      onChange: function () {},
      get value() { return value; },
      set value(v) { value = v; paint(); }
    };
    function paint() {
      if (o.menu) return;
      const it = items.find(function (i) { return i[0] === value; });
      trg.textContent = it ? it[1] : "";
    }
    function disabled() { return trg.getAttribute("aria-disabled") === "true"; }
    function onOutside(e) {
      if (e.target !== trg && pop && !pop.contains(e.target)) close();
    }
    function close() {
      if (!pop) return;
      pop.remove(); pop = null; closePop = null;
      trg.setAttribute("aria-expanded", "false");
      window.removeEventListener("mousedown", onOutside, true);
      window.removeEventListener("resize", close);
      window.removeEventListener("scroll", close, true);
    }
    // The panel scrolls and clips its content, so the list is positioned
    // against the viewport on body instead of nested inside the row.
    function open() {
      if (pop) { close(); return; }
      if (closePop) closePop();
      pop = el("div", "hk-opts", document.body);
      pop.setAttribute("role", "listbox");
      const r = trg.getBoundingClientRect();
      pop.style.minWidth = r.width + "px";
      items.forEach(function (it) {
        const opt = el("div", "hk-opt" + (it[0] === value ? " sel" : ""), pop, it[1]);
        opt.setAttribute("role", "option");
        opt.addEventListener("mousedown", function (e) { e.preventDefault(); pick(it[0]); });
      });
      // below the trigger, or flipped above it near the bottom of the screen
      const ph = pop.offsetHeight, pw = pop.offsetWidth;
      let top = r.bottom + 2;
      if (top + ph > window.innerHeight - 4) {
        const above = r.top - 2 - ph;
        top = above >= 4 ? above : Math.max(4, window.innerHeight - 4 - ph);
      }
      pop.style.top = top + "px";
      pop.style.left = Math.max(4, Math.min(r.left, window.innerWidth - 4 - pw)) + "px";
      trg.setAttribute("aria-expanded", "true");
      closePop = close;
      window.addEventListener("mousedown", onOutside, true);
      window.addEventListener("resize", close);
      window.addEventListener("scroll", close, true);
    }
    function pick(v) {
      close();
      if (v === value && !o.menu) return;
      value = v; paint(); api.onChange();
    }
    function step(d) {
      const i = items.findIndex(function (it) { return it[0] === value; });
      const n = items[(i + d + items.length) % items.length][0];
      if (n !== value) { value = n; paint(); api.onChange(); }
    }
    trg.addEventListener("mousedown", function (e) {
      if (e.button !== 0 || disabled()) return;
      e.preventDefault(); trg.focus(); open();
    });
    trg.addEventListener("keydown", function (e) {
      if (disabled()) return;
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); open(); }
      // a menu has no value to cycle, so the arrows just open it
      else if (e.key === "ArrowDown") { e.preventDefault(); o.menu ? open() : step(1); }
      else if (e.key === "ArrowUp") { e.preventDefault(); o.menu ? open() : step(-1); }
    });
    paint();
    return api;
  }

  /** Builds `sections` into `body`. Returns { refresh() }, which pulls
   *  every control back in line with the state. */
  function build(body, sections, ctx) {
    const bindings = [];
    function refreshVis() {
      const st = ctx.state();
      for (let i = 0; i < bindings.length; i++) {
        const b = bindings[i], row = b.row;
        if (row.show) b.rowEl.style.display = row.show(st) ? "" : "none";
        if (row.dis && b.input) {
          const d = !!row.dis(st);
          b.rowEl.classList.toggle("dis", d);
          if ("disabled" in b.input) b.input.disabled = d;
          else b.input.setAttribute("aria-disabled", d ? "true" : "false");
        }
      }
    }
    const rowCtx = {
      get: ctx.get, status: ctx.status,
      set: function (row, sec, v) { ctx.set(row, sec, v); refreshVis(); }
    };
    sections.forEach(function (sec) {
      const box = el("div", "hk-sec" + (sec.closed ? " closed" : ""), body);
      const h = el("div", "hk-sh", box, sec.title);
      h.tabIndex = 0;
      h.setAttribute("role", "button");
      onActivate(h, function () { box.classList.toggle("closed"); });
      const rows = el("div", "hk-rows", box);
      sec.rows.forEach(function (row) {
        const b = ROW_KINDS[row.kind](rows, row, sec, rowCtx);
        if (row.tip) b.rowEl.title = row.tip;
        bindings.push(b);
      });
    });
    return { refresh: function () {
      for (let i = 0; i < bindings.length; i++) if (bindings[i].sync) bindings[i].sync();
      refreshVis();
    }};
  }

  return {
    build: build, makeSelect: makeSelect, onActivate: onActivate, mkButton: mkButton,
    /** Closes an open dropdown list; true when there was one. */
    closePopup: function () { if (!closePop) return false; closePop(); return true; }
  };
})();

/* Nothing of the panel exists until it is first opened: closed, the only
   cost is the one CFG element and its click handler. */
const Settings = (function () {
  const cfgBtn = document.getElementById("hk-cfg");
  let win = null, statusEl = null, fpsEl = null;
  let isOpen = false;

  const el = domEl, onActivate = Form.onActivate, mkButton = Form.mkButton;

  /* Actions above the sections. An entry either runs, or opens a menu of
     [value, label, run] items. */
  const TOOLBAR = [
    { label: "IMPORT ▾", title: "Import settings", menu: [
      ["code", "Scene code…", function () { CodeBox.open("import"); }],
      ["json", "JSON file…", function () { pickJson(); }]
    ]},
    { label: "EXPORT ▾", title: "Export settings", menu: [
      ["link", "Wallpaper link", function () { copyLink(); }],
      ["code", "Scene code…", function () { CodeBox.open("export"); }],
      ["json", "JSON file", function () { downloadJson(); }]
    ]},
    { label: "RESET", title: "Restore every setting to its default",
      run: function () { loadState({}); status("defaults restored"); } }
  ];

  function commit(row, sec, v) {
    setPath(S, row.path, v);
    const name = row.apply || sec.apply;
    if (name && APPLY[name]) APPLY[name]();
    requestDraw();
    persistLater();
  }
  let form = null;
  /** Pulls every control back in line with S. Free while never opened. */
  function refresh() { if (form) form.refresh(); }

  /* ---- window ------------------------------------------------------- */
  function build() {
    win = el("div", "hk-win", document.body);
    win.setAttribute("role", "dialog");
    win.setAttribute("aria-label", "Settings");
    const title = el("div", "hk-title", win);
    el("span", "t", title, "┃ CONFIG // synapse.cfg");
    el("span", "hk-dot", title);
    const x = el("span", "hk-x", title, "✕");
    x.title = "Close (H)";
    x.addEventListener("click", close);
    makeDraggable(title, x);

    const tools = el("div", "hk-tools", win);
    TOOLBAR.forEach(function (t) {
      const b = mkButton(tools, t.label, t.title);
      if (t.menu) {
        const m = Form.makeSelect(b, t.menu.map(function (it) { return [it[0], it[1]]; }), { menu: true });
        m.onChange = function () {
          const it = t.menu.find(function (i) { return i[0] === m.value; });
          if (it) it[2]();
        };
      } else {
        onActivate(b, t.run);
      }
    });

    form = Form.build(el("div", "hk-body", win), SETTINGS_SCHEMA, {
      get: function (path) { return getPath(S, path); },
      set: commit,
      status: status,
      state: function () { return S; }
    });

    const foot = el("div", "hk-foot", win);
    statusEl = el("span", "hk-status", foot, "> ready");
    fpsEl = el("span", null, foot, "-- fps");
    const keys = el("span", null, foot, "H · F6");
    keys.title = "H show/hide settings · L edit layout · F6 next background";

    // a dragged window could end up off a shrunken screen; bring it back
    // to the middle instead
    window.addEventListener("resize", function () {
      dragged = false;
      if (isOpen) center();
    });
  }

  /* Opens centred. Once dragged it stays where it was put — across closing
     and reopening too — until the screen size changes. */
  let dragged = false;
  function center() {
    win.style.maxHeight = "";
    const w = win.offsetWidth, h = win.offsetHeight;
    win.style.left = Math.max(0, Math.round((window.innerWidth - w) / 2)) + "px";
    win.style.top = Math.max(0, Math.round((window.innerHeight - h) / 2)) + "px";
  }

  /* The title bar drags the window, like every other window. Its position
     is per session — it is not a setting. */
  function makeDraggable(handle, skip) {
    handle.addEventListener("pointerdown", function (e) {
      if (e.button !== 0 || e.target === skip) return;
      e.preventDefault();
      const r = win.getBoundingClientRect();
      const ox = e.clientX - r.left, oy = e.clientY - r.top;
      handle.setPointerCapture(e.pointerId);
      function move(ev) {
        const x = clamp(ev.clientX - ox, 0, Math.max(0, window.innerWidth - r.width));
        const y = clamp(ev.clientY - oy, 0, Math.max(0, window.innerHeight - 40));
        win.style.left = x + "px";
        win.style.top = y + "px";
        dragged = true;
        win.style.maxHeight = Math.max(120, window.innerHeight - y - 8) + "px";
      }
      function up() {
        handle.removeEventListener("pointermove", move);
        handle.removeEventListener("pointerup", up);
        handle.removeEventListener("pointercancel", up);
      }
      handle.addEventListener("pointermove", move);
      handle.addEventListener("pointerup", up);
      handle.addEventListener("pointercancel", up);
    });
  }

  function startMeter() {
    let acc = 0, drawn = 0;
    fpsEl.textContent = "-- fps";
    fpsMeter = function (dt, drew) {
      acc += dt;
      if (drew) drawn++;
      if (acc >= 0.5) {
        fpsEl.textContent = Math.round(drawn / acc) + " fps";
        acc = 0; drawn = 0;
      }
    };
  }

  function open() {
    if (!win) build();
    win.style.display = "";
    isOpen = true;
    cfgBtn.classList.add("on");
    refresh();
    PanelGears.show();
    if (!dragged) center();
    startMeter();
  }
  function close() {
    Form.closePopup();
    CodeBox.close();
    if (!isOpen) return;
    win.style.display = "none";
    isOpen = false;
    cfgBtn.classList.remove("on");
    PanelGears.hide();
    // a panel's window opened from here goes with it; the layout editor
    // closes this window on entry and keeps its own
    if (!LayoutEditor.isActive()) PanelSettings.close(true);
    fpsMeter = null;
  }
  function toggle() { if (isOpen) close(); else open(); }
  /** Escape peels one layer: a dropdown, then the code box, then the window. */
  function escape() {
    if (Form.closePopup()) return;
    if (CodeBox.isOpen()) CodeBox.close();
    else if (PanelSettings.isOpen()) PanelSettings.close();
    else close();
  }
  function status(msg) { if (statusEl) statusEl.textContent = "> " + msg; }
  function syncButton() { cfgBtn.classList.toggle("hover", S.ui.button === "hover"); }

  onActivate(cfgBtn, toggle);

  /* ---- import / export ---------------------------------------------- */

  // Clipboard fallback for when the async API is unavailable or rejects
  // (in Wallpaper Engine it rejects whenever the wallpaper isn't focused).
  // execCommand is deprecated, but a native dialog is not an option here.
  function legacyCopy(text) {
    const ta = el("textarea", null, document.body);
    ta.value = text;
    ta.style.cssText = "position:fixed;top:-9999px;opacity:0";
    ta.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (_) {}
    ta.remove();
    return ok;
  }
  function copyText(text, report, okMsg, failMsg) {
    const done = function (ok) { report(ok ? okMsg : failMsg); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { done(true); },
                                               function () { done(legacyCopy(text)); });
    } else {
      done(legacyCopy(text));
    }
  }
  function currentCode() { return encodeConfig(diffState(S, DEFAULTS) || {}); }

  async function copyLink() {
    const code = await persistNow();
    const url = location.href.split(/[?#]/)[0] + (code ? "?config=" + code : "");
    copyText(url, status, "wallpaper link copied", "copy failed — the link is in the address bar");
  }
  function downloadJson() {
    const blob = new Blob([JSON.stringify(S, null, 2)], { type: "application/json" });
    const a = el("a", null, document.body);
    a.href = URL.createObjectURL(blob);
    a.download = "hacker-settings.json";
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
    status("settings saved as JSON");
  }
  let fileInput = null;
  function pickJson() {
    if (!fileInput) {
      fileInput = el("input", null, document.body);
      fileInput.type = "file";
      fileInput.accept = ".json,application/json";
      fileInput.style.display = "none";
      fileInput.addEventListener("change", function () {
        const f = fileInput.files[0];
        fileInput.value = "";
        if (!f) return;
        f.text().then(function (t) { loadState(JSON.parse(t)); status("settings imported"); },
                      function () { status("could not read that file"); })
         .catch(function () { status("that is not a settings JSON file"); });
      });
    }
    fileInput.click();
  }

  /* One overlay serves both directions: export fills it and tries the
     clipboard, import takes a paste. The textarea is not a convenience —
     it is the fallback that has to exist, because the async clipboard
     rejects whenever the wallpaper isn't focused, which in a host like
     Wallpaper Engine is most of the time. */
  const CodeBox = (function () {
    let modal = null, titleEl, hint, text, msg, go, mode = "export";
    function build() {
      modal = el("div", "hk-modal", document.body);
      const w = el("div", "hk-win", modal);
      w.setAttribute("role", "dialog");
      w.setAttribute("aria-modal", "true");
      const t = el("div", "hk-title", w);
      t.style.cursor = "default";
      titleEl = el("span", "t", t);
      el("span", "hk-dot", t);
      el("span", "hk-x", t, "✕").addEventListener("click", close);
      const card = el("div", "hk-card", w);
      hint = el("p", null, card);
      text = el("textarea", null, card);
      text.spellcheck = false;
      text.setAttribute("aria-label", "Scene code");
      const foot = el("div", "hk-cardfoot", card);
      msg = el("span", "hk-status", foot);
      go = mkButton(foot, "");
      onActivate(go, function () { if (mode === "export") copy(); else apply(); });
      onActivate(mkButton(foot, "CLOSE"), close);
      modal.addEventListener("mousedown", function (e) { if (e.target === modal) close(); });
      text.addEventListener("keydown", function (e) {
        if (e.key === "Escape") { e.preventDefault(); close(); }
        else if (e.key === "Enter" && (e.ctrlKey || e.metaKey) && mode === "import") {
          e.preventDefault(); apply();
        }
      });
    }
    async function open(m) {
      Form.closePopup();
      if (!modal) build();
      mode = m;
      const exp = m === "export";
      titleEl.textContent = "┃ " + (exp ? "EXPORT" : "IMPORT") + " // scene code";
      hint.textContent = exp
        ? "Paste this into another copy under IMPORT ▸ Scene code. It carries every " +
          "setting and needs no network — it is how to set up a copy installed from disk, " +
          "which has no link to read settings from."
        : "Paste a scene code below, then APPLY. Ctrl+Enter also applies.";
      go.textContent = exp ? "COPY" : "APPLY";
      msg.textContent = "";
      text.value = exp ? await currentCode() : "";
      modal.classList.add("show");
      text.focus();
      if (exp) copy();
    }
    function close() { if (modal) modal.classList.remove("show"); }
    function isOpen() { return !!modal && modal.classList.contains("show"); }
    function copy() {
      text.select();
      copyText(text.value, function (m) { msg.textContent = m; },
               "> copied to clipboard", "> press Ctrl+C to copy the selected code");
    }
    async function apply() {
      const code = text.value.trim();
      if (!code) { msg.textContent = "> paste a scene code first"; return; }
      let obj;
      try { obj = await decodeConfig(code); }
      catch (_) { msg.textContent = "> that does not look like a scene code"; return; }
      loadState(obj);
      close();
      status("scene code applied");
    }
    return { open: open, close: close, isOpen: isOpen };
  })();

  return {
    open: open, close: close, toggle: toggle, escape: escape,
    isOpen: function () { return isOpen; },
    refresh: refresh, syncButton: syncButton, status: status
  };
})();

/* ---------------------------------------------------------------------
   Panel settings window
   ------------------------------------------------------------------ */

/** Title-bar dragging for a window; `skip` is a control in the bar (its
 *  close button) that must stay clickable. */
function dragWindowBy(win, handle, skip) {
  handle.addEventListener("pointerdown", function (e) {
    if (e.button !== 0 || e.target === skip) return;
    e.preventDefault();
    const r = win.getBoundingClientRect(), ox = e.clientX - r.left, oy = e.clientY - r.top;
    function move(ev) {
      const y = clamp(ev.clientY - oy, 0, Math.max(0, window.innerHeight - 40));
      win.style.left = clamp(ev.clientX - ox, 0, Math.max(0, window.innerWidth - r.width)) + "px";
      win.style.top = y + "px";
      win.style.maxHeight = Math.max(120, window.innerHeight - y - 8) + "px";
    }
    function up() {
      window.removeEventListener("pointermove", move);
      window.removeEventListener("pointerup", up);
    }
    window.addEventListener("pointermove", move);
    window.addEventListener("pointerup", up);
  });
}

/* One panel's own settings, in a window of their own. Opened from the
   layout editor (click a panel, or its ⚙) or from the ⚙ buttons shown on
   every panel while the settings window is open. */
const PanelSettings = (function () {
  let win = null, form = null, titleEl = null, statusEl = null, pid = 0;

  function panelName(id) {
    const p = dashboard.panels.instances.get(id);
    return p && p.title ? p.title : "panel";
  }
  function currentLeaf() {
    const hit = pid ? findParent(dashboard.panels.root, pid, null, -1) : null;
    return hit ? hit.leaf : null;
  }
  function currentCfg() {
    const l = currentLeaf();
    return l ? panelConfig(l.p, l.s) : null;
  }
  /** Whatever shows panels over the wallpaper redraws its marks. */
  function notify() {
    LayoutEditor.refresh();
    PanelGears.refresh();
  }
  function status(m) { if (statusEl) statusEl.textContent = "> " + m; }
  function apply(leaf) {
    dashboard.panels.instances.get(pid).configure(panelConfig(leaf.p, leaf.s));
    requestDraw();
    persistLater();
    if (titleEl) titleEl.textContent = "┃ PANEL // " + panelName(pid);
    notify();
  }
  function set(row, sec, v) {
    // the first change freezes the default layout's jitter into a tree of its
    // own — the setting has to live on a leaf somewhere
    if (!S.layout) { S.layout = { root: cloneTree(dashboard.panels.currentTree()) }; APPLY.layout(); }
    const leaf = currentLeaf();
    if (!leaf) return;
    const c = panelConfig(leaf.p, leaf.s);
    setPath(c, row.path, v);
    const d = diffState(c, panelDefaults(leaf.p));
    if (d) leaf.s = d; else delete leaf.s;
    apply(leaf);
  }
  function reset() {
    const leaf = currentLeaf();
    if (!leaf || !leaf.s) { status("already at its defaults"); return; }
    delete leaf.s;
    apply(leaf);
    form.refresh();
    status("panel reset");
  }

  function open(id) {
    close(true);
    pid = id;
    const leaf = currentLeaf();
    if (!leaf) { pid = 0; return; }
    win = domEl("div", "hk-win hk-pset", document.body);
    win.setAttribute("role", "dialog");
    win.setAttribute("aria-label", "Panel settings");
    const title = domEl("div", "hk-title", win);
    titleEl = domEl("span", "t", title, "┃ PANEL // " + panelName(id));
    domEl("span", "hk-dot", title);
    const x = domEl("span", "hk-x", title, "✕");
    x.title = "Close (Esc)";
    x.addEventListener("click", function () { close(); });
    dragWindowBy(win, title, x);
    const tools = domEl("div", "hk-tools", win);
    Form.onActivate(Form.mkButton(tools, "RESET PANEL", "Put this panel's settings back to their defaults"), reset);
    Form.onActivate(Form.mkButton(tools, "CLOSE", "Close (Esc)"), function () { close(); });
    form = Form.build(domEl("div", "hk-body", win), panelSections(leaf.p), {
      get: function (path) { return getPath(currentCfg(), path); },
      set: set,
      status: status,
      state: currentCfg
    });
    const foot = domEl("div", "hk-foot", win);
    statusEl = domEl("span", "hk-status", foot, "> " + PANEL_TYPES[leaf.p].desc);
    form.refresh();
    // over its own panel: centred on it, level with its top, pushed back
    // onto the screen where it would hang off an edge; below the bottom
    // of the screen the window scrolls instead of growing
    const r = dashboard.panels.leaves.find(function (l) { return l.node.id === id; }).r;
    const w = win.offsetWidth, h = win.offsetHeight;
    const vw = window.innerWidth, vh = window.innerHeight;
    const left = clamp(r.x + (r.w - w) / 2, 8, Math.max(8, vw - w - 8));
    const top = clamp(r.y, 8, Math.max(8, vh - h - 8));
    win.style.left = Math.round(left) + "px";
    win.style.top = Math.round(top) + "px";
    win.style.maxHeight = Math.round(vh - top - 8) + "px";
    notify();
  }
  /** `quiet` skips telling the overlays — for callers that redraw anyway. */
  function close(quiet) {
    if (!win) return;
    Form.closePopup();
    win.remove();
    win = form = titleEl = statusEl = null;
    pid = 0;
    if (!quiet) notify();
  }
  /** Pulls the window back in line after the layout changed under it —
   *  or closes it when its panel is gone. */
  function sync() {
    if (!win) return;
    if (!currentLeaf()) { close(true); return; }
    titleEl.textContent = "┃ PANEL // " + panelName(pid);
    form.refresh();
  }

  return {
    open: open, close: close, sync: sync,
    isOpen: function () { return !!win; },
    id: function () { return pid; }
  };
})();

/* ⚙ on every panel while the settings window is open — the way into a
   panel's own settings without entering the layout editor. Small fixed
   buttons in each panel's top-right corner; nothing else is covered, and
   none of it exists while the settings window is closed. */
const PanelGears = (function () {
  let box = null;
  function show() {
    if (!box) box = domEl("div", "hk-gears", document.body);
    refresh();
  }
  function hide() {
    if (box) { box.remove(); box = null; }
  }
  function refresh() {
    if (!box || !dashboard) return;
    box.textContent = "";
    // the CFG button lives in the top-right title bar too; a gear that
    // would land on it moves to its left instead
    const cfg = document.getElementById("hk-cfg").getBoundingClientRect();
    const W = 24, H = TITLE_BAR_H;
    dashboard.panels.leaves.forEach(function (l) {
      const id = l.node.id, r = l.r;
      let x = r.x + r.w - W;
      const y = r.y;
      if (x < cfg.right && x + W > cfg.left && y < cfg.bottom && y + H > cfg.top) x = cfg.left - W - 2;
      const g = domEl("div", "hk-pg" + (PanelSettings.id() === id ? " sel" : ""), box, "⚙");
      g.style.left = x + "px";
      g.style.top = y + "px";
      g.tabIndex = 0;
      g.setAttribute("role", "button");
      const p = dashboard.panels.instances.get(id);
      g.title = "Settings of " + (p && p.title ? p.title : "this panel");
      Form.onActivate(g, function () {
        if (PanelSettings.id() === id) PanelSettings.close(); else PanelSettings.open(id);
      });
    });
  }
  return { show: show, hide: hide, refresh: refresh };
})();

/* ---------------------------------------------------------------------
   Layout editor
   ------------------------------------------------------------------ */

/* Visual Studio–style docking over the live wallpaper. Drag a panel onto
   another panel's edge to dock beside it, onto its middle to swap the two,
   or onto an edge of the screen to run it along that whole side. Drag a
   gap to resize; ✕ removes a panel; the list adds one — dragged into
   place, or clicked to split the largest panel. Clicking a panel (or its
   ⚙) opens that panel's own settings. Every edit lands in S.layout and
   saves like any other setting.

   Nothing here exists outside edit mode: entering builds the overlay,
   leaving removes it. */
const LayoutEditor = (function () {
  const EDGE_ZONE = 28;          // px from a screen edge that docks along it
  const EDGE_SHARE = 0.25;       // how much of that side the docked panel takes
  const SIDE_NAMES = { l: "left", r: "right", t: "top", b: "bottom" };
  const UNDO_MAX = 60;

  let active = false, fromSettings = false;
  let lay = null, pal = null, ghost = null, dropEl = null, statusEl = null;
  let items = [];
  let undo = [];
  let drag = null;

  /* ---- state ------------------------------------------------------- */

  function editable() { return cloneTree(dashboard.panels.currentTree()); }
  function snapshot() { return S.layout ? { root: cloneTree(S.layout.root) } : null; }
  function pushUndo(snap) {
    undo.push(snap === undefined ? snapshot() : snap);
    if (undo.length > UNDO_MAX) undo.shift();
  }
  function commit(root) {
    S.layout = { root: root };
    APPLY.layout();
    requestDraw();
    persistLater();
  }
  /* Undo steps back through the layout, not through panel settings: a
     panel that is still there keeps the settings it has now. */
  function doUndo() {
    if (!undo.length) { status("nothing to undo"); return; }
    const now = new Map();
    forEachLeaf(dashboard.panels.root, function (l) { now.set(l.id, l); });
    let back = undo.pop();
    const carried = back ? back.root : cloneTree(dashboard.panels.defaultTree);
    let any = false;
    forEachLeaf(carried, function (l) {
      const cur = now.get(l.id);
      if (!cur || cur.p !== l.p) return;
      if (cur.s) { l.s = cloneState(cur.s); any = true; } else delete l.s;
    });
    if (back || any) back = { root: carried };
    S.layout = back;
    APPLY.layout();
    requestDraw();
    persistLater();
    status("undone");
  }
  function resetLayout() {
    if (!S.layout) { status("layout is already the default"); return; }
    PanelSettings.close(true);
    pushUndo();
    S.layout = null;
    APPLY.layout();
    requestDraw();
    persistLater();
    status("layout reset");
  }
  function status(msg) { if (statusEl) statusEl.textContent = "> " + msg; }

  function typeName(t) { return PANEL_TYPES[t].name; }
  function panelName(id) {
    const p = dashboard.panels.instances.get(id);
    return p && p.title ? p.title : "panel";
  }

  /* ---- geometry ------------------------------------------------------ */

  function place(e, r) {
    e.style.left = r.x + "px"; e.style.top = r.y + "px";
    e.style.width = r.w + "px"; e.style.height = r.h + "px";
  }
  /** Rect of the `side` half of r, the part a panel docked there gets. */
  function halfOf(r, side) {
    const hw = (r.w - LAYOUT_GAP) / 2, hh = (r.h - LAYOUT_GAP) / 2;
    if (side === "l") return { x: r.x, y: r.y, w: hw, h: r.h };
    if (side === "r") return { x: r.x + r.w - hw, y: r.y, w: hw, h: r.h };
    if (side === "t") return { x: r.x, y: r.y, w: r.w, h: hh };
    return { x: r.x, y: r.y + r.h - hh, w: r.w, h: hh };
  }
  /** Whether halving a leaf of type `tType` in rect r leaves both it and a
   *  new panel of type `nType` at least their minimum size. */
  function fits(r, tType, side, nType) {
    const horiz = side === "l" || side === "r";
    const half = ((horiz ? r.w : r.h) - LAYOUT_GAP) / 2;
    const tm = PANEL_TYPES[tType].min, nm = PANEL_TYPES[nType].min;
    const a = horiz ? 0 : 1, cross = horiz ? r.h : r.w;
    return half >= tm[a] && half >= nm[a] && cross >= nm[1 - a];
  }

  /** What a drop at (x, y) would do: { targetId, side, rect, ok, label },
   *  or null where it would do nothing. targetId null means the whole
   *  screen — one of its edges, or all of it when the layout is empty. */
  function targetAt(x, y) {
    const pm = dashboard.panels, G = LAYOUT_GAP, M = LAYOUT_MARGIN;
    const full = { x: M, y: M, w: VW - 2 * M, h: VH - 2 * M };
    const nMin = PANEL_TYPES[drag.type].min;
    if (!pm.leaves.length) return { targetId: null, side: "r", rect: full, ok: true, label: "place here" };

    let side = x < EDGE_ZONE ? "l" : x > VW - EDGE_ZONE ? "r"
             : y < EDGE_ZONE ? "t" : y > VH - EDGE_ZONE ? "b" : null;
    if (side) {
      // what stays behind: everything, less the panel being moved
      const rest = drag.kind === "move" ? removeLeaf(cloneTree(pm.root), drag.id) : pm.root;
      if (!rest) return null;
      const horiz = side === "l" || side === "r", a = horiz ? 0 : 1;
      const along = (horiz ? full.w : full.h) - G;
      const s = along * EDGE_SHARE;
      const rect = side === "l" ? { x: full.x, y: full.y, w: s, h: full.h }
                 : side === "r" ? { x: full.x + full.w - s, y: full.y, w: s, h: full.h }
                 : side === "t" ? { x: full.x, y: full.y, w: full.w, h: s }
                 : { x: full.x, y: full.y + full.h - s, w: full.w, h: s };
      const ok = s >= nMin[a] && along - s >= minSize(rest)[a] && (horiz ? full.h : full.w) >= nMin[1 - a];
      return { targetId: null, side: side, rect: rect, ok: ok, label: "dock along the " + SIDE_NAMES[side] + " edge" };
    }

    let hit = null;
    for (let i = 0; i < pm.leaves.length; i++) {
      const r = pm.leaves[i].r;
      if (x >= r.x && x < r.x + r.w && y >= r.y && y < r.y + r.h) { hit = pm.leaves[i]; break; }
    }
    if (!hit) return null;
    const r = hit.r, id = hit.node.id;
    if (drag.kind === "move" && id === drag.id) return null;
    const rx = (x - r.x) / r.w, ry = (y - r.y) / r.h;
    if (drag.kind === "move" && rx > 0.3 && rx < 0.7 && ry > 0.3 && ry < 0.7)
      return { targetId: id, side: "c", rect: r, ok: true, label: "swap with " + panelName(id) };
    const d = { l: rx, r: 1 - rx, t: ry, b: 1 - ry };
    side = "l";
    for (const k in d) if (d[k] < d[side]) side = k;
    return { targetId: id, side: side, rect: halfOf(r, side), ok: fits(r, hit.node.p, side, drag.type),
             label: "dock " + SIDE_NAMES[side] + " of " + panelName(id) };
  }

  /* ---- edits ---------------------------------------------------------- */

  function drop(d, t) {
    if (!t.ok) { status("no room there for " + typeName(d.type) + " — try a bigger panel"); return; }
    pushUndo();
    let root = editable();
    if (d.kind === "move" && t.side === "c") {
      commit(swapLeaves(root, d.id, t.targetId));
      status("swapped");
      return;
    }
    let leaf;
    if (d.kind === "move") {
      leaf = findParent(root, d.id, null, -1).leaf;
      root = removeLeaf(root, d.id);
    } else {
      leaf = { p: d.type, id: nextLeafId(root) };
    }
    commit(dockLeaf(root, leaf, t.targetId, t.side, EDGE_SHARE));
    status((d.kind === "move" ? "moved " : "added ") + typeName(d.type));
  }
  /** Click-to-add: splits the largest panel along its longer side. */
  function autoAdd(type) {
    const pm = dashboard.panels;
    if (!pm.leaves.length) {
      pushUndo();
      commit({ p: type, id: 1 });
      status("added " + typeName(type));
      return;
    }
    let best = null;
    for (let i = 0; i < pm.leaves.length; i++) {
      const l = pm.leaves[i];
      if (!best || l.r.w * l.r.h > best.r.w * best.r.h) best = l;
    }
    const side = best.r.w >= best.r.h ? "r" : "b";
    if (!fits(best.r, best.node.p, side, type)) {
      status("no room left for " + typeName(type) + " — remove or shrink a panel first");
      return;
    }
    pushUndo();
    const root = editable();
    commit(dockLeaf(root, { p: type, id: nextLeafId(root) }, best.node.id, side));
    status("added " + typeName(type) + " beside " + panelName(best.node.id));
  }
  function removePanel(id) {
    const name = panelName(id);
    if (id === PanelSettings.id()) PanelSettings.close(true);
    pushUndo();
    commit(removeLeaf(editable(), id));
    status("removed " + name);
  }

  /* ---- dragging -------------------------------------------------------- */

  function listen(on) {
    const f = on ? window.addEventListener : window.removeEventListener;
    f.call(window, "pointermove", onMove);
    f.call(window, "pointerup", onUp);
    f.call(window, "pointercancel", cancel);
  }
  function startDrag(e, d) {
    if (e.button !== 0 || drag) return;
    e.preventDefault();
    drag = d;
    d.x0 = e.clientX; d.y0 = e.clientY; d.live = false; d.t = null;
    listen(true);
  }
  function startSplit(e, k) {
    if (e.button !== 0 || drag) return;
    e.preventDefault();
    const before = snapshot();
    // the first edit of the default layout freezes its jitter into a tree of
    // its own — the same shape, so splitter k is still the same gap
    if (!S.layout) { S.layout = { root: editable() }; APPLY.layout(); }
    const sp = dashboard.panels.splitters[k];
    const horiz = sp.node.d === "h";
    drag = { kind: "split", sp: sp, horiz: horiz, start: horiz ? e.clientX : e.clientY,
             f0: sp.node.f.slice(), before: before, moved: false };
    document.body.style.cursor = horiz ? "col-resize" : "row-resize";
    listen(true);
  }
  function onMove(e) {
    const d = drag;
    if (!d) return;
    if (d.kind === "split") { moveSplit(d, e); return; }
    if (!d.live) {
      if (Math.abs(e.clientX - d.x0) + Math.abs(e.clientY - d.y0) < 5) return;
      d.live = true;
      lay.classList.add("dragging");
      ghost.textContent = (d.kind === "move" ? "✥ " : "+ ") + d.label;
      ghost.style.display = "block";
      if (d.kind === "move") render();
    }
    ghost.style.left = (e.clientX + 14) + "px";
    ghost.style.top = (e.clientY + 12) + "px";
    d.t = targetAt(e.clientX, e.clientY);
    if (!d.t) { dropEl.style.display = "none"; return; }
    place(dropEl, d.t.rect);
    dropEl.classList.toggle("bad", !d.t.ok);
    dropEl.textContent = d.t.ok ? d.t.label : "no room";
    dropEl.style.display = "flex";
  }
  function moveSplit(d, e) {
    const n = d.sp.node, i = d.sp.i, total = d.sp.total, a0 = d.horiz ? 0 : 1;
    const a = d.f0[i] * total, b = d.f0[i + 1] * total;
    const minA = minSize(n.c[i])[a0], minB = minSize(n.c[i + 1])[a0];
    let na = a + (d.horiz ? e.clientX : e.clientY) - d.start;
    // honour both sides' minimums where they fit at all; on a screen too
    // small for them, just keep either side from vanishing
    na = minA + minB <= a + b ? clamp(na, minA, a + b - minB) : clamp(na, (a + b) * 0.1, (a + b) * 0.9);
    n.f[i] = na / total;
    n.f[i + 1] = (a + b - na) / total;
    d.moved = true;
    dashboard.panels.layout(VW, VH);
    requestDraw();
    render();
  }
  function endDrag() {
    listen(false);
    const d = drag;
    drag = null;
    document.body.style.cursor = "";
    if (lay) {
      lay.classList.remove("dragging");
      ghost.style.display = "none";
      dropEl.style.display = "none";
    }
    return d;
  }
  function onUp() {
    const d = endDrag();
    if (!d) return;
    if (d.kind === "split") {
      if (d.moved) {
        const n = d.sp.node;
        n.f = n.f.map(function (x) { return Number(x.toFixed(5)); });
        pushUndo(d.before);
        persistLater();
        status("resized");
      } else if (!d.before) {
        S.layout = null;            // a click on a gap is not an edit
        APPLY.layout();
      }
      render();
      return;
    }
    if (!d.live) { if (d.kind === "add") autoAdd(d.type); else PanelSettings.open(d.id); return; }
    if (d.t) drop(d, d.t); else render();
  }
  /** Abandons a drag in progress, putting back anything it changed. */
  function cancel() {
    const d = endDrag();
    if (d && d.kind === "split") {
      S.layout = d.before;
      APPLY.layout();
      requestDraw();
    }
    render();
  }

  /* ---- overlay ----------------------------------------------------------- */

  function render() {
    if (!active) return;
    PanelSettings.sync();
    const old = lay.querySelectorAll(".hk-lp, .hk-sp, .hk-empty");
    for (let i = 0; i < old.length; i++) old[i].remove();
    const pm = dashboard.panels;
    pm.leaves.forEach(function (l) {
      const id = l.node.id;
      const e = domEl("div", "hk-lp", lay);
      place(e, l.r);
      if (drag && drag.kind === "move" && drag.live && drag.id === id) e.classList.add("moving");
      if (id === PanelSettings.id()) e.classList.add("sel");
      const c = domEl("div", "hk-lp-c", e);
      domEl("span", null, c, panelName(id));
      domEl("small", null, c, Math.round(l.r.w) + " × " + Math.round(l.r.h));
      const x = domEl("div", "hk-lp-x", e, "✕");
      x.title = "Remove from the layout";
      x.addEventListener("pointerdown", function (ev) { ev.stopPropagation(); });
      x.addEventListener("click", function () { removePanel(id); });
      const g = domEl("div", "hk-lp-g", e, "⚙");
      g.title = "This panel's settings";
      g.addEventListener("pointerdown", function (ev) { ev.stopPropagation(); });
      g.addEventListener("click", function () { PanelSettings.open(id); });
      e.title = "Drag to move — onto an edge to dock, the middle to swap. Click for its settings.";
      e.addEventListener("pointerdown", function (ev) {
        startDrag(ev, { kind: "move", id: id, type: l.node.p, label: panelName(id) });
      });
    });
    pm.splitters.forEach(function (sp, k) {
      const horiz = sp.node.d === "h";
      const e = domEl("div", "hk-sp " + (horiz ? "h" : "v"), lay);
      // a 6px gap is a thin target; the grab area spills over both sides
      const r = sp.r, pad = 4;
      place(e, horiz ? { x: r.x - pad, y: r.y, w: r.w + pad * 2, h: r.h }
                     : { x: r.x, y: r.y - pad, w: r.w, h: r.h + pad * 2 });
      e.title = "Drag to resize";
      e.addEventListener("pointerdown", function (ev) { startSplit(ev, k); });
    });
    if (!pm.leaves.length)
      domEl("div", "hk-empty", lay, "The layout is empty — drag a panel from the list onto the screen, or click one.");
    // how many of each are on screen — more are allowed, this just says so
    const counts = {};
    forEachLeaf(pm.root, function (l) { counts[l.p] = (counts[l.p] || 0) + 1; });
    items.forEach(function (it) {
      const n = counts[it.type] || 0;
      it.count.textContent = n ? "×" + n : "";
      it.el.classList.toggle("on", n > 0);
    });
  }

  function buildPalette() {
    pal = domEl("div", "hk-win hk-pal", document.body);
    pal.setAttribute("role", "dialog");
    pal.setAttribute("aria-label", "Layout editor");
    const title = domEl("div", "hk-title", pal);
    domEl("span", "t", title, "┃ LAYOUT // edit");
    domEl("span", "hk-dot", title);
    const x = domEl("span", "hk-x", title, "✕");
    x.title = "Done (Esc)";
    x.addEventListener("click", exit);
    dragWindowBy(pal, title, x);

    const tools = domEl("div", "hk-tools", pal);
    const mk = function (label, tip, fn) {
      const b = domEl("div", "hk-btn", tools, label);
      b.tabIndex = 0; b.setAttribute("role", "button"); b.title = tip;
      b.addEventListener("click", fn);
      b.addEventListener("keydown", function (e) {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); fn(); }
      });
    };
    mk("UNDO", "Undo the last change (Ctrl+Z)", doUndo);
    mk("RESET", "Reset to the default layout, panel settings included", resetLayout);
    mk("DONE", "Leave the editor (Esc)", exit);

    const body = domEl("div", "hk-body", pal);
    domEl("div", "hk-note", body,
      "Drag a panel to move it: onto another panel's edge to dock beside it, onto its middle to swap, " +
      "or onto the very edge of the screen to run along that side. Drag a gap to resize. ✕ removes. " +
      "Click a panel, or its ⚙, for its own settings.");
    domEl("div", "hk-sh hk-sh-flat", body, "ADD PANEL");
    domEl("div", "hk-note", body, "Drag one into place, or click it to split the largest panel.");
    items = PANEL_TYPE_KEYS.map(function (type) {
      const e = domEl("div", "hk-pi", body);
      e.tabIndex = 0;
      e.setAttribute("role", "button");
      const top = domEl("div", "hk-pi-top", e);
      domEl("b", null, top, "+ " + typeName(type));
      const count = domEl("span", "n", top);
      domEl("div", "d", e, PANEL_TYPES[type].desc);
      e.addEventListener("pointerdown", function (ev) {
        startDrag(ev, { kind: "add", type: type, label: typeName(type) });
      });
      e.addEventListener("keydown", function (ev) {
        if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); autoAdd(type); }
      });
      return { type: type, el: e, count: count };
    });

    const foot = domEl("div", "hk-foot", pal);
    statusEl = domEl("span", "hk-status", foot, "> editing layout");
    domEl("span", null, foot, "Esc · Ctrl+Z");

    const w = pal.offsetWidth, h = pal.offsetHeight;
    pal.style.left = Math.round((window.innerWidth - w) / 2) + "px";
    pal.style.top = Math.round((window.innerHeight - h) / 2) + "px";
  }

  /* ---- mode ---------------------------------------------------------------- */

  function enter() {
    if (active || !dashboard) return;
    fromSettings = Settings.isOpen();
    Settings.close();
    active = true;
    undo = [];
    lay = domEl("div", "hk-lay", document.body);
    ["l", "r", "t", "b"].forEach(function (s) { domEl("div", "hk-edge " + s, lay); });
    dropEl = domEl("div", "hk-drop", lay);
    ghost = domEl("div", "hk-ghost", document.body);
    buildPalette();
    render();
  }
  function exit() {
    if (!active) return;
    if (drag) cancel();
    PanelSettings.close(true);
    active = false;
    lay.remove(); pal.remove(); ghost.remove();
    lay = pal = ghost = dropEl = statusEl = null;
    items = [];
    undo = [];
    if (fromSettings) Settings.open();
  }
  /** Keys while editing; the global handler hands them all here. */
  function key(e) {
    const t = e.target;
    // a text field keeps its own keys — Ctrl+Z there undoes the typing
    if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA")) return;
    if (e.key === "Escape") {
      e.preventDefault();
      if (drag) cancel();
      else if (Form.closePopup()) return;
      else if (PanelSettings.isOpen()) PanelSettings.close();
      else exit();
    }
    else if ((e.ctrlKey || e.metaKey) && (e.key === "z" || e.key === "Z")) { e.preventDefault(); if (!drag) doUndo(); }
    else if (e.key === "l" || e.key === "L") exit();
  }

  return {
    enter: enter, exit: exit, key: key, refresh: render,
    isActive: function () { return active; }
  };
})();

/* ---------------------------------------------------------------------
   Bootstrap
   ------------------------------------------------------------------ */

let dashboard = null;
function onResize() {
  if (!dashboard) return;
  dashboard.resized();
  LayoutEditor.refresh();
  PanelGears.refresh();
}

// Precedence: a link's ?config= (decoded asynchronously, below), then this
// machine's saved settings, then the defaults. A shared link must never be
// quietly overridden by local edits; with no link — exactly the case when a
// wallpaper host opens index.html from disk — local state is all there is.
if (!BOOT_CODE) mergeInto(S, readLocalState());
sanitizeState(S);

window.addEventListener("resize", resize);
window.addEventListener("keydown", function (e) {
  // F6 re-rolls the wallpaper, matching the MAUI build's keybind.
  if (e.key === "F6") { e.preventDefault(); dashboard.reroll(); requestDraw(); return; }
  if (LayoutEditor.isActive()) { LayoutEditor.key(e); return; }
  // never while typing — an "h" in the scene-code box is just a letter
  const t = e.target;
  if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA")) return;
  if (e.key === "h" || e.key === "H") Settings.toggle();
  else if (e.key === "l" || e.key === "L") LayoutEditor.enter();
  else if (e.key === "Escape") Settings.escape();
});

resize();
dashboard = new Dashboard();
dashboard.resized();

/* --- frame loop ------------------------------------------------------ */

// Everything is delta-time based, so the redraw rate is a pure cost knob:
// on a 144/200 Hz display an uncapped rAF loop would redraw 2-3x as often,
// which as a wallpaper is mostly wasted GPU. 60 (the default cap) is the
// design rate — the MAUI build ran a 60 FPS timer. The 0.9 factor keeps a
// display running exactly at the cap from occasionally missing its slot
// and halving.
let hostFps = -1;                    // -1 until a host reports its limit
let targetDt = 1 / 60;
function applyFpsCap() {
  const cap = S.perf.fpsCap;
  targetDt = cap > 0 ? 1 / cap : 0;
}
/** A host may cap the frame rate of everything on the desktop, and that
 *  limit owns the FPS cap unless the override switch is on — it is copied
 *  into the setting, so slider and loop can never disagree. Returns true
 *  when that copy actually moved the value, so the caller can persist it:
 *  both the switch and the resulting cap are remembered. */
function applyHostFps() {
  let changed = false;
  if (hostFps >= 0 && !S.perf.fpsOverride && S.perf.fpsCap !== hostFps) {
    S.perf.fpsCap = hostFps;
    changed = true;
  }
  applyFpsCap();
  return changed;
}

applyAll();

let last = performance.now();
let rafId = 0, wePaused = false;

function tick(now) {
  rafId = requestAnimationFrame(tick);
  let dt = (now - last) / 1000;
  if (dt < targetDt * 0.9) return;
  last = now;
  // Clamp huge gaps (tab suspended, machine asleep) so nothing leaps.
  if (dt > 0.25) dt = 0.25;
  const speed = S.anim.speed;
  // At speed 0 nothing moves, so the last frame stays valid until something
  // else — a resize, a setting — changes the picture.
  const frozen = speed <= 0 && !frameDirty;
  if (fpsMeter) fpsMeter(dt, !frozen);
  if (frozen) return;
  frameDirty = false;
  dashboard.update(dt * speed);
  dashboard.draw();
}

// Stop animating while hidden or paused by the host — as a wallpaper this
// may sit behind fullscreen windows for hours.
function syncRunning() {
  const should = !document.hidden && !wePaused;
  if (should && !rafId) {
    last = performance.now();
    rafId = requestAnimationFrame(tick);
  } else if (!should && rafId) {
    cancelAnimationFrame(rafId);
    rafId = 0;
  }
}
document.addEventListener("visibilitychange", syncRunning);

/* Wallpaper Engine pushes its general settings — among them the frame
   limit it applies to the whole desktop — through this listener, and tells
   the wallpaper when it is paused. In a browser neither ever fires: the
   override switch stays hidden and the FPS cap is always the user's own.
   https://docs.wallpaperengine.io/en/web/performance/fps.html */
window.wallpaperPropertyListener = {
  setPaused: function (p) { wePaused = !!p; syncRunning(); },
  applyGeneralProperties: function (props) {
    // fires for other general properties too — only act when fps is present
    if (!props || props.fps === undefined) return;
    const raw = props.fps;
    const v = Number(raw && typeof raw === "object" ? raw.value : raw);
    if (!Number.isFinite(v) || v < 0) return;
    // clamped to the slider's own top, so control and value never disagree
    hostFps = Math.min(Math.round(v), FPS_CAP_MAX);
    if (applyHostFps()) persistLater();
    Settings.refresh();
  }
};

// A link's settings land before the first frame, so a linked look never
// flashes the defaults first. Loading one does not save it: the address bar
// already holds it, and this machine's own state is left alone until the
// user actually changes something.
(BOOT_CODE
  ? decodeConfig(BOOT_CODE).then(function (obj) { loadState(obj, false); },
      function () { console.warn("hacker: unreadable ?config= in the address bar, ignored"); })
  : Promise.resolve()
).then(syncRunning);

/* Debug/test hook. The Claude Browser pane reports document.hidden=true,
   so rAF never fires there; automated checks drive the wallpaper through
   this instead and sample the canvas. step() is synchronous and bypasses
   the frame cap, the running state and master speed entirely, so a stepped
   frame is never silently swallowed. Harmless in production. */
window.__hacker = {
  dashboard: function () { return dashboard; },
  panels: function () { return dashboard.panels; },
  backgrounds: BG_KEYS,
  step: function (dt) { dashboard.update(dt === undefined ? 1 / 60 : dt); dashboard.draw(); },
  stop: function () { wePaused = true; syncRunning(); },
  start: function () { wePaused = false; syncRunning(); },
  reroll: function () { dashboard.reroll(); },
  setBackground: function (key) { dashboard.bg = new BackgroundLayer(key); },
  setHostFps: function (v) { window.wallpaperPropertyListener.applyGeneralProperties({ fps: v }); },
  fpsCap: function () { return targetDt > 0 ? 1 / targetDt : 0; },
  settings: function () { return S; },
  /** Sets one value the way the panel would: applier, redraw, save. */
  set: function (path, v) { const o = cloneState(S); setPath(o, path, v); loadState(o); },
  loadState: function (obj) { loadState(obj); },
  ui: Settings
};
</script>
</body>
</html>
