   a .NET MAUI desktop app and was ported to this single page; comments

   Purely visual parody. Nothing here performs networking, process
   execution, file scanning or any real work: every character on screen is
   procedurally generated fiction. The only files it ever loads are the
   local logo/background images in ./assets.

/* ---------------------------------------------------------------------
   Theme
   ------------------------------------------------------------------ */

// Colours carry a small cache of quantised rgba() strings so the draw
// loop can fade them without allocating a string per call.
function mkColor(hex) {
  const n = parseInt(hex.slice(1), 16);
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return { r, g, b, css: "rgb(" + r + "," + g + "," + b + ")", _c: new Array(65) };
}
function fade(c, a) {
  let q = (a * 64) | 0;
  if (q < 0) q = 0; else if (q > 64) q = 64;
  let s = c._c[q];
  if (s === undefined) s = c._c[q] = "rgba(" + c.r + "," + c.g + "," + c.b + "," + (q / 64) + ")";
  return s;
}

const T = {
  Background:  mkColor("#04080A"),
  PanelFill:   mkColor("#070D10"),   // drawn at 0.84 alpha — see PANEL_FILL
  Green:       mkColor("#3CFF7A"),
  DimGreen:    mkColor("#1E9A4C"),
  DarkGreen:   mkColor("#0E4A26"),
  Cyan:        mkColor("#2BE8F4"),
  DimCyan:     mkColor("#15788A"),
  Blue:        mkColor("#3B82F6"),
  Orange:      mkColor("#FFA028"),
  Red:         mkColor("#FF3B4A"),
  DimRed:      mkColor("#7A1F26"),
  Gray:        mkColor("#5E7A70"),
  DimGray:     mkColor("#2C3E38"),
  White:       mkColor("#D8FFE8"),
  Black:       mkColor("#000000")
};

const PANEL_FILL = fade(T.PanelFill, 0.84);

const MONO = '"Consolas","Cascadia Mono","DejaVu Sans Mono","Courier New",monospace';
function fontMono(size)     { return size + "px " + MONO; }
function fontMonoBold(size) { return "700 " + size + "px " + MONO; }
function lineHeight(size)   { return size * 1.35; }

// Text measurement gets a context of its own, so it can never disturb the
// font state of whatever surface is being drawn into — Layer (below) swaps
// the global `ctx` between the screen and offscreen bitmaps.
const measureCtx = document.createElement("canvas").getContext("2d");

// Monospace advance width, measured once per size and cached. The MAUI
// build hardcodes 0.55em (Consolas); measuring keeps layout and glyphs in
// register even when a fallback font is substituted.
const _cwCache = new Map();
function charW(size) {
  let w = _cwCache.get(size);
  if (w === undefined) {
    measureCtx.font = fontMono(size);
    w = measureCtx.measureText("0000000000").width / 10;
    _cwCache.set(size, w);
  }
  return w;
}

// Vertical extent of the full-block glyph relative to the "middle"
// baseline, used to draw progress bars as rectangles instead of text —
// see ProgressPanel.drawBar for why.
const _blockCache = new Map();
function blockMetrics(size) {
  let m = _blockCache.get(size);
  if (m === undefined) {
    measureCtx.font = fontMono(size);
    const t = measureCtx.measureText("█");
    m = { asc: t.actualBoundingBoxAscent, desc: t.actualBoundingBoxDescent };
    _blockCache.set(size, m);
  }
  return m;
}

// 25% dither, matching the ░ LIGHT SHADE glyph. Cached per colour — only
// a handful of colours ever reach it.
const _ditherCache = new Map();
function ditherPattern(css) {
  let p = _ditherCache.get(css);
  if (p === undefined) {
    const dc = document.createElement("canvas");
    dc.width = 2; dc.height = 2;
    const dx = dc.getContext("2d");
    dx.fillStyle = css;
    dx.fillRect(0, 0, 1, 1);
    // Built from the screen context, not whatever Layer may have swapped
    // in — the cache outlives any one repaint.
    p = screenCtx.createPattern(dc, "repeat");
    _ditherCache.set(css, p);
  }
  return p;
}

/* ---------------------------------------------------------------------
   RNG + formatting helpers
   ------------------------------------------------------------------ */

const rnd = Math.random;
function rndInt(a, b) {           // C# Rng.Next: [a,b) — or [0,a) with one arg
  if (b === undefined) { b = a; a = 0; }
  return a + ((rnd() * (b - a)) | 0);
}
function pick(arr) { return arr[(rnd() * arr.length) | 0]; }
function shuffled(arr) {
  const c = arr.slice();
  for (let i = c.length - 1; i > 0; i--) {
    const j = (rnd() * (i + 1)) | 0;
    const t = c[i]; c[i] = c[j]; c[j] = t;
  }
  return c;
}
function takeShuffled(arr, n) { return shuffled(arr).slice(0, n); }
function clamp(v, lo, hi) { return v < lo ? lo : v > hi ? hi : v; }

/* Two number formats live on this screen, and they are deliberately
   different.

   Panel readouts — the telemetry counters and the chart values — are this
   wallpaper's own UI, so they follow the viewer's locale the way any
   desktop app's readouts would: 31,190 / 31 190 / 31.190 depending on
   where you are.

   Shell output does not, and must not. A real terminal runs in the C
   locale: ls, df, rsync, apt and the rest print 1,234 with a comma and
   0.5 with a point wherever in the world they run. Localising those would
   be the one detail that gives the illusion away — so everything inside a
   fake command's output goes through n0i / n1i / n2i, which are invariant
   by construction.

   The MAUI build had no such split. It ran under a pl-PL culture, and its
   plain (non-invariant) numeric formats leaked that locale into the fake
   shell output as well. */
function n0i(v) {                                 // "N0", invariant
  return Math.round(v).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
}
function n2i(v) {                                 // "N2", invariant
  const p = v.toFixed(2).split(".");
  return p[0].replace(/\B(?=(\d{3})+(?!\d))/g, ",") + "." + p[1];
}

const UI_LOCALE = (function () {
  try {
    return (navigator.languages && navigator.languages[0]) || navigator.language || "en-US";
  } catch (e) { return "en-US"; }
})();

/* Intl formatters are costly to build and cheap to reuse, so one is kept
   per decimal count. Two constraints come from drawing into a monospace
   grid rather than into a document:

   - `latn` digits are forced. A locale such as ar-EG would otherwise
     format with Arabic-Indic digits, which this font does not carry and
     which run the other way.
   - the result is sanitised. Several locales group with U+00A0 or U+202F
     and sign with U+2212; in a monospace face those are either a
     different advance width or a missing glyph, and the column alignment
     everything here is laid out on would break. */
const _nfCache = new Map();
function _nf(digits) {
  let f = _nfCache.get(digits);
  if (f === undefined) {
    try {
      f = new Intl.NumberFormat(UI_LOCALE, {
        numberingSystem: "latn",
        minimumFractionDigits: digits, maximumFractionDigits: digits
      });
    } catch (e) { f = null; }                     // no Intl, or a tag it rejects
    _nfCache.set(digits, f);
  }
  return f;
}
// Group separators some locales use (U+00A0, U+202F, U+2009) become a plain
// space, and U+2212 MINUS becomes "-", so every glyph has the mono advance.
function _plain(s) {
  return s.replace(/[\u00A0\u202F\u2009]/g, " ").replace(/\u2212/g, "-");
}
/** Locale-formatted integer, for panel readouts only. */
function uiInt(v) {
  const f = _nf(0);
  return f ? _plain(f.format(Math.round(v))) : n0i(v);
}
/** Locale-formatted fixed-decimal value, for panel readouts only. */
function uiFix(v, d) {
  const f = _nf(d);
  return f ? _plain(f.format(v)) : v.toFixed(d);
}
function padL(s, n) { s = String(s); return s.length >= n ? s : " ".repeat(n - s.length) + s; }
function padR(s, n) { s = String(s); return s.length >= n ? s : s + " ".repeat(n - s.length); }
function pad0(v, n) { const s = String(Math.trunc(v)); return s.length >= n ? s : "0".repeat(n - s.length) + s; }
function rep(ch, n) { return n > 0 ? ch.repeat(n) : ""; }

const DAYS = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
function hhmmss(d) { return pad0(d.getHours(),2)+":"+pad0(d.getMinutes(),2)+":"+pad0(d.getSeconds(),2); }

const HEXD = "0123456789ABCDEF";
RD.hex = function (digits) {
  let s = "";

// Line kinds → colours (mirrors Panel.KindColor)
const K_NORMAL = 0, K_INFO = 1, K_WARN = 2, K_ERROR = 3, K_SUCCESS = 4;
function kindColor(k) {
  return k === K_ERROR ? T.Red : k === K_WARN ? T.Orange
       : k === K_SUCCESS ? T.Green : k === K_INFO ? T.Cyan : T.DimGreen;

RD.systemLogLine = function () {
  const roll = rndInt(100);
  const time = hhmmss(new Date());
  if (roll < 5)  return { t: "[" + time + "] !! " + pick(RD.Verbs) + " " + pick(RD.Objects) + " :: " + pick(RD.FailTags) + " 0x" + RD.hex(4), k: K_ERROR };
  if (roll < 12) return { t: "[" + time + "] ~  " + pick(RD.Qualifiers) + " " + pick(RD.Objects) + " " + pick(RD.WarnTags) + " (" + rndInt(1, 400) + " ms)", k: K_WARN };

    case 0: return { t: "[" + time + "]    " + pick(RD.Verbs) + " " + pick(RD.Qualifiers) + " " + pick(RD.Objects) + " " + rndInt(1, 64) + "/" + rndInt(64, 128), k: K_NORMAL };
    case 1: return { t: "[" + time + "]    " + pick(RD.Verbs) + " " + pick(RD.Objects) + " @ " + RD.nodeId() + " .. " + rndInt(1, 100) + "%", k: K_NORMAL };
    case 2: return { t: "[" + time + "]    worker-" + pad0(rndInt(0, 64), 2) + " " + pick(RD.Verbs).toLowerCase() + " " + pick(RD.Objects) + " (" + rndInt(1, 900) + " pending)", k: K_NORMAL };
    case 3: return { t: "[" + time + "] .. " + pick(RD.Subsystems) + ": load=" + rndInt(0, 9) + "." + pad0(rndInt(0, 99), 2) + " rss=" + RD.sizeToken() + " fd=" + rndInt(16, 4096), k: K_NORMAL };
    default: return { t: "[" + time + "]    " + pick(RD.Verbs) + " " + pick(RD.Objects) + ": " + RD.sizeToken() + " in " + rndInt(2, 900) + " ms", k: K_NORMAL };
  }
};

RD.eventFeedLine = function () {
  const roll = rndInt(100);
  if (roll < 6)  return { t: "▲ " + pick(RD.ErrorEvents), k: K_ERROR };
  if (roll < 14) return { t: "● " + RD.nodeId() + " " + pick(RD.WarnTags).toLowerCase(), k: K_WARN };
  return { t: "▸ " + RD.nodeId() + " :: " + pick(RD.Verbs).toLowerCase() + " " + pick(RD.Objects), k: K_NORMAL };
};

RD.progressLabel = function () { return pick(RD.ProgressLabels) + " " + pick(RD.Objects).toUpperCase(); };

/* ---------------------------------------------------------------------
   Company catalogue + logo cache
   ------------------------------------------------------------------ */

function slugOf(name) { return name.toLowerCase().replace(/[^a-z0-9]/g, ""); }

// assets/logos/<slug>.webp — one file per COMPANY_DATA entry.
const LOGO_EXT = ".webp";

const COMPANIES = (function () {
  const out = [];
  const rows = COMPANY_DATA.split(";");
  for (let i = 0; i < rows.length; i++) {
    const p = rows[i].split("|");
    if (p.length < 2 || !p[0]) continue;
    const name = p[0];
    const key = p.length > 2 && p[2] ? p[2] : slugOf(name);
    // Up to three initials for the procedural monogram fallback.
    const words = name.split(" ").filter(function (w) { return w.length > 0; });
    const initials = words.length === 1
      ? name.slice(0, Math.min(2, name.length)).toUpperCase()
      : words.slice(0, 3).map(function (w) { return w[0].toUpperCase(); }).join("");
    out.push({ name: name, key: key, accent: mkColor("#" + p[1]), initials: initials });
  }
  return out;
})();

// Lazily loads assets/logos/{key}.webp, caching the result — including
// failures (cached as null) so a missing file is attempted only once.
// Returns null until the image is decoded, so the monogram shows in the
// meantime and nothing ever blocks the frame loop.
//
// Entries are released once the company has had its turn: the deck is
// 267 long and a full pass takes well over an hour, so keeping every logo
// would slowly pin all of them decoded (~60 MB worst case) for nothing —
// re-reading a few-KB local file on the next pass is free.
const Logos = (function () {
  const cache = new Map();
  return {
    get: function (company) {
      const hit = cache.get(company.key);
      if (hit !== undefined) return hit;
      cache.set(company.key, null);
      const img = new Image();
      img.onload = function () { cache.set(company.key, img); };
      img.decoding = "async";
      img.src = "assets/logos/" + company.key + LOGO_EXT;
      return null;
    },
    release: function (company) { cache.delete(company.key); }
  };
})();

/* ---------------------------------------------------------------------
   Canvas bootstrap
   ------------------------------------------------------------------ */

const canvas = document.getElementById("screen");

/* alpha:true, deliberately, even though every pixel is painted every frame
   and the alpha channel is never used.

   An opaque canvas gets LCD subpixel-antialiased text; a canvas with an
   alpha channel gets grayscale. Layer (below) caches panel content in
   offscreen canvases, which must be transparent and are therefore always
   grayscale — so with an opaque screen canvas the two would disagree, and
   text would visibly change character the moment it moved from live
   drawing into a cache (measured: 73% of differing pixels showed unequal
   per-channel deltas, the RGB-fringe signature, up to 143 code values on a
   single channel). Matching them makes the cached path pixel-identical to
   the uncached one.

   Grayscale is also the right choice here on its own merits: subpixel AA
   bakes in one specific physical RGB-stripe layout, and a wallpaper gets
   scaled and recomposited by its host onto panels that may not have one.
   Cost of the alpha channel, measured: none outside noise. */
// Not const: Layer retargets every drawing helper at an offscreen canvas
// by swapping this for the duration of one repaint.
let ctx = canvas.getContext("2d", { alpha: true });
const screenCtx = ctx;
let VW = 0, VH = 0, DPR = 1;

function resize() {
  // Cap the device pixel ratio: as a wallpaper this may run full-screen on
  // a 4K panel, where rendering at 2x costs 4x the fill rate for detail
  // nobody looks at.
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  VW = Math.max(320, window.innerWidth);
  VH = Math.max(240, window.innerHeight);
  canvas.width = Math.round(VW * DPR);
  canvas.height = Math.round(VH * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.textBaseline = "middle";
  _cwCache.clear();
  _blockCache.clear();
  onResize();
}

/** The same shape as roundRect(), built once into a reusable Path2D.
 *  Panel frames are stroked and filled several times per frame but only
 *  change when the layout does, so they are built per layout, not per
 *  frame. */
function roundRectPath(x, y, w, h, r) {
  const p = new Path2D();
  if (p.roundRect) { p.roundRect(x, y, w, h, r); return p; }
  if (r > w / 2) r = w / 2;
  if (r > h / 2) r = h / 2;
  p.moveTo(x + r, y);
  p.arcTo(x + w, y, x + w, y + h, r);
  p.arcTo(x + w, y + h, x, y + h, r);
  p.arcTo(x, y + h, x, y, r);
  p.arcTo(x, y, x + w, y, r);
  p.closePath();
  return p;
}

// Rounded rectangle with a fallback for engines without ctx.roundRect.
function roundRect(x, y, w, h, r) {
  if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); return; }
  if (r > w / 2) r = w / 2;
  if (r > h / 2) r = h / 2;
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

// MAUI's DrawString(rect, align, VerticalAlignment.Center) equivalents.
// textBaseline stays "middle" for the whole run (set once at startup), so
// passing the rect's vertical centre matches MAUI's centred alignment.
function textL(s, x, y, h) { ctx.textAlign = "left";   ctx.fillText(s, x, y + h / 2); }
function textR(s, x, w, y, h) { ctx.textAlign = "right"; ctx.fillText(s, x + w, y + h / 2); }
function textC(s, x, w, y, h) { ctx.textAlign = "center"; ctx.fillText(s, x + w / 2, y + h / 2); }

/* ---------------------------------------------------------------------
   Layer — cached panel content

   These panels are redrawn at the frame rate, but almost nothing on them
   changes at the frame rate. A terminal emits a few lines a second, the
   hex dump eight rows, the code writer finishes a line about twice a
   second; the charts take a sample ten times a second. Repainting thirty
   or forty fillText calls sixty times a second for content that is
   character-for-character identical to the last frame was, measured, over
   80% of this wallpaper's cost.

   A Layer is an offscreen canvas covering one panel's rect. It repaints
   only when the panel invalidates it, and every other frame costs a
   single drawImage. The drawing code inside is completely unchanged: the
   layer carries the panel's own screen coordinates and swaps itself in as
   the global `ctx`, so textL/fade/charW and the rest behave exactly as
   they do when drawing live.

   Anything that genuinely does change every frame — the blinking cursor,
   the line currently being typed, the counters — stays out of the layer
   and is drawn live on top of it.

   The offscreen bitmap is aligned to whole device pixels and blitted at
   an integer device offset, so text lands on exactly the subpixel
   positions it would have landed on had it been drawn straight to the
   screen. Getting that wrong resamples the blit and visibly softens every
   glyph.
   ------------------------------------------------------------------ */
class Layer {
  constructor() {
    this.cv = null; this.cx = null;
    this.dx = 0; this.dy = 0; this.pw = 0; this.ph = 0;
    this.dirty = true;
  }
  invalidate() { this.dirty = true; }
  /** Repaints through fn(rect) if needed, then blits. `pad` widens the
   *  bitmap in CSS px, for strokes that spill outside the rect. */
  draw(r, fn, pad) {
    pad = pad || 0;
    const dx = Math.floor((r.x - pad) * DPR), dy = Math.floor((r.y - pad) * DPR);
    const pw = Math.ceil((r.w + pad * 2) * DPR) + 2;
    const ph = Math.ceil((r.h + pad * 2) * DPR) + 2;
    if (!this.cv) this.cv = document.createElement("canvas");
    if (this.pw !== pw || this.ph !== ph) {
      this.cv.width = pw; this.cv.height = ph;      // resizing also clears
      this.pw = pw; this.ph = ph;
      this.cx = this.cv.getContext("2d");
      this.dirty = true;
    }
    if (this.dx !== dx || this.dy !== dy) { this.dx = dx; this.dy = dy; this.dirty = true; }
    if (this.dirty) {
      this.dirty = false;
      const cx = this.cx;
      cx.setTransform(1, 0, 0, 1, 0, 0);
      cx.clearRect(0, 0, pw, ph);
      // Same scale as the screen, offset by whole device pixels, so a
      // point at CSS x lands at the same fraction of a pixel as on screen.
      cx.setTransform(DPR, 0, 0, DPR, -dx, -dy);
      cx.textBaseline = "middle";
      const prev = ctx;
      ctx = cx;
      try { fn(r); } finally { ctx = prev; }
    }
    ctx.drawImage(this.cv, dx / DPR, dy / DPR, pw / DPR, ph / DPR);
  }
}

/* ---------------------------------------------------------------------
   Panel base
   ------------------------------------------------------------------ */

const TITLE_BAR_H = 18, PAD = 6;

class Panel {
  constructor() {
    this.x = 0; this.y = 0; this.w = 0; this.h = 0;
    this.title = "";
    this.accent = T.Green;
    this._pulse = rnd() * Math.PI * 2;
    /* One cached bitmap per panel, holding the frame, the title bar and
       whatever part of the content is not changing this frame. Bound once:
       Layer takes a callback every frame, and binding per frame would
       allocate a closure per panel per frame. */
    this.layer = new Layer();
    this._paint = this.paint.bind(this);
    this._panelRect = { x: 0, y: 0, w: 0, h: 0 };
    this._glowQ = -1;
    // Panels whose content is entirely cached (the hex dump, the binary
    // stream) need no clip and no live pass at all — subclass prototypes
    // are in place by the time a base constructor runs, so this is known
    // here, once, rather than tested every frame.
    this._hasLive = this.drawLive !== Panel.prototype.drawLive;
    // Frame geometry, rebuilt only when the layout moves (see syncPaths).
    this._framePath = null; this._titlePath = null;
    this._px = NaN; this._py = NaN; this._pw = NaN; this._ph = NaN;
  }
  update(dt) {
    this._pulse += dt * 1.5;
    // fade() quantises alpha to 1/64, so the border glow only changes
    // colour about five times a second however smoothly its sine moves.
    // Repainting on those steps alone keeps the frame animated without
    // making the cache useless.
    const q = ((0.35 + 0.15 * Math.sin(this._pulse)) * 0.5 * 64) | 0;
    if (q !== this._glowQ) { this._glowQ = q; this.layer.invalidate(); }
  }
  /** The panel frame is filled once and stroked twice every frame, and the
   *  title bar filled once. Rebuilding those rounded rects each time — four
   *  path constructions per panel per frame, eight panels — was most of
   *  what the chrome cost. They only change when the layout does. */
  syncPaths() {
    if (this._px === this.x && this._py === this.y &&
        this._pw === this.w && this._ph === this.h) return;
    this._px = this.x; this._py = this.y; this._pw = this.w; this._ph = this.h;
    this._framePath = roundRectPath(this.x, this.y, this.w, this.h, 4);
    this._titlePath = roundRectPath(this.x, this.y, this.w, TITLE_BAR_H, 4);
  }
  contentRect() {
    const top = this.title ? TITLE_BAR_H + PAD / 2 : PAD;
    return {
      x: this.x + PAD, y: this.y + top,
      w: this.w - PAD * 2, h: this.h - top - PAD
    };
  }
  /** Painted into the layer: the frame, the title bar, and the part of the
   *  content that is stable between invalidations. */
  paint() {
    const b = this;
    ctx.fillStyle = PANEL_FILL;
    ctx.fill(this._framePath);

    // Neon border: soft outer glow stroke + crisp inner stroke. One path,
    // built per layout rather than three times per frame.
    const glow = 0.35 + 0.15 * Math.sin(this._pulse);
    ctx.lineWidth = 3;
    ctx.strokeStyle = fade(this.accent, glow * 0.5);
    ctx.stroke(this._framePath);
    ctx.lineWidth = 1;
    ctx.strokeStyle = fade(this.accent, 0.9);
    ctx.stroke(this._framePath);

    if (this.title) {
      ctx.fillStyle = fade(this.accent, 0.10);
      ctx.fill(this._titlePath);
      ctx.font = fontMonoBold(10);
      ctx.fillStyle = this.accent.css;
      textL("┃ " + this.title, b.x + 6, b.y, TITLE_BAR_H);
    }

    const r = this.contentRect();
    ctx.save();
    ctx.beginPath();
    ctx.rect(r.x, r.y, r.w, r.h);
    ctx.clip();
    this.drawStatic(r);
    ctx.restore();
  }
  render() {
    const b = this;
    if (b.w < 20 || b.h < 20) return;
    this.syncPaths();

    const pr = this._panelRect;
    pr.x = b.x; pr.y = b.y; pr.w = b.w; pr.h = b.h;
    this.layer.draw(pr, this._paint, 3);

    if (this._hasLive) {
      const r = this.contentRect();
      ctx.save();
      ctx.beginPath();
      ctx.rect(r.x, r.y, r.w, r.h);
      ctx.clip();
      this.drawLive(r);
      ctx.restore();
    }

    // The title dot blinks about six times a second — too fast to be worth
    // a repaint of the panel, and one arc is cheaper than one anyway.
    if (this.title) {
      const dotA = 0.4 + 0.6 * Math.abs(Math.sin(this._pulse * 2));
      ctx.fillStyle = fade(this.accent, dotA);
      ctx.beginPath();
      ctx.arc(b.x + b.w - 10, b.y + TITLE_BAR_H / 2, 2.5, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  /** Content that changes only when the panel says so. */
  drawStatic(_r) {}
  /** Content that genuinely changes every frame. */
  drawLive(_r) {}
}

/* ---------------------------------------------------------------------
   Wallpaper layer
   ------------------------------------------------------------------ */

// Blur tap offsets in units of the soften radius (mirrors BackgroundLayer).
const AXIAL_TAPS = [[-1,0],[1,0],[0,-1],[0,1]];
const RING_TAPS = [[-1,0],[1,0],[0,-1],[0,1],[-0.7,-0.7],[0.7,-0.7],[-0.7,0.7],[0.7,0.7]];

class BackgroundLayer {
  constructor(key) {
    this.key = key;
    const e = BG_ENTRIES[key] || {};
    this.s = Object.assign({}, BG_DEFAULT, e);
    this.tint = this.s.tint === "blue" ? T.Blue : this.s.tint === "green" ? T.Green : T.Cyan;
    this.backdrop = this.s.backdrop;
    this.image = null;
    this._baked = null;       // pre-composited blurred wallpaper
    this._bakedPad = 0;
    this._overlay = null;     // pre-composited scrim + tint + edge falloff
    this._time = 0;
    this._dirty = true;

    const img = new Image();
    const self = this;
    img.onload = function () { self.image = img; self._dirty = true; };
    img.decoding = "async";
    img.src = "assets/backgrounds/" + (this.s.file || (key + BG_EXT));
  }

  update(dt) { this._time += dt; }
  invalidate() { this._dirty = true; }

  // The MAUI build composites 9 image copies every frame to fake a blur.
  // That is 9 full-screen textured draws at 60fps, which a wallpaper cannot
  // afford — so the identical composite is baked once into an offscreen
  // canvas and blitted with a single drawImage per frame instead.
  _bake() {
    this._dirty = false;
    this._baked = null;
    this._overlay = null;
    if (!this.image || !VW || !VH) return;

    const iw = this.image.naturalWidth, ih = this.image.naturalHeight;
    if (!iw || !ih) return;

    const s = this.s;
    const fit = s.fit === "contain"
      ? Math.min(VW / iw, VH / ih)
      : Math.max(VW / iw, VH / ih);
    const scale = Math.min(fit * s.zoom, s.maxScale);
    this._w = iw * scale;
    this._h = ih * scale;

    const pad = s.soften > 0.5 ? Math.ceil(s.soften) + 2 : 0;
    this._bakedPad = pad;

    const bc = document.createElement("canvas");
    bc.width = Math.max(1, Math.ceil(this._w + pad * 2));
    bc.height = Math.max(1, Math.ceil(this._h + pad * 2));
    const bx = bc.getContext("2d");

    if (s.soften > 0.5) {
      const taps = s.soften > 2.5 ? RING_TAPS : AXIAL_TAPS;
      bx.globalAlpha = s.opacity * (taps.length === 8 ? 0.20 : 0.35);
      for (let i = 0; i < taps.length; i++) {
        bx.drawImage(this.image, pad + taps[i][0] * s.soften, pad + taps[i][1] * s.soften, this._w, this._h);
      }
    }
    bx.globalAlpha = s.opacity;
    bx.drawImage(this.image, pad, pad, this._w, this._h);
    bx.globalAlpha = 1;
    this._baked = bc;

    // Scrim + palette tint + edge falloff are screen-fixed and never move,
    // so they bake into one screen-sized RGBA overlay drawn in a single call.
    const oc = document.createElement("canvas");
    oc.width = Math.max(1, Math.round(VW));
    oc.height = Math.max(1, Math.round(VH));
    const ox = oc.getContext("2d");
    ox.fillStyle = fade(T.Black, s.scrim);
    ox.fillRect(0, 0, VW, VH);
    ox.fillStyle = fade(this.tint, s.tintStrength);
    ox.fillRect(0, 0, VW, VH);
    ox.save();
    ox.translate(VW / 2, VH / 2);
    ox.scale(VW, VH);
    const g = ox.createRadialGradient(0, 0, 0, 0, 0, 0.8);
    g.addColorStop(0, "rgba(0,0,0,0)");
    g.addColorStop(0.55, "rgba(0,0,0,0)");
    g.addColorStop(1, "rgba(0,0,0,0.35)");
    ox.fillStyle = g;
    ox.fillRect(-0.5, -0.5, 1, 1);
    ox.restore();
    this._overlay = oc;
  }

  draw(glitch) {
    if (this._dirty) this._bake();
    if (!this._baked) return;

    const s = this.s, w = this._w, h = this._h;
    let x, y;
    if (w >= VW && h >= VH) {
      // Cover: pan within the overflow, never far enough to expose an edge.
      const slackX = w - VW, slackY = h - VH;
      x = -slackX * s.focalX + Math.sin(this._time * 0.061) * Math.min(s.drift, slackX * 0.5);
      y = -slackY * s.focalY + Math.cos(this._time * 0.043) * Math.min(s.drift, slackY * 0.5);
    } else {
      // Contained: smaller than the screen, so it is placed by focal point
      // and free to drift — the art already sits on black.
      x = (VW - w) * s.focalX + Math.sin(this._time * 0.061) * s.drift;
      y = (VH - h) * s.focalY + Math.cos(this._time * 0.043) * s.drift;
    }
    x += glitch * 6;

    const p = this._bakedPad;
    ctx.drawImage(this._baked, x - p, y - p);
    if (this._overlay) ctx.drawImage(this._overlay, 0, 0);
  }
}

const BG_KEYS = Object.keys(BG_ENTRIES);

/* ---------------------------------------------------------------------
   Panels
   ------------------------------------------------------------------ */

/** Continuously scrolling fake terminal with a normal/paused/burst state
 *  machine so multiple terminals never scroll in lockstep. */
class TerminalPanel extends Panel {
  constructor(title, accent, generator, baseRate, fontSize) {
    super();
    this.title = title;
    this.accent = accent;
    this.gen = generator;
    this.fontSize = fontSize || 11;
    this.baseRate = (baseRate || 4) * (0.7 + rnd() * 0.8);
    this.lines = [];
    this.mode = 0;                 // 0 normal, 1 paused, 2 burst
    this.modeTimer = 2 + rnd() * 5;
    this.acc = 0;
    for (let i = 0; i < 20; i++) this.emit();
  }
  emit() {
    const l = this.gen();
    this.lines.push(l);
    if (this.lines.length > 90) this.lines.splice(0, this.lines.length - 90);
    // Every line's age-fade shifts when a new one arrives, so the whole
    // block genuinely is stale — but only a few times a second.
    this.layer.invalidate();
  }
  update(dt) {
    super.update(dt);
    this.modeTimer -= dt;
    if (this.modeTimer <= 0) {
      const roll = rndInt(100);
      if (roll < 12)      { this.mode = 1; this.modeTimer = 1.0 + rnd() * 2.5; }
      else if (roll < 30) { this.mode = 2; this.modeTimer = 0.6 + rnd() * 1.6; }
      else                { this.mode = 0; this.modeTimer = 2.0 + rnd() * 6.0; }
    }
    const rate = this.mode === 1 ? 0 : this.mode === 2 ? this.baseRate * 10 : this.baseRate;
    this.acc += rate * dt;
    while (this.acc >= 1) { this.acc -= 1; this.emit(); }
  }
  drawStatic(r) {
    const fs = this.fontSize;
    ctx.font = fontMono(fs);
    const lh = lineHeight(fs);
    const cw = charW(fs);
    const visible = Math.max(1, (r.h / lh) | 0);
    const start = Math.max(0, this.lines.length - visible);
    const maxChars = Math.max(8, (r.w / cw) | 0);

    let y = r.y + r.h - lh;
    for (let i = this.lines.length - 1; i >= start; i--, y -= lh) {
      const line = this.lines[i];
      const text = line.t.length > maxChars ? line.t.slice(0, maxChars) : line.t;
      // Newest lines are brightest; older ones fade slightly.
      const age = (this.lines.length - 1 - i) / visible;
      ctx.fillStyle = fade(kindColor(line.k), 1 - age * 0.55);
      textL(text, r.x, y, lh);
    }
  }
  drawLive(r) {
    // Blinks twice a second; caching it would mean repainting every line
    // on this panel twice a second for one small rectangle.
    if (this.mode !== 1 && (Date.now() % 1000) < 500) {
      ctx.fillStyle = this.accent.css;
      ctx.fillRect(r.x, r.y + r.h - 3, charW(this.fontSize), 2.5);
    }
  }
}

/** Fake hex viewer: offset column, hex bytes, ASCII column. */
class HexPanel extends Panel {
  constructor() {
    super();
    this.title = "MEMORY INSPECTOR";
    this.accent = T.Cyan;
    this.rows = [];
    this.rate = 5 + rnd() * 6;
    this.offset = rndInt(1 << 20) * 16;
    this.acc = 0;
    for (let i = 0; i < 30; i++) this.emit();
  }
  emit() {
    let hex = "", ascii = "";
    for (let i = 0; i < 8; i++) {
      const b = (rnd() * 256) | 0;
      hex += HEXD[(b >> 4) & 15] + HEXD[b & 15] + " ";
      ascii += (b >= 33 && b <= 126) ? String.fromCharCode(b) : ".";
    }
    let off = this.offset.toString(16).toUpperCase();
    if (off.length < 8) off = "0".repeat(8 - off.length) + off;
    this.rows.push({ t: "0x" + off + "  " + hex + " " + ascii, hl: rndInt(100) < 6 });
    if (this.rows.length > 60) this.rows.splice(0, this.rows.length - 60);
    this.offset += 8;
    this.layer.invalidate();
  }
  update(dt) {
    super.update(dt);
    this.acc += this.rate * dt;
    while (this.acc >= 1) { this.acc -= 1; this.emit(); }
  }
  drawStatic(r) {
    ctx.font = fontMono(10);
    const lh = lineHeight(10);
    const visible = Math.max(1, (r.h / lh) | 0);
    const start = Math.max(0, this.rows.length - visible);
    let y = r.y + r.h - lh;
    for (let i = this.rows.length - 1; i >= start; i--, y -= lh) {
      const row = this.rows[i];
      if (row.hl) {
        ctx.fillStyle = fade(T.Cyan, 0.14);
        ctx.fillRect(r.x, y + 2, r.w, lh - 2);
        ctx.fillStyle = T.White.css;
      } else {
        ctx.fillStyle = T.DimCyan.css;
      }
      textL(row.t, r.x, y, lh);
    }
  }
}

/** Binary stream with occasional highlighted (orange) segments. */
class BinaryPanel extends Panel {
  constructor() {
    super();
    this.title = "RAW STREAM";
    this.accent = T.DimGreen;
    this.rows = [];
    this.rate = 8 + rnd() * 8;
    this.acc = 0;
    this.cols = 48;
  }
  emit() {
    let s = "";
    for (let i = 0; i < this.cols; i++) s += (rnd() < 0.5 ? "0" : "1");
    let hs = -1, hl = 0;
    if (rndInt(100) < 18) {
      hl = rndInt(4, 14);
      hs = rndInt(0, Math.max(1, this.cols - hl));
    }
    this.rows.push({ b: s, hs: hs, hl: hl });
    if (this.rows.length > 40) this.rows.splice(0, this.rows.length - 40);
    this.layer.invalidate();
  }
  update(dt) {
    super.update(dt);
    this.acc += this.rate * dt;
    while (this.acc >= 1) { this.acc -= 1; this.emit(); }
  }
  drawStatic(r) {
    const cw = charW(10);
    // Column count feeds emit() too. It depends only on the panel width,
    // which cannot change without a resize, and a resize invalidates.
    this.cols = Math.max(16, (r.w / cw) | 0);
    ctx.font = fontMono(10);
    const lh = lineHeight(10) * 0.9;
    const visible = Math.max(1, (r.h / lh) | 0);
    const start = Math.max(0, this.rows.length - visible);
    let y = r.y + r.h - lh;
    const dim = fade(T.DimGreen, 0.75);
    for (let i = this.rows.length - 1; i >= start; i--, y -= lh) {
      const row = this.rows[i];
      const bits = row.b.length > this.cols ? row.b.slice(0, this.cols) : row.b;
      ctx.fillStyle = dim;
      textL(bits, r.x, y, lh);
      // Redraw the highlighted slice in orange on top; monospace keeps the
      // overlay in register with the base text.
      if (row.hs >= 0 && row.hs + row.hl <= bits.length) {
        const x = r.x + row.hs * cw;
        ctx.fillStyle = fade(T.Orange, 0.15);
        ctx.fillRect(x - 1, y + 2, row.hl * cw + 2, lh - 2);
        ctx.fillStyle = T.Orange.css;
        textL(bits.substr(row.hs, row.hl), x, y, lh);
      }
    }
  }
}

/** Smoothly animating line charts plus an optional strip of counters. */
const GRAPH_CATALOG = [
  ["CPU LOAD", "%", T.Green], ["MEMORY", "%", T.Cyan], ["BANDWIDTH", "Gb/s", T.Blue],
  ["REQ RATE", "k/s", T.Orange], ["SIGNAL", "dB", T.Green], ["LATENCY", "ms", T.Cyan],
  ["NODE COUNT", "", T.Blue]
];
const HISTORY_LEN = 110, SAMPLE_INTERVAL = 0.10;

class GraphPanel extends Panel {
  constructor(count, horizontal, counters) {
    super();
    this.title = "TELEMETRY";
    this.accent = T.Blue;
    this.horizontal = !!horizontal;

    this.counters = takeShuffled(RD.StatDefs, counters || 0).map(function (d) {
      const start = d[1] + rnd() * (d[2] - d[1]);
      return { label: d[0], min: d[1], max: d[2], value: start, target: start, retarget: rnd() * 2, trend: 0 };
    });

    this.series = takeShuffled(GRAPH_CATALOG, count).map(function (p) {
      const v = 0.3 + rnd() * 0.4;
      const s = {
        label: p[0], unit: p[1], color: p[2],
        history: new Float32Array(HISTORY_LEN), head: 0,
        value: v, target: rnd(), retarget: rnd() * 2,
        wobble: rnd() * Math.PI * 2, sampleAcc: 0
      };
      s.history.fill(v);
      return s;
    });
  }
  update(dt) {
    super.update(dt);
    for (let i = 0; i < this.series.length; i++) {
      const s = this.series[i];
      s.retarget -= dt;
      if (s.retarget <= 0) {
        s.target = 0.08 + rnd() * 0.84;
        s.retarget = 1.5 + rnd() * 4.0;
      }
      // Smooth pursuit of the target + gentle wobble.
      s.wobble += dt * (1.2 + rnd() * 0.3);
      s.value += (s.target - s.value) * Math.min(1, dt * 1.8);
      const display = clamp(s.value + Math.sin(s.wobble) * 0.045, 0.02, 0.98);
      s.sampleAcc += dt;
      while (s.sampleAcc >= SAMPLE_INTERVAL) {
        s.sampleAcc -= SAMPLE_INTERVAL;
        s.history[s.head] = display;
        s.head = (s.head + 1) % HISTORY_LEN;
        // The plotted line and its readout both come from the history
        // buffer, so they change ten times a second, not sixty.
        this.layer.invalidate();
      }
    }
    for (let i = 0; i < this.counters.length; i++) {
      const c = this.counters[i];
      c.retarget -= dt;
      if (c.retarget <= 0) {
        const span = (c.max - c.min) * (0.02 + rnd() * 0.12);
        c.target = clamp(c.target + (rndInt(2) === 0 ? -span : span), c.min, c.max);
        c.retarget = 0.8 + rnd() * 2.5;
        c.trend = Math.sign(c.target - c.value);
      }
      c.value += (c.target - c.value) * Math.min(1, dt * 2.2);
    }
  }
  // Counters pursue their targets continuously, so their digits can
  // change on any frame — they are drawn live over the cached charts.
  drawLive(r) {
    if (this.counters.length > 0) {
      const cw = Math.min(130, r.w * 0.26);
      this.drawCounters({ x: r.x + r.w - cw, y: r.y, w: cw, h: r.h });
    }
  }
  drawStatic(r) {
    let chart = r;
    if (this.counters.length > 0) {
      const cw = Math.min(130, r.w * 0.26);
      chart = { x: r.x, y: r.y, w: r.w - cw - 10, h: r.h };
    }
    if (this.horizontal) {
      const slotW = chart.w / this.series.length;
      for (let i = 0; i < this.series.length; i++)
        this.drawSeries(this.series[i], { x: chart.x + i * slotW, y: chart.y, w: slotW - 8, h: chart.h });
    } else {
      const slotH = chart.h / this.series.length;
      for (let i = 0; i < this.series.length; i++)
        this.drawSeries(this.series[i], { x: chart.x, y: chart.y + i * slotH, w: chart.w, h: slotH - 4 });
    }
  }
  drawCounters(r) {
    const cellH = r.h / this.counters.length;
    for (let i = 0; i < this.counters.length; i++) {
      const c = this.counters[i];
      const y = r.y + i * cellH;
      ctx.font = fontMono(8.5);
      ctx.fillStyle = T.Gray.css;
      textL(c.label, r.x, y + 1, 10);
      const arrow = c.trend > 0 ? "▲" : c.trend < 0 ? "▼" : " ";
      ctx.fillStyle = (c.trend >= 0 ? T.Green : T.Orange).css;
      textR(arrow, r.x, r.w - 2, y + 1, 10);
      ctx.font = fontMonoBold(14);
      ctx.fillStyle = T.White.css;
      textL(uiInt(Math.trunc(c.value)), r.x, y + 11, cellH - 12);
    }
  }
  drawSeries(s, r) {
    const labelH = 13;
    const cx = r.x, cy = r.y + labelH, cw = r.w, ch = r.h - labelH;

    ctx.font = fontMonoBold(9.5);
    ctx.fillStyle = s.color.css;
    textL(s.label, r.x, r.y, labelH);

    const cur = s.history[(s.head + HISTORY_LEN - 1) % HISTORY_LEN];
    let valueText;
    switch (s.unit) {
      case "%":    valueText = uiFix(cur * 100, 1) + "%"; break;
      case "ms":   valueText = uiFix(cur * 240 + 4, 1) + " ms"; break;
      case "dB":   valueText = uiFix(-20 - (1 - cur) * 60, 1) + " dB"; break;
      case "Gb/s": valueText = uiFix(cur * 38, 2) + " Gb/s"; break;
      case "k/s":  valueText = uiInt(cur * 840) + " k/s"; break;
      default:     valueText = uiInt(cur * 4200);
    }
    ctx.fillStyle = T.White.css;
    textR(valueText, r.x, r.w, r.y, labelH);

    // Faint grid
    ctx.lineWidth = 0.5;
    ctx.strokeStyle = fade(T.DimGray, 0.5);
    ctx.beginPath();
    for (let g = 1; g < 3; g++) {
      const gy = Math.round(cy + ch * g / 3) + 0.5;
      ctx.moveTo(cx, gy); ctx.lineTo(cx + cw, gy);
    }
    ctx.stroke();

    // Polyline, oldest → newest, with a translucent fill beneath it.
    const stepX = cw / (HISTORY_LEN - 1);
    ctx.beginPath();
    for (let i = 0; i < HISTORY_LEN; i++) {
      const v = s.history[(s.head + i) % HISTORY_LEN];
      const x = cx + i * stepX, y = cy + ch - v * ch;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.save();
    ctx.lineTo(cx + cw, cy + ch);
    ctx.lineTo(cx, cy + ch);
    ctx.closePath();
    ctx.fillStyle = fade(s.color, 0.10);
    ctx.fill();
    ctx.restore();

    // Glow pass then crisp pass.
    ctx.beginPath();
    for (let i = 0; i < HISTORY_LEN; i++) {
      const v = s.history[(s.head + i) % HISTORY_LEN];
      const x = cx + i * stepX, y = cy + ch - v * ch;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.lineWidth = 3;
    ctx.strokeStyle = fade(s.color, 0.22);
    ctx.stroke();
    ctx.lineWidth = 1.2;
    ctx.strokeStyle = s.color.css;
    ctx.stroke();
  }
}

/** Fake progress bars: some complete, some fail, some loop forever. */
const BAR_RUNNING = 0, BAR_COMPLETED = 1, BAR_FAILED = 2, BAR_RESTARTING = 3;

class ProgressPanel extends Panel {
  constructor() {
    super();
    this.title = "TASK PIPELINE";
    this.accent = T.Green;
    this.bars = [];
    for (let i = 0; i < 6; i++) this.bars.push(this.newBar());
  }
  newBar() {
    const bar = {
      label: RD.progressLabel(),
      progress: rnd() * 0.2,
      speed: 0.04 + rnd() * 0.25,
      failAt: 2,
      endless: rndInt(100) < 15,
      state: BAR_RUNNING,
      timer: 0,
      status: statusWordFor(0)
    };
    if (!bar.endless && rndInt(100) < 25) bar.failAt = 0.3 + rnd() * 0.65;  // doomed
    return bar;
  }
  update(dt) {
    super.update(dt);
    for (let i = 0; i < this.bars.length; i++) {
      const bar = this.bars[i];
      switch (bar.state) {
        case BAR_RUNNING:
          bar.progress += bar.speed * dt * (0.6 + rnd() * 0.8);
          bar.status = statusWordFor(bar.progress);
          if (bar.progress >= bar.failAt) {
            bar.state = BAR_FAILED;
            bar.timer = 1.5 + rnd() * 1.5;
            bar.status = "FAILED";
          } else if (bar.progress >= 1) {
            bar.progress = 1;
            if (bar.endless) {
              bar.progress = 0;   // silent loop
              // Without this, "endless" is an absorbing state: every restart
              // can become endless and endless bars never leave, so slots
              // eventually freeze on the same labels forever.
              if (rndInt(100) < 35) {
                const next = this.newBar();
                bar.label = next.label; bar.speed = next.speed;
                bar.failAt = next.failAt; bar.endless = next.endless;
              }
            } else {
              bar.state = BAR_COMPLETED;
              bar.timer = 1.2 + rnd() * 2.0;
              bar.status = "Completed";
            }
          }
          break;
        case BAR_COMPLETED:
        case BAR_FAILED:
          bar.timer -= dt;
          if (bar.timer <= 0) {
            bar.state = BAR_RESTARTING;
            bar.timer = 0.4 + rnd() * 0.8;
            bar.status = "Restarting...";
          }
          break;
        case BAR_RESTARTING:
          bar.timer -= dt;
          if (bar.timer <= 0) {
            const fresh = this.newBar();
            bar.label = fresh.label; bar.progress = 0; bar.speed = fresh.speed;
            bar.failAt = fresh.failAt; bar.endless = fresh.endless;
            bar.state = BAR_RUNNING;
            bar.status = statusWordFor(0);
          }
          break;
      }
    }
  }
  // Bars advance every frame, so this panel draws live over its cached
  // frame. It is cheap: six short strings and a dozen rectangles.
  drawLive(r) {
    let rowH = 30;
    const slots = Math.max(1, (r.h / rowH) | 0);
    rowH = r.h / slots;
    const n = Math.min(slots, this.bars.length);
    for (let i = 0; i < n; i++) {
      this.drawBar(this.bars[i], { x: r.x, y: r.y + i * rowH, w: r.w, h: rowH - 4 });
    }
  }
  drawBar(bar, r) {
    const color = bar.state === BAR_FAILED ? T.Red
                : bar.state === BAR_COMPLETED ? T.Green
                : bar.state === BAR_RESTARTING ? T.Orange : T.Green;

    ctx.font = fontMono(10.5 * 0.85);
    ctx.fillStyle = T.Gray.css;
    textL(bar.label, r.x, r.y, 12);
    ctx.fillStyle = color.css;
    const right = bar.state === BAR_RUNNING
      ? bar.status + " " + Math.round(bar.progress * 100) + "%"
      : bar.status;
    textR(right, r.x, r.w, r.y, 12);

    // Block-character bar, movie style: ██████░░░░░
    //
    // Drawn as rectangles rather than text: Chrome substitutes a fallback
    // font for ░ whose glyph is ~25px tall at this size (vs 12px for █),
    // so the shaded run would bleed over the label above it. The geometry
    // below is taken from the █ glyph box, so it matches the MAUI build
    // exactly — and it drops the per-frame string building too.
    const cw = charW(10.5);
    const cells = Math.max(8, ((r.w / cw) | 0) - 1);
    const filled = Math.round(clamp(bar.progress, 0, 1) * cells);
    const bm = blockMetrics(10.5);
    const midY = r.y + 12 + (r.h - 12) / 2;
    const top = midY - bm.asc, hgt = bm.asc + bm.desc;
    const css = bar.state === BAR_FAILED ? T.DimRed.css : fade(color, 0.9);
    if (filled > 0) {
      ctx.fillStyle = css;
      ctx.fillRect(r.x, top, filled * cw, hgt);
    }
    if (cells - filled > 0) {
      ctx.fillStyle = ditherPattern(css);
      ctx.fillRect(r.x + filled * cw, top, (cells - filled) * cw, hgt);
    }
  }
}
function statusWordFor(p) {
  return p < 0.35 ? "Synchronizing..." : p < 0.70 ? "Verifying..."
       : p < 0.95 ? "Optimizing..." : "Finalizing...";
}

/** Parody centrepiece: logo, fake analysis steps, then BREACHED. */
const PH_INTRO = 0, PH_WORKING = 1, PH_BREACHED = 2, PH_FADEOUT = 3;
const INTRO_DUR = 1.2, BREACH_DUR = 3.2, FADEOUT_DUR = 0.5;

class CompanyPanel extends Panel {
  constructor() {
    super();
    this.title = "TARGET ACQUISITION";
    this.accent = T.Red;
    this.deck = shuffled(COMPANIES);
    this.index = 0;
    this.phase = PH_INTRO;
    this.phaseTime = 0;
    this.phaseDuration = INTRO_DUR;
    this.steps = [];
    this.stepIndex = 0;
    this.stepProgress = 0;
    this.stepSpeed = 1;
    this.prepare();
  }
  get current() { return this.deck[this.index]; }
  prepare() {
    this.steps = takeShuffled(RD.CompanySteps, 5 + rndInt(4));
    this.stepIndex = 0;
    this.stepProgress = 0;
    this.stepSpeed = 0.6 + rnd() * 1.6;
  }
  setPhase(p, d) { this.phase = p; this.phaseTime = 0; this.phaseDuration = d; }
  update(dt) {
    super.update(dt);
    this.phaseTime += dt;
    switch (this.phase) {
      case PH_INTRO:
        if (this.phaseTime >= this.phaseDuration) this.setPhase(PH_WORKING, 0);
        break;
      case PH_WORKING:
        this.stepProgress += this.stepSpeed * dt * (0.7 + rnd() * 0.6);
        if (this.stepProgress >= 1) {
          this.stepProgress = 0;
          this.stepSpeed = 0.6 + rnd() * 1.6;
          this.stepIndex++;
          if (this.stepIndex >= this.steps.length) {
            this.setPhase(PH_BREACHED, BREACH_DUR);
            // Warm the next logo now so it is decoded by the time its intro
            // fades in, instead of flashing the monogram for a frame or two.
            if (this.index + 1 < this.deck.length) Logos.get(this.deck[this.index + 1]);
          }
        }
        break;
      case PH_BREACHED:
        if (this.phaseTime >= this.phaseDuration) this.setPhase(PH_FADEOUT, FADEOUT_DUR);
        break;
      case PH_FADEOUT:
        if (this.phaseTime >= this.phaseDuration) {
          Logos.release(this.current);
          this.index++;
          if (this.index >= this.deck.length) { this.deck = shuffled(COMPANIES); this.index = 0; }
          this.prepare();
          this.setPhase(PH_INTRO, INTRO_DUR);
        }
        break;
    }
  }
  // Logo alpha, step progress and the breach blink all move every frame,
  // so nothing here is worth caching; the panel frame behind it still is.
  drawLive(r) {
    const company = this.current;
    const t = this.phaseTime;
    const alpha = this.phase === PH_INTRO ? clamp(t / INTRO_DUR, 0, 1)
                : this.phase === PH_FADEOUT ? 1 - clamp(t / FADEOUT_DUR, 0, 1) : 1;
    const breached = this.phase === PH_BREACHED || this.phase === PH_FADEOUT;

    const logoSize = Math.min(r.h * 0.42, r.w * 0.35);
    const logoX = r.x + r.w / 2 - logoSize / 2;
    const logoY = r.y + 8 + (1 - alpha) * 14;   // slides up during intro
    const logo = { x: logoX, y: logoY, w: logoSize, h: logoSize };
    const brand = breached ? grayscale(company.accent) : company.accent;

    const image = Logos.get(company);
    if (image) {
      // Fit inside the square, preserving aspect — wordmark logos are far
      // wider than tall and would otherwise be stretched square.
      const fit = Math.min(logo.w / image.naturalWidth, logo.h / image.naturalHeight);
      const iw = image.naturalWidth * fit, ih = image.naturalHeight * fit;
      ctx.globalAlpha = alpha * (breached ? 0.45 : 1);
      ctx.drawImage(image, logo.x + logo.w / 2 - iw / 2, logo.y + logo.h / 2 - ih / 2, iw, ih);
      ctx.globalAlpha = 1;
    } else {
      // Procedural monogram.
      ctx.fillStyle = fade(brand, 0.16 * alpha);
      roundRect(logo.x, logo.y, logo.w, logo.h, logoSize * 0.18); ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = fade(brand, 0.9 * alpha);
      roundRect(logo.x, logo.y, logo.w, logo.h, logoSize * 0.18); ctx.stroke();
      ctx.font = fontMonoBold(logoSize * 0.42);
      ctx.fillStyle = fade(brand, alpha);
      textC(company.initials, logo.x, logo.w, logo.y, logo.h);
    }

    ctx.font = fontMonoBold(Math.min(22, r.w / (company.name.length * 0.75)));
    ctx.fillStyle = fade(breached ? T.Gray : T.White, alpha);
    textC(company.name.toUpperCase(), r.x, r.w, logo.y + logo.h + 4, 26);

    const bodyY = logo.y + logo.h + 34;
    if (this.phase === PH_WORKING || this.phase === PH_INTRO) this.drawSteps(r, bodyY, alpha);
    else this.drawBreach(r, logo, bodyY, alpha);
  }
  drawSteps(r, y, alpha) {
    const lineH = 17;
    const bottom = r.y + r.h;
    ctx.font = fontMono(11);
    const firstShown = Math.max(0, this.stepIndex - (((bottom - y) / lineH) | 0) + 2);
    for (let i = firstShown; i < this.stepIndex && y < bottom - lineH; i++, y += lineH) {
      ctx.fillStyle = fade(T.DimGreen, alpha);
      textL("✔ " + this.steps[i], r.x + 10, y, lineH);
    }
    if (this.phase !== PH_WORKING || this.stepIndex >= this.steps.length) return;

    ctx.fillStyle = fade(T.Cyan, alpha);
    textL("▸ " + this.steps[this.stepIndex], r.x + 10, y, lineH);
    y += lineH;

    if (y < bottom - 12) {
      const barW = r.w - 40, bx = r.x + 20, by = y + 3;
      ctx.lineWidth = 1;
      ctx.strokeStyle = fade(T.Cyan, 0.5 * alpha);
      ctx.strokeRect(bx + 0.5, by + 0.5, barW - 1, 7 - 1);
      ctx.fillStyle = fade(T.Cyan, 0.85 * alpha);
      ctx.fillRect(bx + 1, by + 1, (barW - 2) * this.stepProgress, 5);
      ctx.font = fontMono(9);
      ctx.fillStyle = fade(T.Cyan, 0.8 * alpha);
      textR(Math.round(this.stepProgress * 100) + "%", r.x, r.w - 20, y + 12, 12);
    }
  }
  drawBreach(r, logo, y, alpha) {
    // Big red X across the logo.
    const inset = logo.w * 0.1;
    const x1 = logo.x + inset, y1 = logo.y + inset;
    const x2 = logo.x + logo.w - inset, y2 = logo.y + logo.h - inset;
    ctx.beginPath();
    ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
    ctx.moveTo(x2, y1); ctx.lineTo(x1, y2);
    ctx.lineWidth = 7; ctx.strokeStyle = fade(T.Red, 0.35 * alpha); ctx.stroke();
    ctx.lineWidth = 4; ctx.strokeStyle = fade(T.Red, alpha); ctx.stroke();

    const blink = 0.72 + 0.28 * Math.sin(this.phaseTime * 9);
    const bottom = r.y + r.h;
    const bh = Math.max(30, Math.min(44, bottom - y - 6));
    if (bh < 22) return;
    const bx = r.x + 14, bw = r.w - 28;

    ctx.fillStyle = fade(T.Red, 0.12 * alpha);
    roundRect(bx, y, bw, bh, 4); ctx.fill();
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = fade(T.Red, blink * alpha);
    roundRect(bx, y, bw, bh, 4); ctx.stroke();

    }
  }

function drawShellCursor(x, y, cw, lh) {
  if ((Date.now() % 1000) >= 500) return;

// ShellColor → Theme
const SC_DEFAULT = 0, SC_DIM = 1, SC_WHITE = 2, SC_GREEN = 3, SC_RED = 4, SC_ORANGE = 5, SC_CYAN = 6;
const SHELL_COLORS = [
  fade(T.White, 0.72), T.Gray.css, T.White.css, T.Green.css, T.Red.css, T.Orange.css, T.Cyan.css
];

};

SD.fileDate = function () {

// Output-script helpers. L appends a line after a delay; R replaces the
// previous line (carriage-return style progress updates).
function L(o, d, t, c) { o.push({ d: d, t: t, c: c || 0, r: false }); }
function R(o, d, t, c) { o.push({ d: d, t: t, c: c || 0, r: true }); }
/** ASCII progress bar in the docker/wget style: [====>   ]. */
function bar(frac, width) {
  frac = clamp(frac, 0, 1);
  const fill = Math.round(frac * width);
  if (fill >= width) return "[" + rep("=", width) + "]";
  if (fill <= 0) return "[" + rep(" ", width) + "]";
  return "[" + rep("=", fill - 1) + ">" + rep(" ", width - fill) + "]";
}
function n1i(v) {                                   // "N1", invariant
  const p = v.toFixed(1).split(".");
  return p[0].replace(/\B(?=(\d{3})+(?!\d))/g, ",") + "." + p[1];
}

/** ping — replies trickle in ~1 s apart, with occasional silent loss. */
class PingCommand {
  build() {
    this.host = SD.host(); this.ip = SD.ip(); this.count = 3 + rndInt(3);
    return "ping -c " + this.count + " " + this.host;
  }
  run() {
    const o = [];
    L(o, 0.15, "PING " + this.host + " (" + this.ip + ") 56(84) bytes of data.");
    const ttl = 58 + rndInt(7), baseMs = 3 + rnd() * 35;
    let received = 0, min = Infinity, max = 0, sum = 0;
    let pending = 0.2 + rnd() * 0.3;
    for (let seq = 1; seq <= this.count; seq++) {
      if (rndInt(100) < 6) { pending += 1.0; continue; }   // lost: just silence
      const ms = Math.max(0.4, baseMs + (rnd() - 0.5) * 4);
      received++;
      if (ms < min) min = ms;
      if (ms > max) max = ms;
      sum += ms;
      L(o, pending, "64 bytes from " + this.ip + ": icmp_seq=" + seq + " ttl=" + ttl + " time=" + ms.toFixed(1) + " ms");
      pending = 0.85 + rnd() * 0.3;
    }
    const loss = Math.round(100 * (this.count - received) / this.count);
    const avg = received > 0 ? sum / received : 0;
    L(o, 0.25, "");
    L(o, 0.02, "--- " + this.host + " ping statistics ---");
    L(o, 0.02, this.count + " packets transmitted, " + received + " received, " + loss +
      "% packet loss, time " + ((this.count - 1) * 1000 + rndInt(20, 90)) + "ms", loss > 0 ? SC_ORANGE : SC_DEFAULT);
    if (received > 0)
      L(o, 0.02, "rtt min/avg/max/mdev = " + min.toFixed(3) + "/" + avg.toFixed(3) + "/" +
        max.toFixed(3) + "/" + ((max - min) / 3).toFixed(3) + " ms");
    return o;
  }
}

/** wget — one self-updating progress line. */
class WgetCommand {
  build() {
    this.file = SD.repo().split("/")[1] + "-" + rndInt(1, 4) + "." + rndInt(0, 9) + "." + rndInt(0, 20) + ".tar.gz";
    this.sizeMb = 4 + rnd() * 220;
    return "wget -q --show-progress https://" + SD.host() + "/dist/" + this.file;
  }
  line(frac, speed, eta) {
    return padR(this.file, 28) + " " + padL((frac * 100) | 0, 3) + "%" + bar(frac, 20) + " " +
      padL((this.sizeMb * frac).toFixed(2), 6) + "M  " + speed.toFixed(1) + "MB/s  eta " + Math.max(0, eta).toFixed(0) + "s";
  }
  run() {
    const o = [];
    const speed = 2.5 + rnd() * 9, totalSec = this.sizeMb / speed;
    const steps = clamp((totalSec / 0.25) | 0, 6, 28);
    L(o, 0.3 + rnd() * 0.5, this.line(0, speed, totalSec));
    for (let i = 1; i <= steps; i++) {
      const frac = i / steps;
      R(o, totalSec / steps * (0.7 + rnd() * 0.6), this.line(frac, speed * (0.85 + rnd() * 0.3), totalSec * (1 - frac)));
    }
    R(o, 0.1, padR(this.file, 28) + " 100%[" + rep("=", 20) + "] " + this.sizeMb.toFixed(2) +
      "M  " + speed.toFixed(1) + "MB/s    in " + totalSec.toFixed(1) + "s", SC_GREEN);
    return o;
  }
}

/** git clone — remote counting + receiving objects with progress. */
class GitCloneCommand {
  build() {
    this.repo = SD.repo(); this.name = this.repo.split("/")[1];
    return "git clone https://git.mesh.internal/" + this.repo + ".git";
  }
  // Appends a starting line then replace-updates towards ~95%.
  prog(o, stepDelay, steps, fn, color) {
    L(o, 0.1, fn(rndInt(2, 9)), color);
    for (let i = 1; i <= steps; i++) {
      const p = Math.min(97, ((100 * i / (steps + 1)) | 0) + rndInt(-4, 5));
      R(o, stepDelay * (0.6 + rnd() * 0.8), fn(p), color);
    }
  }
  run() {
    const o = [];
    const objects = 800 + rndInt(12000);
    const deltas = (objects * (0.45 + rnd() * 0.2)) | 0;
    const sizeMb = 0.5 + objects * 0.002 * (0.5 + rnd());
    L(o, 0.3 + rnd() * 0.4, "Cloning into '" + this.name + "'...");
    L(o, 0.4 + rnd() * 0.8, "remote: Enumerating objects: " + objects + ", done.", SC_DIM);

    this.prog(o, 0.05, 3, function (p) {
      return "remote: Counting objects: " + p + "% (" + ((objects * p / 100) | 0) + "/" + objects + ")";
    }, SC_DIM);
    R(o, 0.05, "remote: Counting objects: 100% (" + objects + "/" + objects + "), done.", SC_DIM);

    const compressed = (objects * 0.44) | 0;
    this.prog(o, 0.07, 4, function (p) {
      return "remote: Compressing objects: " + p + "% (" + ((compressed * p / 100) | 0) + "/" + compressed + ")";
    }, SC_DIM);
    R(o, 0.05, "remote: Compressing objects: 100% (" + compressed + "/" + compressed + "), done.", SC_DIM);

    // Receiving is the slow, satisfying part.
    const speed = 1.5 + rnd() * 8;
    this.prog(o, 0.10 + rnd() * 0.10, 9, function (p) {
      return "Receiving objects: " + p + "% (" + ((objects * p / 100) | 0) + "/" + objects + "), " +
        (sizeMb * p / 100).toFixed(2) + " MiB | " + speed.toFixed(2) + " MiB/s";
    });
    R(o, 0.1, "Receiving objects: 100% (" + objects + "/" + objects + "), " + sizeMb.toFixed(2) +
      " MiB | " + speed.toFixed(2) + " MiB/s, done.");

    this.prog(o, 0.06, 4, function (p) {
      return "Resolving deltas: " + p + "% (" + ((deltas * p / 100) | 0) + "/" + deltas + ")";
    });
    R(o, 0.05, "Resolving deltas: 100% (" + deltas + "/" + deltas + "), done.");
    return o;
  }
}

/** tar -xvzf — fast scroll of members, stalling on the large ones. */
const TAR_MEMBERS = ["state/manifest.lock","state/quorum.db","state/ledger.idx","shards/00.bin","shards/01.bin","shards/02.bin","shards/03.bin","keys/seal.key","keys/rotation.pem","hooks/pre-sync.sh","journal/segment-0001.log","journal/segment-0002.log","cache/bloom.bits","cache/hot.idx","config.toml","VERSION"];
class TarCommand {
  build() {
    const d = new Date(Date.now() - rndInt(0, 14) * 86400000);
    this.archive = "snapshot-" + d.getFullYear() + pad0(d.getMonth() + 1, 2) + pad0(d.getDate(), 2) + ".tar.gz";
    this.dest = SD.path();
    return "tar -xvzf " + this.archive + " -C " + this.dest;
  }
  run() {
    const o = [], start = rndInt(TAR_MEMBERS.length);
    const count = 8 + rndInt(TAR_MEMBERS.length - 7);
    for (let i = 0; i < count; i++) {
      const member = TAR_MEMBERS[(start + i) % TAR_MEMBERS.length];
      // .bin shards are "large": the scroll visibly stalls on them.
      const delay = member.endsWith(".bin") ? 0.30 + rnd() * 0.9 : 0.03 + rnd() * 0.06;
      L(o, delay, member);
    }
    return o;
  }
}

/** rsync -az --progress — per-file in-place progress, then the summary. */
class RsyncCommand {
  build() {
    this.host = SD.hostName(); this.dest = SD.path();
    return "rsync -az --progress ./build/ " + this.host + ":" + this.dest + "/";
  }
  run() {
    const o = [];
    L(o, 0.4 + rnd() * 0.8, "sending incremental file list");
    const files = 3 + rndInt(4);
    let totalBytes = 0;
    for (let f = 0; f < files; f++) {
      const name = pick(SD.SourceFiles) + ".o";
      const size = rndInt(40000, 6000000);
      totalBytes += size;
      L(o, 0.10 + rnd() * 0.25, name);
      // The progress line rewrites itself, like the real per-file counter.
      const steps = 2 + rndInt(4);
      for (let s = 1; s <= steps; s++) {
        const frac = s / steps, rate = 2 + rnd() * 60;
        const text = padL(n0i(Math.trunc(size * frac)), 14) + " " + padL(Math.round(frac * 100), 3) +
          "% " + padL(rate.toFixed(2), 7) + "MB/s    0:00:0" + rndInt(0, 2);
        if (s === 1) L(o, 0.10 + rnd() * 0.20, text, SC_DIM);
        else R(o, 0.10 + rnd() * 0.25, text, SC_DIM);
      }
    }
    const secs = 0.8 + rnd() * 4;
    L(o, 0.25, "sent " + n0i(totalBytes) + " bytes  received " + n0i(rndInt(200, 4000)) +
      " bytes  " + n2i(totalBytes / secs / 1000) + " kB/s");
    L(o, 0.05, "total size is " + n0i(totalBytes * (2 + rndInt(4))) + "  speedup is " + (1 + rnd() * 3).toFixed(2));
    return o;
  }
}

/** systemctl status — the ● header block plus a short journal tail. */
class SystemctlStatusCommand {
  build() { this.unit = SD.unit(); return "systemctl status " + this.unit + " --no-pager"; }
  run() {
    const o = [];
    const upH = rndInt(0, 72), upM = rndInt(0, 60);
    const since = new Date(Date.now() - upH * 3600000 - upM * 60000);
    const pid = rndInt(400, 9000);
    const sinceStr = DAYS[since.getDay()] + " " + since.getFullYear() + "-" +
      pad0(since.getMonth() + 1, 2) + "-" + pad0(since.getDate(), 2) + " " + hhmmss(since);
    L(o, 0.15, "● " + this.unit + ".service - Synapse " + this.unit + " daemon", SC_WHITE);
    L(o, 0.02, "     Loaded: loaded (/lib/systemd/system/" + this.unit + ".service; enabled; preset: enabled)");
    L(o, 0.02, "     Active: active (running) since " + sinceStr + " UTC; " + (upH > 0 ? upH + "h " : "") + upM + "min ago", SC_GREEN);
    L(o, 0.02, "   Main PID: " + pid + " (" + this.unit + ")");
    L(o, 0.02, "      Tasks: " + rndInt(4, 64) + " (limit: " + rndInt(8, 76) * 512 + ")");
    L(o, 0.02, "     Memory: " + rndInt(20, 900) + "." + rndInt(0, 9) + "M  CPU: " + rndInt(0, 40) + "min " + rndInt(0, 60) + "." + rndInt(100, 999) + "s");
    L(o, 0.02, "");
    let t = Date.now() - rndInt(5, 120) * 60000;
    for (let i = 0; i < 3; i++) {
      t += rndInt(1, 30) * 60000;
      const line = RD.eventFeedLine();
      const msg = line.t.replace(/^[▸●▲ ]+/, "");
      const d = new Date(t);
      L(o, 0.03, MONTHS[d.getMonth()] + " " + pad0(d.getDate(), 2) + " " + hhmmss(d) + " " +
        SD.hostName() + " " + this.unit + "[" + pid + "]: " + msg, SC_DIM);
    }
    return o;
  }
}

/** curl -sI — one thinking pause, then the header block at once. */
class CurlCommand {
  build() {
    this.host = SD.host();
    this.path = ["healthz","api/v2/quorum","metrics","dist/manifest.json"][rndInt(4)];
    return "curl -sI https://" + this.host + "/" + this.path;
  }
  run() {
    const o = [], d = new Date();
    const date = DAYS[d.getUTCDay()] + ", " + pad0(d.getUTCDate(), 2) + " " + MONTHS[d.getUTCMonth()] + " " +
      d.getUTCFullYear() + " " + pad0(d.getUTCHours(), 2) + ":" + pad0(d.getUTCMinutes(), 2) + ":" + pad0(d.getUTCSeconds(), 2);
    L(o, 0.3 + rnd() * 0.9, "HTTP/2 200", SC_GREEN);
    L(o, 0.02, "server: relayd/" + rndInt(1, 4) + "." + rndInt(0, 12) + "." + rndInt(0, 9));
    L(o, 0.02, "date: " + date + " GMT");
    L(o, 0.02, this.path.endsWith(".json") ? "content-type: application/json" : "content-type: text/plain; charset=utf-8");
    L(o, 0.02, "content-length: " + rndInt(120, 900000));
    L(o, 0.02, "x-mesh-node: " + SD.hostName());
    L(o, 0.02, "x-request-id: " + RD.hex(16).toLowerCase());
    L(o, 0.02, "cache-control: max-age=" + [0, 30, 300, 3600][rndInt(4)]);
    return o;
  }
}

/** sha256sum — one hash line per file, each after its hashing pause. */
class Sha256sumCommand {
  build() { this.dir = SD.path(); return "sha256sum " + this.dir + "/shards/*.bin"; }
  run() {
    const o = [], files = 4 + rndInt(4);
    for (let i = 0; i < files; i++)
      L(o, 0.2 + rnd() * 0.8, RD.hex(64).toLowerCase() + "  " + this.dir + "/shards/" + pad0(i, 2) + ".bin");
    return o;
  }
}

/** top -bn1 — instant one-shot snapshot. */
class TopCommand {
  build() { return "top -bn1 | head -n 12"; }
  run() {
    const o = [], d = new Date();
    const upD = rndInt(0, 90);
    const load = (rnd() * 4).toFixed(2) + ", " + (rnd() * 4).toFixed(2) + ", " + (rnd() * 4).toFixed(2);
    const tasks = rndInt(120, 400);
    L(o, 0.15, "top - " + hhmmss(d) + " up " + upD + " days, " + rndInt(0, 24) + ":" +
      pad0(rndInt(0, 60), 2) + ",  1 user,  load average: " + load, SC_WHITE);
    L(o, 0.02, "Tasks: " + tasks + " total,   " + rndInt(1, 5) + " running, " + (tasks - rndInt(1, 8)) +
      " sleeping,   0 stopped,   0 zombie");
    L(o, 0.02, "%Cpu(s): " + (rnd() * 40).toFixed(1) + " us,  " + (rnd() * 12).toFixed(1) +
      " sy,  0.0 ni, " + (40 + rnd() * 55).toFixed(1) + " id");
    L(o, 0.02, "MiB Mem : " + n1i(64210.4) + " total, " + n1i(rndInt(2000, 35000)) + " free, " + n1i(rndInt(8000, 30000)) + " used");
    L(o, 0.02, "");
    L(o, 0.02, "    PID USER      PR  NI    VIRT    RES  %CPU  %MEM     TIME+ COMMAND", SC_WHITE);
    const shown = 4 + rndInt(3);
    for (let i = 0; i < shown; i++) {
      // %MEM used to inherit a C# custom-format bug from the MAUI build —
      // "0.1" rounded the value to a whole number and appended a literal
      // ".1", so every process on the list ended in .1. Real percentage now.
      L(o, 0.02, padL(rndInt(300, 9999), 7) + " root      20   0 " + padL(rndInt(80000, 4000000), 7) +
        " " + padL(rndInt(10000, 900000), 6) + " " + padL((rnd() * 90).toFixed(1), 5) +
        " " + padL((rnd() * 8).toFixed(1), 5) + " " + rndInt(0, 900) + ":" +
        pad0(rndInt(0, 60), 2) + "." + pad0(rndInt(0, 99), 2) + " " + pick(SD.Units));
    }
    return o;
  }
}

/* ---------------------------------------------------------------------
   Layout + dashboard
   ------------------------------------------------------------------ */

function jitter(base, amount) { return base + (rnd() * 2 - 1) * amount; }

/** Owns every panel and computes the uneven dashboard layout. Split
 *  fractions are jittered once per launch so the geometry differs each
 *  time the page loads. */
class PanelManager {
  constructor() {
    this.leftW = jitter(0.22, 0.02);
    this.centerW = jitter(0.46, 0.02);
    this.bottomH = jitter(0.18, 0.02);
    this.leftSplit = jitter(0.58, 0.04);
    this.rightSplit = jitter(0.55, 0.04);

    this.leftTerminal = new TerminalPanel("SYS://TRACE", T.Green, RD.systemLogLine, 5, 11);
    this.hex = new HexPanel();
    this.code = new CodePanel();
    this.company = new CompanyPanel();
    this.shell = new ShellPanel();
    this.graphs = new GraphPanel(2, true, 3);
    this.progress = new ProgressPanel();
    this.binary = new BinaryPanel();
    this.panels = [this.leftTerminal, this.hex, this.code, this.company,
                   this.shell, this.graphs, this.progress, this.binary];
  }
  update(dt) { for (let i = 0; i < this.panels.length; i++) this.panels[i].update(dt); }
  /** A Layer notices its own geometry changing, but a resize can also
   *  change DPR and re-measure every font while a panel keeps its pixel
   *  size, so drop every cache explicitly rather than reason about it. */
  invalidateAll() {
    for (let i = 0; i < this.panels.length; i++) this.panels[i].layer.invalidate();
  }
  layout(width, height) {
    const gap = 6, margin = 8;
    const w = width - margin * 2, h = height - margin * 2;
    const x0 = margin, y0 = margin;

    const bottomH = h * this.bottomH;
    const topH = h - bottomH - gap;
    const leftW = w * this.leftW;
    const centerW = w * this.centerW;
    const rightW = w - leftW - centerW - gap * 2;
    const cx = x0 + leftW + gap;
    const rx = cx + centerW + gap;

    const set = function (p, x, y, pw, ph) { p.x = x; p.y = y; p.w = pw; p.h = ph; };

    // Left column: tall terminal above hex viewer.
    const leftTermH = topH * this.leftSplit;
    set(this.leftTerminal, x0, y0, leftW, leftTermH);
    set(this.hex, x0, y0 + leftTermH + gap, leftW, topH - leftTermH - gap);

    // Centre column: the endless code writer is the star of the show.
    set(this.code, cx, y0, centerW, topH);

    // Right column: company showcase above the fake terminal.
    const companyH = topH * this.rightSplit;
    set(this.company, rx, y0, rightW, companyH);
    set(this.shell, rx, y0 + companyH + gap, rightW, topH - companyH - gap);

    // Bottom strip: telemetry, task pipeline, binary stream.
    const by = y0 + topH + gap;
    const teleW = w * 0.38, progW = w * 0.36;
    const binW = w - teleW - progW - gap * 2;
    set(this.graphs, x0, by, teleW, bottomH);
    set(this.progress, x0 + teleW + gap, by, progW, bottomH);
    set(this.binary, x0 + teleW + progW + gap * 2, by, binW, bottomH);
  }
}

/** Root: clears, draws the wallpaper + panels, then the CRT overlays. */
class Dashboard {
  constructor() {
    this.panels = new PanelManager();
    this.bg = new BackgroundLayer(pick(BG_KEYS));
    this.time = 0;
    this.flickerTimer = 3; this.flickerLeft = 0;
    this.glitchTimer = 5; this.glitchLeft = 0; this.glitchY = 0;
    this.scanPattern = null;
    this.vignette = null;
  }
  /** Swaps in a different wallpaper without reloading, punctuated with a
   *  glitch burst so the change reads as intentional. Never re-rolls onto
   *  the wallpaper already showing. */
  reroll() {
    let keys = BG_KEYS;
    if (keys.length > 1) {
      const self = this;
      keys = keys.filter(function (k) { return k !== self.bg.key; });
    }
    this.bg = new BackgroundLayer(pick(keys));
    this.glitchLeft = 0.18;
    this.glitchY = rnd();
  }
  resized() {
    this.panels.layout(VW, VH);
    this.panels.invalidateAll();
    this.bg.invalidate();

    // Scanlines as a 4px-tall repeating pattern: one fillRect per frame
    // instead of a DrawLine for every fourth row of a 4K screen.
    const pc = document.createElement("canvas");
    pc.width = 1; pc.height = 4;
    const px = pc.getContext("2d");
    px.fillStyle = "rgba(0,0,0,0.10)";
    px.fillRect(0, 0, 1, 1);
    this.scanPattern = ctx.createPattern(pc, "repeat");

    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, 0.75);
    g.addColorStop(0, "rgba(0,0,0,0)");
    g.addColorStop(0.75, "rgba(0,0,0,0)");
    g.addColorStop(1, "rgba(0,0,0,0.35)");
    this.vignette = g;
  }
  update(dt) {
    this.time += dt;
    this.panels.update(dt);
    this.bg.update(dt);

    this.flickerLeft -= dt;
    this.flickerTimer -= dt;
    if (this.flickerTimer <= 0) {
      this.flickerTimer = 4 + rnd() * 9;
      this.flickerLeft = 0.06 + rnd() * 0.08;
    }
    this.glitchLeft -= dt;
    this.glitchTimer -= dt;
    if (this.glitchTimer <= 0) {
      this.glitchTimer = 6 + rnd() * 12;
      this.glitchLeft = 0.10 + rnd() * 0.15;
      this.glitchY = rnd();
    }
  }
  draw() {
    // Cleared to the wallpaper's own backdrop colour, not the theme black,
    // so a contained image shows no rectangle edge against it.
    ctx.fillStyle = this.bg.backdrop;
    ctx.fillRect(0, 0, VW, VH);
    this.bg.draw(this.glitchLeft > 0 ? 1 : 0);

    const panels = this.panels.panels;
    for (let i = 0; i < panels.length; i++) panels[i].render();

    this.drawOverlays();
  }
  drawOverlays() {
    // Slowly drifting scanlines — subtle so text stays readable.
    if (this.scanPattern) {
      const phase = (this.time * 12) % 4;
      ctx.save();
      ctx.translate(0, phase);
      ctx.fillStyle = this.scanPattern;
      ctx.fillRect(0, -phase, VW, VH + 4);
      ctx.restore();
    }

    // A brighter "refresh band" sweeping down the screen.
    const bandY = ((this.time * 0.09) % 1.25) * VH * 1.25 - VH * 0.125;
    ctx.fillStyle = fade(T.Green, 0.025);
    ctx.fillRect(0, bandY, VW, VH * 0.10);

    if (this.flickerLeft > 0) {
      ctx.fillStyle = "rgba(255,255,255,0.03)";
      ctx.fillRect(0, 0, VW, VH);
    }

    if (this.glitchLeft > 0) {
      const gy = this.glitchY * VH;
      const gh = 3 + ((this.glitchLeft * 40) % 6);
      ctx.fillStyle = fade(T.Cyan, 0.10);
      ctx.fillRect(3, gy, VW, gh);
      ctx.fillStyle = fade(T.Red, 0.08);
      ctx.fillRect(-3, gy + gh, VW, gh * 0.6);
    }

    // Soft radial vignette for the CRT feel.
    if (this.vignette) {
      ctx.save();
      ctx.translate(VW / 2, VH / 2);
      ctx.scale(VW, VH);
      ctx.fillStyle = this.vignette;
      ctx.fillRect(-0.5, -0.5, 1, 1);
      ctx.restore();
    }
  }
}

/* ---------------------------------------------------------------------
   Bootstrap
   ------------------------------------------------------------------ */

let dashboard = null;
function onResize() { if (dashboard) dashboard.resized(); }

window.addEventListener("resize", resize);
// F6 re-rolls the wallpaper, matching the MAUI build's keybind.
window.addEventListener("keydown", function (e) {
  if (e.key === "F6") { e.preventDefault(); dashboard.reroll(); }
});

resize();
dashboard = new Dashboard();
dashboard.resized();

/* --- frame loop ------------------------------------------------------ */

// Everything is delta-time based, so the redraw rate is a pure cost knob:
// on a 144/200 Hz display an uncapped rAF loop would redraw 2-3x as often
// for output that is identical, which as a wallpaper is wasted GPU. 60 is
// the design rate (the MAUI build ran a 60 FPS timer); a host that limits
// the whole desktop lower than that takes over, see wallpaperPropertyListener
// below. The 0.9 factor keeps a display running exactly at the cap from
// occasionally missing its slot and halving.
const FPS_MAX = 60;
let hostFps = -1;                    // -1 until a host reports its limit
let targetDt = 1 / FPS_MAX;
function applyFpsCap() {
  const cap = hostFps >= 0 ? Math.min(hostFps, FPS_MAX) : FPS_MAX;
  targetDt = 1 / Math.max(1, cap);
}

let last = performance.now();
let rafId = 0, wePaused = false;

function tick(now) {
  rafId = requestAnimationFrame(tick);
  let dt = (now - last) / 1000;
  if (dt < targetDt * 0.9) return;
  last = now;
  // Clamp huge gaps (tab suspended, machine asleep) so nothing leaps.
  if (dt > 0.25) dt = 0.25;
  dashboard.update(dt);
  dashboard.draw();
}

// Stop animating while hidden or paused by the host — as a wallpaper this
// may sit behind fullscreen windows for hours.
function syncRunning() {
  const should = !document.hidden && !wePaused;
  if (should && !rafId) {
    last = performance.now();
    rafId = requestAnimationFrame(tick);
  } else if (!should && rafId) {
    cancelAnimationFrame(rafId);
    rafId = 0;
  }
}
document.addEventListener("visibilitychange", syncRunning);
syncRunning();

/* Wallpaper Engine pushes its general settings — among them the frame
   limit it applies to the whole desktop — through this listener, and tells
   the wallpaper when it is paused. In a browser neither ever fires and the
   wallpaper behaves exactly as it always has.
   https://docs.wallpaperengine.io/en/web/performance/fps.html */
window.wallpaperPropertyListener = {
  setPaused: function (p) { wePaused = !!p; syncRunning(); },
  applyGeneralProperties: function (props) {
    // fires for other general properties too — only act when fps is present
    if (!props || props.fps === undefined) return;
    const raw = props.fps;
    const v = Number(raw && typeof raw === "object" ? raw.value : raw);
    if (!Number.isFinite(v) || v < 0) return;
    hostFps = Math.round(v);
    applyFpsCap();
  }
};

/* Debug/test hook. The Claude Browser pane reports document.hidden=true,
   so rAF never fires there; automated checks drive the wallpaper through
   this instead and sample the canvas. step() is synchronous and bypasses
   the frame cap and the running state entirely, so a stepped frame is
   never silently swallowed. Harmless in production. */
window.__hacker = {
  dashboard: function () { return dashboard; },
  panels: function () { return dashboard.panels; },
  backgrounds: BG_KEYS,
  step: function (dt) { dashboard.update(dt === undefined ? 1 / 60 : dt); dashboard.draw(); },
  stop: function () { wePaused = true; syncRunning(); },
  start: function () { wePaused = false; syncRunning(); },
  reroll: function () { dashboard.reroll(); },
  setBackground: function (key) { dashboard.bg = new BackgroundLayer(key); },
  setHostFps: function (v) { window.wallpaperPropertyListener.applyGeneralProperties({ fps: v }); },
  fpsCap: function () { return 1 / targetDt; }
};
</script>
